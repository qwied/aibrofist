<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AIBROFIST — Skin Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="ui.css">
<script src="device.js"></script>
<style>
.seLayout{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
.seStage{border:1px solid var(--line);border-radius:16px;background:var(--soft);
  padding:14px 0 10px;text-align:center;position:relative}
.seNick{width:100%;text-align:center;font-size:17px;padding:10px 0;border:1px solid var(--line);
  border-radius:10px;background:var(--soft);color:var(--muted);margin:12px 0 10px}
.seFree{color:var(--green);font-weight:700;font-size:12px;margin-bottom:6px}
.seLimit{font-size:13px;color:var(--muted);text-align:center;margin-top:2px}

/* холст рисования: пропорции фигуры 100:336, рисуем пальцем и мышью */
#seCanvas{touch-action:none;cursor:crosshair;border-radius:10px;max-width:100%;height:auto}
#seCanvas:active{cursor:crosshair}

/* режим картинки: готовый скин показан вместо холста */
#seImgView svg{max-width:100%;height:auto}
#seImgBar{margin:10px 12px 0}
#seImgNote{font-size:13px;color:var(--muted);margin:8px 12px 2px}

/* панель инструментов */
.seTools{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px 16px}
.seTools.off{opacity:.45;pointer-events:none}
.seLbl{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 7px}
.seLbl:first-child{margin-top:0}
.seHint{font-size:12.5px;color:var(--muted);margin:-3px 0 10px;line-height:1.45}
.sePal{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-bottom:4px}
.seSw{aspect-ratio:1;border-radius:8px;border:2px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
.seSw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--blue)}
.seCustom{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.seCustom input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;
  background:#fff;padding:2px;cursor:pointer}
.seDot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;
  background:currentColor;margin-right:5px}

@media (max-width:820px){
  .seLayout{grid-template-columns:1fr;gap:16px}
}
</style>
        <script src="theme.js"></script>
        <link rel="icon" href="/favicon.ico" sizes="32x32">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">
        <meta name="theme-color" content="#111827">
</head>
<body>

<div class="bfWrap">
  <div class="bfTitle" data-i18n="skinTitle">Редактор скинов</div>
  <div class="bfSub" data-i18n="skinSub">Рисуй свой скин прямо по фигуре — и выложи работу в Skins Browser.</div>

  <div class="seLayout">
    <div>
      <div class="seStage" id="seStage">
        <canvas id="seCanvas" width="200" height="672"></canvas>
        <div id="seImgView" style="display:none"></div>
        <div id="seImgNote" style="display:none" data-i18n="imgModeTxt">Сейчас надет готовый скин-картинка.</div>
        <div id="seImgBar" style="display:none">
          <button class="bfBtn go" id="seDrawBtn" data-i18n="drawAgain">Рисовать</button>
        </div>
      </div>
      <input class="seNick" id="seNick" readonly>
      <button class="bfBtn go" id="seSave" data-i18n="save">Сохранить</button>
      <button class="bfBtn" id="sePublish" data-i18n="publishSkin">Выложить в Skins Browser</button>
      <div class="seLimit" id="seLimit"></div>
      <div class="bfMsg" id="seMsg"></div>
    </div>

    <div>
      <div class="seTools" id="seTools">
        <div class="seLbl" data-i18n="drawZone">Зона рисования</div>
        <div class="bfChips" id="seZones"></div>
        <div class="seHint" data-i18n="drawHint">Нажми на голову или туловище на фигуре слева — редактировать можно только выбранную зону.</div>

        <div class="seLbl" data-i18n="slotColor">Цвет</div>
        <div class="sePal" id="sePal"></div>
        <div class="seCustom">
          <input type="color" id="seColor" value="#e04141">
          <span data-i18n="anyColor">Свой цвет</span>
        </div>

        <div class="seLbl" data-i18n="brushSize">Толщина кисти</div>
        <div class="bfChips" id="seSizes"></div>

        <div class="seLbl" data-i18n="toolLbl">Инструмент</div>
        <div class="bfChips" id="seTool"></div>

        <button class="bfBtn ghost" id="seUndo" data-i18n="undoTxt">Отменить</button>
        <button class="bfBtn ghost" id="seClear" data-i18n="clearZone">Очистить зону</button>
        <button class="bfBtn ghost" id="seClearAll" data-i18n="clearAll">Очистить всё</button>
      </div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="mobile.css">
<script src="i18n.js"></script>
<script src="skinRender.js"></script>
<script src="coin.js"></script>
<script src="shell.js"></script>
<script src="abuseShow.js" defer></script>
<script src="account.js" defer></script>
<script src="owner.js" defer></script>
<script>
(function () {
  'use strict';
  var T = function (k, f) { return (window.I18N && I18N.t(k) !== k) ? I18N.t(k) : (f || k); };
  var $ = function (id) { return document.getElementById(id); };

  /* ======== геометрия фигуры — те же размеры, что в игре (skinRender.js) ======== */
  var S = window.BFSkin;
  var W = S.W, H = S.H;                       // 100 × 336
  var HEAD_R = S.HEAD_R, BODY_TOP = S.BODY_TOP, BODY_H = S.BODY_H, BODY_RX = S.BODY_RX;
  var SCALE = 2;                              // внутренняя плотность холста
  var IW = W * SCALE, IH = H * SCALE;

  var ZONES = {
    head: { key: 'slotHead', fallback: 'Голова',
      path: function (c, grow) {
        c.beginPath();
        c.arc(W / 2, HEAD_R, HEAD_R + (grow || 0), 0, 6.2832);
      } },
    body: { key: 'slotBody', fallback: 'Туловище',
      path: function (c, grow) {
        c.beginPath();
        var g = grow || 0;
        roundRect(c, 0 - g, BODY_TOP - g, W + g * 2, BODY_H + g * 2,
                  Math.min(BODY_RX + g, (BODY_H + g * 2) / 2));
      } }
  };

  /* «около головы» тоже засчитывается: зона выбора чуть больше самой зоны */
  var PICK_PAD = 9;

  var BASE = '#111827';                       // цвет силуэта, как у прячущегося в игре

  /* ======== состояние ======== */
  var st = {
    zone: 'head',       // активная зона
    tool: 'brush',      // brush | eraser
    size: 6,            // логическая толщина
    color: '#e04141',
    img: '',            // надетый скин-картинка (адрес файла)
    drawn: false,       // были ли штрихи хотя бы в одной зоне
    skin: { head: 'h_none', face: 'f_none', body: 'b_none', back: 'k_none' },
    guest: true
  };

  var cv = $('seCanvas');
  cv.width = IW; cv.height = IH;
  var vctx = cv.getContext('2d');

  function mkLayer() {
    var c = document.createElement('canvas');
    c.width = IW; c.height = IH;
    return c;
  }
  var layers = { head: mkLayer(), body: mkLayer() };
  var undoStk = { head: [], body: [] };
  var UNDO_MAX = 25;

  function lctx(z) {
    var c = layers[z].getContext('2d');
    c.setTransform(SCALE, 0, 0, SCALE, 0, 0);
    c.lineCap = 'round';
    c.lineJoin = 'round';
    return c;
  }

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
  }

  /* ======== отрисовка холста ======== */
  function paint() {
    vctx.setTransform(1, 0, 0, 1, 0, 0);
    vctx.clearRect(0, 0, IW, IH);
    vctx.fillStyle = '#ffffff';
    vctx.fillRect(0, 0, IW, IH);

    vctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
    // силуэт персонажа
    vctx.fillStyle = BASE;
    ZONES.head.path(vctx, 0);
    vctx.fill();
    ZONES.body.path(vctx, 0);
    vctx.fill();

    // нарисованные слои
    vctx.drawImage(layers.head, 0, 0, IW, IH);
    vctx.drawImage(layers.body, 0, 0, IW, IH);

    // пунктирная рамка активной зоны
    vctx.save();
    ZONES[st.zone].path(vctx, 0);
    vctx.setLineDash([6, 4]);
    vctx.lineWidth = 1.8;
    vctx.strokeStyle = '#2196F3';
    vctx.stroke();
    vctx.restore();
  }

  /* показ скина-картинки вместо холста */
  function refreshStage() {
    var isImg = !!st.img;
    cv.style.display = isImg ? 'none' : '';
    $('seImgView').style.display = isImg ? '' : 'none';
    $('seImgNote').style.display = isImg ? '' : 'none';
    $('seImgBar').style.display = isImg ? '' : 'none';
    $('seTools').classList.toggle('off', isImg);
    if (isImg) {
      $('seImgView').innerHTML = S.svg({ img: st.img }, null, { height: 300 });
    } else {
      paint();
    }
  }

  /* ======== выбор зоны кликом по фигуре ======== */
  var scratch = document.createElement('canvas').getContext('2d');

  function zoneAt(x, y) {
    var order = ['head', 'body'];
    for (var i = 0; i < order.length; i++) {
      scratch.beginPath();
      ZONES[order[i]].path(scratch, PICK_PAD);
      if (scratch.isPointInPath(x, y)) return order[i];
    }
    return null;
  }

  function evPos(e) {
    var r = cv.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * W,
      y: (e.clientY - r.top) / r.height * H
    };
  }

  var drawing = false, last = null;

  cv.addEventListener('pointerdown', function (e) {
    if (st.img) return;
    e.preventDefault();
    var p = evPos(e);
    var z = zoneAt(p.x, p.y);
    if (!z) return;
    /* первый клик по другой зоне только выбирает её — рисовать начинает
       следующий клик. Так курсор «около головы» переключает зону, а не
       ставит случайную точку. */
    if (z !== st.zone) {
      st.zone = z;
      drawZoneChips(); paint();
      return;
    }
    drawing = true;
    last = p;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    pushUndo(z);
    strokeDot(p);
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    e.preventDefault();
    var p = evPos(e);
    strokeLine(p);
    last = p;
  });
  ['pointerup', 'pointercancel'].forEach(function (t) {
    cv.addEventListener(t, function () { drawing = false; });
  });

  function applyBrush(c) {
    c.lineWidth = st.size;
    if (st.tool === 'eraser') {
      c.globalCompositeOperation = 'destination-out';
      c.strokeStyle = 'rgba(0,0,0,1)';
      c.fillStyle = 'rgba(0,0,0,1)';
    } else {
      c.globalCompositeOperation = 'source-over';
      c.strokeStyle = st.color;
      c.fillStyle = st.color;
    }
  }

  function strokeDot(p) {
    var c = lctx(st.zone);
    c.save();
    ZONES[st.zone].path(c, 0);
    c.clip();
    applyBrush(c);
    c.beginPath();
    c.arc(p.x, p.y, st.size / 2, 0, 6.2832);
    c.fill();
    c.restore();
    st.drawn = true;
    paint();
  }

  function strokeLine(p) {
    var c = lctx(st.zone);
    c.save();
    ZONES[st.zone].path(c, 0);
    c.clip();
    applyBrush(c);
    c.beginPath();
    c.moveTo(last.x, last.y);
    c.lineTo(p.x, p.y);
    c.stroke();
    c.restore();
    paint();
  }

  /* ======== undo / очистка ======== */
  function pushUndo(z) {
    var s = undoStk[z];
    s.push(lctx(z).getImageData(0, 0, IW, IH));
    if (s.length > UNDO_MAX) s.shift();
  }
  function undo() {
    var s = undoStk[st.zone];
    if (!s.length) { msg(T('nothingUndo', 'Отменять нечего')); return; }
    lctx(st.zone).putImageData(s.pop(), 0, 0);
    refreshDrawn();
    if (!st.img) paint();
  }
  function refreshDrawn() {
    st.drawn = undoStk.head.length > 0 || undoStk.body.length > 0 ||
               layerTouched('head') || layerTouched('body');
  }
  function layerTouched(z) {
    var d = layers[z].getContext('2d').getImageData(0, 0, IW, IH).data;
    for (var i = 3; i < d.length; i += 4) if (d[i]) return true;
    return false;
  }

  $('seUndo').onclick = undo;
  $('seClear').onclick = function () {
    if (st.img) return;
    pushUndo(st.zone);
    lctx(st.zone).clearRect(0, 0, W, H);
    refreshDrawn(); paint();
  };
  $('seClearAll').onclick = function () {
    if (st.img) return;
    pushUndo('head'); pushUndo('body');
    lctx('head').clearRect(0, 0, W, H);
    lctx('body').clearRect(0, 0, W, H);
    st.drawn = false; undoStk.head.length = 0; undoStk.body.length = 0;
    paint();
  };

  /* ======== палитра ======== */
  var PALETTE = ['#111827', '#6b7280', '#ffffff', '#e04141', '#f97316', '#f59e0b',
                 '#facc15', '#22a45d', '#0ea5e9', '#2196F3', '#8b5cf6', '#f472b6',
                 '#7c2d12', '#fef3c7'];

  function drawPalette() {
    var box = $('sePal');
    box.innerHTML = '';
    PALETTE.forEach(function (col) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'seSw' + (st.color === col ? ' on' : '');
      b.style.background = col;
      b.setAttribute('aria-label', col);
      b.onclick = function () { st.color = col; $('seColor').value = /^#[0-9a-f]{6}$/i.test(col) ? col : '#e04141'; drawPalette(); setTool(st.tool); };
      box.appendChild(b);
    });
  }
  $('seColor').addEventListener('input', function () {
    st.color = this.value;
    Array.prototype.forEach.call($('sePal').children, function (x) { x.classList.remove('on'); });
    setTool(st.tool);
  });

  var SIZES = [3, 6, 10, 16];

  function drawSizes() {
    var box = $('seSizes');
    box.innerHTML = '';
    SIZES.forEach(function (s) {
      var b = document.createElement('div');
      b.className = 'bfChip' + (st.size === s ? ' on' : '');
      b.innerHTML = '<span class="seDot" style="width:' + Math.max(5, s) + 'px;height:' +
                    Math.max(5, s) + 'px"></span>';
      b.onclick = function () { st.size = s; drawSizes(); };
      box.appendChild(b);
    });
  }

  function setTool(t) {
    st.tool = t;
    var box = $('seTool');
    box.innerHTML = '';
    [['brush', 'brush', 'Кисть'], ['eraser', 'eraser', 'Ластик']].forEach(function (p) {
      var b = document.createElement('div');
      b.className = 'bfChip' + (st.tool === p[0] ? ' on' : '');
      b.textContent = T(p[1], p[2]);
      b.onclick = function () { setTool(p[0]); };
      box.appendChild(b);
    });
  }

  function drawZoneChips() {
    var box = $('seZones');
    box.innerHTML = '';
    Object.keys(ZONES).forEach(function (z) {
      var b = document.createElement('div');
      b.className = 'bfChip' + (st.zone === z ? ' on' : '');
      b.textContent = T(ZONES[z].key, ZONES[z].fallback);
      b.onclick = function () { st.zone = z; drawZoneChips(); paint(); };
      box.appendChild(b);
    });
  }

  /* ======== сообщения и запросы ======== */
  function msg(text, ok) {
    var m = $('seMsg');
    m.textContent = text;
    m.style.color = ok ? 'var(--green)' : 'var(--red)';
    clearTimeout(msg._t);
    msg._t = setTimeout(function () { m.textContent = ''; }, 4000);
  }

  function post(url, data) {
    var body = Object.keys(data).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(data[k]);
    }).join('&');
    return fetch(url, { method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body })
      .then(function (r) { return r.json(); });
  }

  /* ======== экспорт рисунка в PNG (силуэт + оба слоя) ======== */
  function exportPNG() {
    var ex = document.createElement('canvas');
    ex.width = IW; ex.height = IH;
    var c = ex.getContext('2d');
    c.setTransform(SCALE, 0, 0, SCALE, 0, 0);
    c.fillStyle = BASE;
    ZONES.head.path(c, 0);
    c.fill();
    ZONES.body.path(c, 0);
    c.fill();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(layers.head, 0, 0);
    c.drawImage(layers.body, 0, 0);
    return ex.toDataURL('image/png');
  }

  /* ======== кнопки ======== */
  $('seSave').onclick = function () {
    if (st.guest) { msg(T('loginFirst')); return; }
    if (st.img) { msg(T('alreadyOn', 'Этот скин уже сохранён и надет')); return; }
    post('/skin/drawing', { img: exportPNG() })
      .then(function (r) {
        if (r.status !== 'success') { msg(r.message || T('errorTxt')); return; }
        st.img = r.img;
        refreshStage();
        msg(T('saved'), true);
      })
      .catch(function () { msg(T('serverDown')); });
  };

  $('seDrawBtn').onclick = function () {
    st.img = '';                // возвращаемся к холсту, слои сохранены
    refreshStage();
  };

  function limitLine() {
    fetch('/skins/limit', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.guest) { $('seLimit').textContent = ''; return; }
        $('seLimit').textContent = T('skinsLeft', 'Сегодня можно выложить') + ': ' +
          d.left + ' / ' + d.limit + '  ·  +' + d.reward + ' ';
        $('seLimit').innerHTML = $('seLimit').textContent + BFCoin.svg(15);
      }).catch(function () {});
  }

  $('sePublish').onclick = function () {
    if (st.guest) { msg(T('loginFirst')); return; }
    if (st.img) { msg(T('publishDrawnOnly', 'Опубликовать можно только нарисованный здесь скин')); return; }
    var name = prompt(T('skinNameAsk', 'Название скина (2–30 символов):'), '');
    if (name === null) return;
    name = name.trim();
    if (name.length < 2) { msg(T('skinNameShort', 'Слишком короткое название')); return; }

    post('/skins/publish', { skinName: name, skin: JSON.stringify(st.skin), img: exportPNG() })
      .then(function (r) {
        if (r.status !== 'success') { msg(r.message || T('errorTxt')); return; }
        msg(r.message, true);
        limitLine();
        if (window.BFShell) BFShell.refreshCoins(r.coins);
        if (r.img) { st.img = r.img; refreshStage(); }
        if (confirm(r.message + '\n\n' + T('openSkinsBrowser', 'Открыть Skins Browser?')))
          location.href = 'skinsBrowser.html';
      })
      .catch(function () { msg(T('serverDown')); });
  };

  /* ======== старт ======== */
  drawPalette(); drawSizes(); setTool('brush'); drawZoneChips(); refreshStage();

  fetch('/skin/catalog', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      st.skin = d.skin || st.skin;
      st.img = d.img || '';
      st.guest = d.guest;
      refreshStage(); limitLine();
    })
    .catch(function () { msg(T('serverDown')); });

  fetch('/getMyBio', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) { $('seNick').value = d.name || T('guest'); })
    .catch(function () { $('seNick').value = T('guest'); });

  window.addEventListener('bf-lang', function () {
    drawZoneChips(); setTool(st.tool); limitLine();
  });

  /* Мостик для owner.js: панель загрузки картинки живёт там,
     потому что этот файл сервер отдаёт только владельцу. */
  window.BFSkinEditor = {
    setImage: function (url) { st.img = url || ''; refreshStage(); },
    getImage: function () { return st.img; },
    msg: msg,
    refreshLimit: limitLine,
    t: T
  };
  window.dispatchEvent(new CustomEvent('bf-skineditor-ready'));
})();
</script>
        <script src="skinAvatar.js" defer></script>
</body>
</html>
