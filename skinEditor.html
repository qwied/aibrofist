<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AIBrofist — Skin Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="ui.css?v=85">
<script src="device.js?v=85"></script>
<style>
.seLayout{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
.seStage{border:1px solid var(--line);border-radius:16px;background:var(--soft);
  padding:16px 0 10px;text-align:center}
.seStage svg{max-width:100%;height:auto}
.seNick{width:100%;text-align:center;font-size:17px;padding:10px 0;border:1px solid var(--line);
  border-radius:10px;background:var(--soft);color:var(--muted);margin:12px 0 10px}
.seFree{color:var(--green);font-weight:700;font-size:12px;margin-bottom:6px}
.seLimit{font-size:13px;color:var(--muted);text-align:center;margin-top:2px}
@media (max-width:820px){
  .seLayout{grid-template-columns:1fr;gap:16px}
}
</style>
        <script src="theme.js?v=85"></script>
        <link rel="icon" href="/favicon.ico" sizes="32x32">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">
        <meta name="theme-color" content="#111827">
</head>
<body>

<div class="bfWrap">
  <div class="bfTitle" data-i18n="skinTitle">Редактор скинов</div>
  <div class="bfSub" data-i18n="skinSub">Все детали бесплатны. Готовый образ можно выложить в Skins Browser.</div>

  <div class="seLayout">
    <div>
      <div class="seStage" id="seStage"></div>
      <input class="seNick" id="seNick" readonly>
      <button class="bfBtn go" id="seSave" data-i18n="save">Сохранить</button>
      <button class="bfBtn" id="sePublish" data-i18n="publishSkin">Выложить в Skins Browser</button>
      <div class="seLimit" id="seLimit"></div>
      <button class="bfBtn ghost" id="seReset" data-i18n="resetAll">Сбросить</button>
      <div class="bfMsg" id="seMsg"></div>
    </div>

    <div>
      <div class="bfChips" id="seSlots"></div>
      <div id="seList"><div class="bfHint" data-i18n="loading">Загрузка…</div></div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="mobile.css?v=85">
<script src="i18n.js?v=85"></script>
<script src="skinRender.js?v=85"></script>
<script src="coin.js?v=85"></script>
<script src="shell.js?v=85"></script>
<script src="abuseShow.js?v=85" defer></script>
<script src="account.js?v=85" defer></script>
<script src="owner.js?v=85" defer></script>
<script>
(function () {
  'use strict';
  var T = function (k, f) { return (window.I18N && I18N.t(k) !== k) ? I18N.t(k) : (f || k); };
  var SLOT_LABEL = { head:'slotHead', face:'slotFace', body:'slotBody', back:'slotBack' };

  var st = { slots:[], items:[], byId:{}, skin:{}, img:'', slot:'head', guest:true, coins:0 };
  var $ = function (id) { return document.getElementById(id); };

  function msg(text, ok) {
    var m = $('seMsg');
    m.textContent = text;
    m.style.color = ok ? 'var(--green)' : 'var(--red)';
    clearTimeout(msg._t);
    msg._t = setTimeout(function () { m.textContent = ''; }, 4000);
  }

  function post(url, data) {
    var body = Object.keys(data).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(data[k]);
    }).join('&');
    return fetch(url, { method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body })
      .then(function (r) { return r.json(); });
  }

  function drawStage() {
    // если надет скин-картинка, показываем её вместо фигуры
    var what = st.img ? { img: st.img } : st.skin;
    $('seStage').innerHTML = BFSkin.svg(what, st.byId, { height: 300 });
  }

  function drawSlots() {
    var box = $('seSlots'); box.innerHTML = '';
    st.slots.forEach(function (s) {
      var b = document.createElement('div');
      b.className = 'bfChip' + (s === st.slot ? ' on' : '');
      b.textContent = T(SLOT_LABEL[s] || s);
      b.onclick = function () { st.slot = s; drawSlots(); drawList(); };
      box.appendChild(b);
    });
  }

  function drawList() {
    var host = $('seList');
    var list = st.items.filter(function (i) { return i.slot === st.slot; });
    var html = '<div class="bfGrid">';
    list.forEach(function (it) {
      var on = st.skin[it.slot] === it.id;
      var art = BFSkin.preview(it, st.byId, st.skin, 96);
      html += '<div class="bfCard' + (on ? ' on' : '') + '">' + art
            + '<div class="bfCardName">' + it.name + '</div>'
            + '<div class="seFree">' + T('free', 'Бесплатно') + '</div>'
            + (on ? '<button class="bfMini own" disabled>' + T('equipped') + '</button>'
                  : '<button class="bfMini" data-pick="' + it.id + '">' + T('equip') + '</button>')
            + '</div>';
    });
    host.innerHTML = html + '</div>';
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-pick]');
    if (!b) return;
    var it = st.byId[b.dataset.pick];
    if (!it) return;
    st.skin[it.slot] = it.id;      // сразу видно на модели, даже у гостя
    st.img = '';                   // детали и картинка одновременно не бывают
    drawStage(); drawList();
    if (!st.guest) post('/skin/equip', { slot: it.slot, id: it.id }).catch(function () {});
  });

  $('seSave').onclick = function () {
    if (st.guest) { msg(T('loginFirst')); return; }
    post('/skin/save', { skin: JSON.stringify(st.skin) })
      .then(function (r) { r.status === 'success' ? msg(T('saved'), true) : msg(T('loginFirst')); })
      .catch(function () { msg(T('serverDown')); });
  };

  $('seReset').onclick = function () {
    st.skin = { head:'h_none', face:'f_none', body:'b_none', back:'k_none' };
    st.img = '';
    drawStage(); drawList();
  };

  function limitLine() {
    fetch('/skins/limit', { credentials:'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.guest) { $('seLimit').textContent = ''; return; }
        $('seLimit').textContent = T('skinsLeft', 'Сегодня можно выложить') + ': ' +
          d.left + ' / ' + d.limit + '  ·  +' + d.reward + ' ';
        $('seLimit').innerHTML = $('seLimit').textContent + BFCoin.svg(15);
      }).catch(function () {});
  }

  $('sePublish').onclick = function () {
    if (st.guest) { msg(T('loginFirst')); return; }
    var name = prompt(T('skinNameAsk', 'Название скина (2–30 символов):'), '');
    if (name === null) return;
    name = name.trim();
    if (name.length < 2) { msg(T('skinNameShort', 'Слишком короткое название')); return; }

    post('/skins/publish', { skinName: name, skin: JSON.stringify(st.skin) })
      .then(function (r) {
        if (r.status !== 'success') { msg(r.message || T('errorTxt')); return; }
        msg(r.message, true);
        limitLine();
        if (window.BFShell) BFShell.refreshCoins(r.coins);
        if (confirm(r.message + '\n\n' + T('openSkinsBrowser', 'Открыть Skins Browser?')))
          location.href = 'skinsBrowser.html';
      })
      .catch(function () { msg(T('serverDown')); });
  };

  fetch('/skin/catalog', { credentials:'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      st.slots = d.slots; st.items = d.items; st.skin = d.skin;
      st.img = d.img || '';
      st.guest = d.guest; st.coins = d.coins; st.slot = d.slots[0];
      d.items.forEach(function (i) { st.byId[i.id] = i; });
      drawStage(); drawSlots(); drawList(); limitLine();
    })
    .catch(function () { $('seList').innerHTML = '<div class="bfHint">' + T('serverDown') + '</div>'; });

  fetch('/getMyBio', { credentials:'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) { $('seNick').value = d.name || T('guest'); })
    .catch(function () { $('seNick').value = T('guest'); });

  window.addEventListener('bf-lang', function () { drawSlots(); drawList(); });

  /* Мостик для owner.js: панель загрузки картинки живёт там,
     потому что этот файл сервер отдаёт только владельцу. */
  window.BFSkinEditor = {
    setImage: function (url) { st.img = url || ''; drawStage(); },
    getImage: function () { return st.img; },
    msg: msg,
    refreshLimit: limitLine,
    t: T
  };
  window.dispatchEvent(new CustomEvent('bf-skineditor-ready'));
})();
</script>
        <script src="skinAvatar.js?v=85" defer></script>
</body>
</html>
