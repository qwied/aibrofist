<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AIBrofist — Avatar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="ui.css">
<script src="device.js"></script>
<style>
.avLayout{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
.avStage{border:1px solid var(--line);border-radius:16px;background:var(--soft);
  padding:16px 0 10px;text-align:center}
.avStage svg{max-width:100%;height:auto}
.avNick{width:100%;text-align:center;font-size:17px;padding:10px 0;border:1px solid var(--line);
  border-radius:10px;background:var(--soft);color:var(--muted);margin:12px 0 6px}
.avBy{text-align:center;font-size:13px;color:var(--muted);margin-bottom:12px;min-height:18px}
.avBy a{color:var(--blue);text-decoration:none}
.avArt{background:var(--soft);border-radius:10px;padding:8px 0;margin-bottom:8px}
.avPrice{font-weight:700;color:var(--gold);font-size:14px;margin-bottom:6px}
.avPrice.free{color:var(--green)}
@media (max-width:820px){
  .avLayout{grid-template-columns:1fr;gap:16px}
}
</style>
	<script src="theme.js"></script>
</head>
<body>

<div class="bfWrap">
  <div class="bfTitle" data-i18n="avatar">Avatar</div>
  <div class="bfSub" data-i18n="avatarSub">Готовые скины, отобранные разработчиком. Автор каждого скина указан на карточке.</div>

  <div class="avLayout">
    <div>
      <div class="avStage" id="avStage"></div>
      <input class="avNick" id="avNick" readonly>
      <div class="avBy" id="avBy"></div>
      <button class="bfBtn" id="avGoEditor" data-i18n="skinEditor">Редактор скинов</button>
      <button class="bfBtn ghost" id="avGoBrowser" data-i18n="skinsBrowser">Skins Browser</button>
      <div class="bfMsg" id="avMsg"></div>
    </div>

    <div>
      <div id="avList"><div class="bfHint" data-i18n="loading">Загрузка…</div></div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="mobile.css">
<script src="i18n.js"></script>
<script src="skinRender.js"></script>
<script src="coin.js"></script>
<script src="shell.js"></script>
<script src="account.js" defer></script>
<script src="owner.js" defer></script>
<script>
(function () {
  'use strict';
  var T = function (k, f) { return (window.I18N && I18N.t(k) !== k) ? I18N.t(k) : (f || k); };
  var $ = function (id) { return document.getElementById(id); };
  var byId = {}, mySkin = {}, wearing = '';

  function msg(t, ok) {
    var m = $('avMsg');
    m.textContent = t; m.style.color = ok ? 'var(--green)' : 'var(--red)';
    clearTimeout(msg._t); msg._t = setTimeout(function () { m.textContent = ''; }, 4000);
  }
  function post(url, data) {
    var body = Object.keys(data).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(data[k]);
    }).join('&');
    return fetch(url, { method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body })
      .then(function (r) { return r.json(); });
  }
  // у скина-картинки рисуем саму картинку, а не фигуру
  function withImg(rec) {
    var sk = Object.assign({}, rec.skin || {});
    if (rec.img) sk.img = rec.img;
    return sk;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
    });
  }

  function drawMe() {
    $('avStage').innerHTML = BFSkin.svg(mySkin, byId, { height: 300 });
  }

  function whoMadeIt() {
    fetch('/getMyName', { credentials:'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (name) {
        $('avNick').value = name || T('guest');
        if (!name) return;
        return fetch('/skins/wornBy?name=' + encodeURIComponent(name), { credentials:'same-origin' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            $('avBy').innerHTML = d.author
              ? T('skinBy', 'Скин') + ': «' + esc(d.skinName) + '» — '
                + '<a href="users.html?name=' + encodeURIComponent(d.author) + '">' + esc(d.author) + '</a>'
              : '<span style="color:#9aa3ad">' + T('ownSkin', 'Собственный образ') + '</span>';
          });
      }).catch(function () { $('avNick').value = T('guest'); });
  }

  function card(s) {
    var art = BFSkin.render(withImg(s), byId, { height: 148 });
    var price = (s.price > 0)
      ? '<div class="avPrice">' + s.price + ' ' + BFCoin.svg(15) + '</div>'
      : '<div class="avPrice free">' + T('free', 'Бесплатно') + '</div>';
    var act = (s.id === wearing)
      ? '<button class="bfMini own" disabled>' + T('equipped') + '</button>'
      : (s.owned || s.price === 0
          ? '<button class="bfMini own" data-wear="' + s.id + '">' + T('equip') + '</button>'
          : '<button class="bfMini" data-buy="' + s.id + '">' + T('buy') + '</button>');

    return '<div class="bfCard' + (s.id === wearing ? ' on' : '') + '">'
      + '<div class="avArt">' + art + '</div>'
      + '<div class="bfCardName">' + esc(s.skinName) + '</div>'
      + '<div class="bfCardMeta">' + T('colAuthor', 'Автор') + ': '
      +   '<a href="users.html?name=' + encodeURIComponent(s.author) + '" style="color:var(--blue);text-decoration:none">'
      +   esc(s.author) + '</a></div>'
      + price + act + '</div>';
  }

  function load() {
    fetch('/skins/avatar', { credentials:'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        wearing = d.wearing || '';
        if (window.BFShell && d.coins !== undefined) BFShell.refreshCoins(d.coins);
        $('avList').innerHTML = d.skins.length
          ? '<div class="bfGrid">' + d.skins.map(card).join('') + '</div>'
          : '<div class="bfHint">' + T('avatarEmpty',
              'Разработчик пока не отобрал ни одного скина. Свои образы можно выкладывать в Skins Browser.') + '</div>';
      })
      .catch(function () { $('avList').innerHTML = '<div class="bfHint">' + T('serverDown') + '</div>'; });
  }

  document.addEventListener('click', function (e) {
    var w = e.target.closest && e.target.closest('[data-wear]');
    var b = e.target.closest && e.target.closest('[data-buy]');
    if (w) {
      post('/skins/wear', { id: w.dataset.wear }).then(function (r) {
        if (r.status !== 'success') { msg(r.message || T('errorTxt')); return; }
        mySkin = r.skin; wearing = w.dataset.wear;
        drawMe(); whoMadeIt(); load();
        msg(T('wornOk', 'Скин надет'), true);
      }).catch(function () { msg(T('serverDown')); });
    }
    if (b) {
      post('/skins/buy', { id: b.dataset.buy }).then(function (r) {
        if (r.status !== 'success') { msg(r.message || T('errorTxt')); return; }
        if (window.BFShell) BFShell.refreshCoins(r.coins);
        msg(T('bought', 'Куплено'), true);
        load();
      }).catch(function () { msg(T('serverDown')); });
    }
  });

  $('avGoEditor').onclick = function () { location.href = 'skinEditor.html'; };
  $('avGoBrowser').onclick = function () { location.href = 'skinsBrowser.html'; };

  fetch('/skin/catalog', { credentials:'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      (d.items || []).forEach(function (i) { byId[i.id] = i; });
      mySkin = d.skin; drawMe(); load(); whoMadeIt();
    })
    .catch(function () { $('avList').innerHTML = '<div class="bfHint">' + T('serverDown') + '</div>'; });

  window.addEventListener('bf-lang', function () { load(); whoMadeIt(); });
})();
</script>
	<script src="skinAvatar.js" defer></script>
</body>
</html>
