    var o = objects[objects.length-1];
    o.w = drag.w; o.h = drag.h;
    o.x = snapN(drag.ox-o.w/2); o.y = snapN(drag.oy-o.h/2);
    inspect();
  }
  drag = null;
}

var pan = null, spaceDown = false;

/* Двигать карту можно:
     · правой кнопкой мыши (в любой момент)
     · средней кнопкой или пробелом с левой
     · инструментом «Рука»
     · левой кнопкой по пустому месту, когда выбрано «Выделение»
   На телефоне — просто протащить пальцем по пустому месту либо
   включить «Руку» и тащить где угодно. */
function startPan(sx, sy){
  pan = {sx:sx, sy:sy, vx:view.x, vy:view.y};
  cv.style.cursor = "grabbing";
}
function wantPan(x, y){
  if(tool === "hand") return true;
  if(tool !== "select") return false;
  return !gripAt(x, y) && !at(x, y);      // пусто под курсором — тащим карту
}

cv.addEventListener("mousedown", function(e){
  if(playing) return;
  if(e.button === 1 || e.button === 2 || (e.button === 0 && spaceDown)){
    startPan(e.offsetX, e.offsetY); e.preventDefault(); return;
  }
  if(e.button !== 0) return;
  var p = toWorld(e.offsetX, e.offsetY);
  if(wantPan(p.x, p.y)){
    if(tool === "select" && sel){ sel = null; inspect(); }
    startPan(e.offsetX, e.offsetY); e.preventDefault(); return;
  }
  down(p.x, p.y, e.altKey, e.shiftKey);
});
cv.addEventListener("mousemove", function(e){
  if(playing) return;
  if(pan){ view.x = pan.vx+(e.offsetX-pan.sx); view.y = pan.vy+(e.offsetY-pan.sy); return; }
  var p = toWorld(e.offsetX, e.offsetY);
  mouseW = p;                       // запоминаем для Ctrl+V
  move(p.x, p.y);
});
addEventListener("mouseup", function(){
  if(pan){ pan = null; cv.style.cursor = tool === "hand" ? "grab" : (tool === "select" ? "default" : "crosshair"); return; }
  up();
});
cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });
/* Колесо работает и в игре тоже: камера следит за игроком, но масштаб
   остаётся тот, что выставил сам игрок. Раньше зум в игре был запрещён,
   и разглядеть карту во время прохождения было нельзя. */
cv.addEventListener("wheel", function(e){
  e.preventDefault();
  zoomAt(e.offsetX, e.offsetY, e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive:false});

var pinch = null;
function tD(a,b){ var x = a.clientX-b.clientX, y = a.clientY-b.clientY; return Math.sqrt(x*x+y*y); }
function tM(a,b){ return cPt((a.clientX+b.clientX)/2, (a.clientY+b.clientY)/2); }
cv.addEventListener("touchstart", function(e){
  if(playing) return;
  if(e.touches.length === 2){ drag = null; var m = tM(e.touches[0],e.touches[1]);
    pinch = {d:tD(e.touches[0],e.touches[1]), x:m.x, y:m.y}; e.preventDefault(); return; }
  if(e.touches.length !== 1) return;
  var c = cPt(e.touches[0].clientX, e.touches[0].clientY), p = toWorld(c.x,c.y);
  if(wantPan(p.x, p.y)){
    if(tool === "select" && sel){ sel = null; inspect(); }
    startPan(c.x, c.y); e.preventDefault(); return;
  }
  down(p.x,p.y); e.preventDefault();
}, {passive:false});
cv.addEventListener("touchmove", function(e){
  if(playing) return;
  if(e.touches.length === 2 && pinch){
    var d = tD(e.touches[0],e.touches[1]), m = tM(e.touches[0],e.touches[1]);
    if(pinch.d > 0) zoomAt(m.x,m.y,d/pinch.d);
    view.x += m.x-pinch.x; view.y += m.y-pinch.y;
    pinch.d = d; pinch.x = m.x; pinch.y = m.y; e.preventDefault(); return;
  }
  if(e.touches.length !== 1 || pinch) return;
  var c = cPt(e.touches[0].clientX, e.touches[0].clientY);
  if(pan){
    view.x = pan.vx + (c.x - pan.sx);
    view.y = pan.vy + (c.y - pan.sy);
    e.preventDefault(); return;
  }
  var p = toWorld(c.x,c.y);
  move(p.x,p.y); e.preventDefault();
}, {passive:false});
cv.addEventListener("touchend", function(e){
  if(playing) return;
  if(e.touches.length === 0){
    pinch = null;
    if(pan){ pan = null; cv.style.cursor = tool === "hand" ? "grab" : "default"; }
    else up();
  }
  e.preventDefault();
}, {passive:false});

/* Пока пишешь в чат, ходить всё равно можно: стрелки остаются за игроком,
   а буквы уходят в текст. Раньше любое поле ввода блокировало управление
   целиком, и во время набора игрок стоял столбом. */
function typingInChat(){
  var el = document.activeElement;
  return !!(el && el.id === "gMsg");
}
function inSomeField(){
  var el = document.activeElement;
  if(!el) return false;
  if(el.id === "gMsg") return false;                 // чат — особый случай
  return el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable;
}
function movementKey(code){
  return code === "ArrowLeft" || code === "ArrowRight" || code === "ArrowUp";
}

document.addEventListener("keydown", function(e){
  if(inSomeField()) return;
  if(playing){
    // в чате слушаем только стрелки, иначе буквы не набрать
    if(typingInChat() && !movementKey(e.code)) return;
    if(typingInChat()) e.preventDefault();           // курсор в поле не двигаем

    if(e.code === "ArrowLeft" || e.code === "KeyA") keys.l = true;
    if(e.code === "ArrowRight"|| e.code === "KeyD") keys.r = true;
    if(e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space"){ keys.u = true; buf = BUFFER; e.preventDefault(); }
    if(e.code === "KeyR"){ clearTimeout(finishTimer); restartRun(); }
    if(e.code === "Escape") stop();
    return;
  }
  var mod = e.ctrlKey || e.metaKey;
  if(mod && e.code === "KeyZ"){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if(mod && e.code === "KeyY"){ e.preventDefault(); redo(); return; }
  if(mod && e.code === "KeyD"){ e.preventDefault(); duplicate(); return; }
  /* Ctrl+C кладёт объект в буфер, Ctrl+V ставит копию по центру под
     курсором — там, где мышь была в последний раз над холстом. */
  if(mod && e.code === "KeyC"){ e.preventDefault(); copySel(); return; }
  if(mod && e.code === "KeyV"){ e.preventDefault(); pasteAt(mouseW.x, mouseW.y); return; }
  if(e.code === "Space"){ spaceDown = true; e.preventDefault(); }
  if(e.code === "KeyG"){ grid = !grid; document.getElementById("bGrid").classList.toggle("on", grid); }
  if((e.key === "Delete" || e.key === "Backspace") && sel){ removeSel(); }
  if(e.key === "+" || e.key === "=") zoomAt(VW()/2, VH()/2, 1.15);
  if(e.key === "-" || e.key === "_") zoomAt(VW()/2, VH()/2, 1/1.15);
  if(e.key === "0") resetView();
});
document.addEventListener("keyup", function(e){
  if(inSomeField()) return;
  if(e.code === "Space") spaceDown = false;
  if(playing){
    if(e.code === "ArrowLeft" || e.code === "KeyA") keys.l = false;
    if(e.code === "ArrowRight"|| e.code === "KeyD") keys.r = false;
    if(e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") keys.u = false;
  }
});
function pad(id, fn){
  var e = document.getElementById(id);
  ["touchstart","mousedown"].forEach(function(t){ e.addEventListener(t,function(ev){ fn(true); ev.preventDefault(); },{passive:false}); });
  ["touchend","touchcancel","mouseup","mouseleave"].forEach(function(t){ e.addEventListener(t,function(ev){ fn(false); ev.preventDefault(); },{passive:false}); });
}
pad("pLeft",  function(v){ keys.l = v; });
pad("pRight", function(v){ keys.r = v; });
pad("pJump",  function(v){ keys.u = v; if(v) buf = BUFFER; });

function duplicate(){
  if(!sel) return;
  if(sel.type === "coin" && coinCapped() && countCoins() >= COIN_LIMIT){ coinWarn(); return; }
  if(overLimit(1)) return;
  commit();
  var c = JSON.parse(JSON.stringify(sel));
  c.id = uid++; c.x += 20; c.y += 20;
  if(c.customId) c.customId = "w"+c.id;
  objects.push(c); sel = c; inspect();
}
function removeSel(){
  if(!sel) return;
  commit();
  objects = objects.filter(function(o){ return o !== sel; });
  sel = null;
  inspect();
}

var props = document.getElementById("props");
document.getElementById("inspHead").addEventListener("click", function(e){
  if(e.target.id === "inspClose"){ sel = null; inspect(); return; }
  var t = e.target.closest(".tab"); if(!t || !t.dataset.tab) return;
  document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("on", x === t); });
  props.style.display = t.dataset.tab === "props" ? "block" : "none";
  document.getElementById("widgets").style.display = t.dataset.tab === "widgets" ? "block" : "none";
});
function pr(){ var d = document.createElement("div"); d.className = "pRow"; props.appendChild(d); return d; }
function num(l,v,fn){
  var r = pr(), a = document.createElement("label"); a.textContent = l;
  var i = document.createElement("input"); i.type = "number"; i.value = Math.round(v);
  i.addEventListener("focus", commit);
  i.addEventListener("input", function(){ fn(parseFloat(i.value)||0); });
  r.appendChild(a); r.appendChild(i);
}
/* Ползунок с числом рядом: удобнее, чем поле ввода, когда важно
   быстро нащупать значение на слух, а не вписать точное. */
function rng(l, v, lo, hi, step, fn){
  var r = pr(), a = document.createElement("label"); a.textContent = l;
  var i = document.createElement("input");
  i.type = "range"; i.min = lo; i.max = hi; i.step = step; i.value = v;
  i.style.cssText = "width:74px;accent-color:var(--accent)";
  var b = document.createElement("b");
  b.style.cssText = "font-size:11.5px;min-width:26px;text-align:right;color:var(--accent)";
  b.textContent = (+v).toFixed(step < 1 ? 2 : 0);
  i.addEventListener("focus", commit);
  i.addEventListener("pointerdown", commit);
  i.addEventListener("input", function(){
    var val = parseFloat(i.value);
    b.textContent = val.toFixed(step < 1 ? 2 : 0);
    fn(val);
  });
  r.appendChild(a); r.appendChild(i); r.appendChild(b);
}
function txt(l,v,fn){
  var r = pr(), a = document.createElement("label"); a.textContent = l;
  var i = document.createElement("input"); i.type = "text"; i.value = v||"";
  i.addEventListener("focus", commit);
  i.addEventListener("input", function(){ fn(i.value); });
  r.appendChild(a); r.appendChild(i);
}
function chk(l,v,fn){
  var r = pr(), a = document.createElement("label"); a.textContent = l;
  var i = document.createElement("input"); i.type = "checkbox"; i.checked = !!v;
  i.addEventListener("change", function(){ commit(); fn(i.checked); });
  r.appendChild(a); r.appendChild(i);
}
function grp(t){ var d = document.createElement("div"); d.className = "grp"; d.textContent = t; props.appendChild(d); }

/* Как связать механизм. Показываем у кнопок, рычагов и их целей —
   там, где это действительно нужно, и по клику, а не постоянной надписью. */
function linkHelp(){
  var d = document.createElement("div");
  d.className = "pHelp";
  var h = document.createElement("div");
  h.className = "pHelpHead";
  h.textContent = "Как связать? ▾";
  var b = document.createElement("div");
  b.className = "pHelpBody";
  b.innerHTML =
      "1. У <b>Ворот</b> задай <b>ID</b> — например <code>g1</code>.<br>"
    + "2. У <b>Кнопки</b> или <b>Рычага</b> впиши тот же <code>g1</code> в поле <b>Цели</b>.<br>"
    + "3. Нажми ▶ — блок откроется от кнопки.<br><br>"
    + "Целей можно указать несколько через запятую: <code>g1,g2</code>.<br>"
    + "Кнопка держит, пока на ней стоят. Рычаг переключает насовсем.";
  h.onclick = function(){
    var open = b.style.display === "block";
    b.style.display = open ? "none" : "block";
    h.textContent = open ? "Как связать? ▾" : "Как связать? ▴";
  };
  d.appendChild(h); d.appendChild(b);
  props.appendChild(d);
}
function inspect(){
  var box = document.getElementById("insp");
  /* Кисть воды: настройки струи видны при выбранном инструменте «Вода»,
     пока ничего не выделено — цвет и кислоту крутятся не отвлекаясь. */
  if(!sel && tool === "water" && !playing){
    box.style.display = "flex";
    props.innerHTML = "";
    var wh = document.createElement("div"); wh.id = "objTitle";
    wh.innerHTML = 'Вода<span>кисть</span>';
    props.appendChild(wh);
    var wr = pr();
    wr.innerHTML = "<label>Цвет воды</label>";
    var wci = document.createElement("input"); wci.type = "color";
    wci.value = (brush.fill && brush.fill[0] === "#" && brush.fill.length === 7) ? brush.fill : C.water1;
    wci.addEventListener("input", function(){ brush.fill = wci.value; saveBrush(); });
    wr.appendChild(wci);
    props.appendChild(wr);
    chk("Кислота (убивает)", brush.deadly, function(v){ brush.deadly = v; saveBrush(); });
    var wh2 = document.createElement("div");
    wh2.className = "pHelpBody"; wh2.style.display = "block";
    wh2.innerHTML = "Зажми кнопку — <b>вода льётся из курсора</b>: капли падают, "
      + "плюхаются и оседают в лужи. Льёшь дольше — уровень выше.<br><br>"
      + "<b>Shift</b> + перетаскивание — ровный бассейн прямоугольником.<br>"
      + "Править налитое — инструментом «Выделение».";
    props.appendChild(wh2);
    return;
  }
  if(!sel || playing){ box.style.display = "none"; return; }
  box.style.display = "flex";
  props.innerHTML = "";
  var T = TOOLS.filter(function(x){ return x.t === sel.type; })[0];
  var head = document.createElement("div"); head.id = "objTitle";
  head.innerHTML = (T ? T.n : sel.type) + "<span>#" + sel.id + "</span>";
  props.appendChild(head);

  num("X", sel.x, function(v){ sel.x = v; });
  num("Y", sel.y, function(v){ sel.y = v; });
  /* Размер игрока задан движком (20x60) и не редактируется, иначе одна
     и та же карта проходится по-разному у разных авторов. */
  if(sel.type !== "spawn"){
    num("Ширина", sel.w, function(v){ sel.w = Math.max(1,v); });
    num("Высота", sel.h, function(v){ sel.h = Math.max(1,v); });
    num("Поворот", sel.rot||0, function(v){ sel.rot = v; });
  } else {
    var sr = pr();
    sr.innerHTML = "<label>Размер</label><b style='font-size:12px'>20 x 60</b>";
  }

  {
    var r = pr();
    r.innerHTML = "<label>Цвет</label>";
    var ci = document.createElement("input"); ci.type = "color";
    ci.value = (sel.fill && sel.fill[0] === "#" && sel.fill.length === 7) ? sel.fill : "#4b5563";
    ci.addEventListener("focus", commit);
    ci.addEventListener("input", function(){ sel.fill = ci.value; });
    r.appendChild(ci);
  }
  if(sel.type === "text") txt("Текст", sel.text, function(v){ sel.text = v; });

  grp("Игровые свойства");
  if(["spawn","checkpoint","finishline","coin"].indexOf(sel.type) === -1)
    /* у воды галочка своя: кислота убивает, обычная вода — нет.
       Механика та же, что у яда, но автору понятнее слово. */
    chk(sel.type === "water" ? "Кислота (убивает)" : "Яд (убивает)",
        sel.deadly, function(v){ sel.deadly = v; });
  if(SOLID.indexOf(sel.type) !== -1)
    chk("Проходимый (декорация)", !!sel.ghost, function(v){ sel.ghost = v; });
  /* Прятки: за таким объектом игрок исчезает для искателя вместе с ником.
     Коллизии у него нет — иначе внутрь не зайти. */
  if(SOLID.indexOf(sel.type) !== -1 && mode === "hideAndSeek")
    chk("Укрытие для пряток", !!sel.hideSpot, function(v){ sel.hideSpot = v; });
  /* Рикошет, движение и вращение — свойства, а не отдельные объекты.
     Любой блок можно сделать отражающим, подвижным или крутящимся. */
  if(SOLID.indexOf(sel.type) !== -1){
    /* Рикошет вместо батута: удар отражается от той грани, в которую
       попал игрок, а не подбрасывает его всегда вверх. */
    chk("Рикошет", !!sel.ricochet, function(v){ sel.ricochet = v; inspect(); });
    /* Сила отскока: 1 — вернуть с той же скоростью, больше — подбросить
       сильнее. Направление берётся от той грани, в которую попал игрок,
       поэтому наклонный батут отправляет по диагонали. */
    if(sel.ricochet)
      rng("Сила отскока", sel.power === undefined ? 1 : sel.power, 0.2, 3, 0.1,
          function(v){ sel.power = v; });

    chk("Двигается", !!sel.moves, function(v){
      sel.moves = v;
      if(v && !sel.moveX && !sel.moveY){ sel.moveX = 130; sel.moveY = 0; sel.speed = 1.1; }
      inspect();
    });
    if(sel.moves){
      num("Ход по X", sel.moveX||0, function(v){ sel.moveX = v; });
      num("Ход по Y", sel.moveY||0, function(v){ sel.moveY = v; });
      num("Скорость", sel.speed||1, function(v){ sel.speed = v; });
    }

    chk("Вращается", !!sel.spins, function(v){
      sel.spins = v;
      if(v && !sel.spin) sel.spin = 2;
      inspect();
    });
    if(sel.spins) num("Скорость вращения", sel.spin||2, function(v){ sel.spin = v; });
  }
  if(LINKED.indexOf(sel.type) !== -1){
    grp("Связи");
    txt("ID", sel.customId, function(v){ sel.customId = v; });
    if(sel.type === "button" || sel.type === "lever") txt("Цели", sel.targetIds, function(v){ sel.targetIds = v; });
    if(SOLID.indexOf(sel.type) !== -1)
      chk("Открыт сначала (проходим)", sel.startsOpen, function(v){ sel.startsOpen = v; });
    linkHelp();
  }

  grp("Порядок");
  var z = document.createElement("div"); z.className = "zBtns";
  z.innerHTML = "<div data-z='b'>На зад</div><div data-z='f'>Вперёд</div>";
  z.addEventListener("click", function(e){
    var b = e.target.closest("[data-z]"); if(!b) return;
    commit();
    objects = objects.filter(function(o){ return o !== sel; });
    b.dataset.z === "f" ? objects.push(sel) : objects.unshift(sel);
  });
  props.appendChild(z);
}

/* ══════════════════════════════════════════════════
   SAVE / LOAD  (.txt of decimal numbers, signed)
   ══════════════════════════════════════════════════ */
var DEV_KEY = "ARTEM_DEV_ONLY";
function fnv(s){
  var h = 0x811c9dc5;
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0; }
  return h.toString(16).padStart(8,"0");
}
function nativeZip(){ return typeof CompressionStream !== "undefined" && typeof DecompressionStream !== "undefined"; }
async function drain(rs){
  var rd = rs.getReader(), ch = [], n = 0, r;
  while(true){ r = await rd.read(); if(r.done) break; ch.push(r.value); n += r.value.length; }
  var out = new Uint8Array(n), off = 0;
  ch.forEach(function(c){ out.set(c,off); off += c.length; });
  return out;
}
async function zip(str){
  var raw = new TextEncoder().encode(str);
  if(nativeZip()){
    try{ var cs = new CompressionStream("deflate-raw"), w = cs.writable.getWriter();
      w.write(raw); w.close(); return {b: await drain(cs.readable), m:1};
    }catch(e){}
  }
  return {b:raw, m:0};
}
async function unzip(bytes, m){
  if(m === 1 && nativeZip()){
    var ds = new DecompressionStream("deflate-raw"), w = ds.writable.getWriter();
    w.write(bytes); w.close();
    return new TextDecoder().decode(await drain(ds.readable));
  }
  return new TextDecoder().decode(bytes);
}
function clean(){

/* ── Импорт карт из оригинального brofist.io ───────────────────────
   Файл оттуда — список байтов со знаком, внутри LZMA, внутри JSON сцены.
   Распаковка и перевод в наши объекты: lzma.js + bfImport.js.        */
function importOriginal(raw){
  if(!window.BFImport){ dialog("Импорт недоступен","Не загружен bfImport.js.",null); return false; }
  var scene, want;
  try{
    scene = BFImport.parseScene(raw);
    want = BFImport.suggestMode(scene);
  }catch(err0){
    dialog("Не получилось прочитать карту", String(err0.message || err0), null);
    return false;
  }

  var switched = "";
  if(want && want !== mode && allowedIn("rect", want)){
    switched = mode + " → " + want;
    mode = want;
    document.querySelectorAll(".modeBtn").forEach(function(b){ b.classList.toggle("on", b.dataset.mode === mode); });
    syncTools();
    if(!toolOK(tool)) setTool("select");
  }

  var r;
  try{
    r = BFImport.convert(scene, {
      mode: mode,
      objLimit: OBJ_LIMIT,
      coinLimit: COIN_LIMIT,
      allowed: allowedIn
    });
  }catch(err){
    dialog("Не получилось прочитать карту", String(err.message || err), null);
    return false;
  }
  if(!r.objects.length){
    dialog("Пусто","В файле не нашлось ни одного объекта.",null);
    return false;
  }

  commit();
  objects = r.objects;
  uid = objects.reduce(function(m2,o){ return Math.max(m2,(o.id||0)+1); },1);
  sel = null; markDirty(); indexMovers(); inspect(); resetView();

  var st = r.stats, notes = [];
  notes.push("Перенесено объектов: " + objects.length + " из " + st.total + " фигур.");
  if(switched) notes.push("Режим переключён: " + switched + " — в карте есть его объекты.");
  if(st.ghosts)    notes.push("Без столкновений (декорации): " + st.ghosts + ".");
  if(st.wrongMode) notes.push("Не подходят режиму «" + mode + "»: " + st.wrongMode + ".");
  if(st.coinsCut)  notes.push("Монет убрано сверх лимита " + COIN_LIMIT + ": " + st.coinsCut + ".");
  if(st.overLimit) notes.push("Не влезло в лимит " + OBJ_LIMIT + ": " + st.overLimit + ".");
  if(!st.spawn)    notes.push("Точки старта в файле не было — поставил сам, проверьте её.");
  notes.push("Размер приведён к нашему игроку (масштаб 0.73).");
  dialog("Карта из brofist.io загружена", notes.join(" "), null);
  return true;
}

// файл из оригинала: только цифры и запятые, без нашей подписи
function looksOriginal(raw){
  var s = String(raw).trim();
  if(s.indexOf("|") !== -1) return false;
  return s[0] === "[" || /^-?\d+\s*,\s*-?\d+/.test(s);
}

document.getElementById("file").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = async function(){
    try{
      var raw = String(rd.result).trim(), p = raw.indexOf("|");
      // карта из оригинального brofist.io — уводим в импорт
      if(looksOriginal(raw)){ importOriginal(raw); return; }
      if(p === -1){ dialog("Доступ запрещён","Файл не подписан этим редактором.",null); return; }
      var sig = raw.slice(0,p), nums = raw.slice(p+1).split(",").map(function(s){ return parseInt(s,10); });
      var json = await unzip(new Uint8Array(nums.slice(1)), nums[0]);
      if(fnv(DEV_KEY+json) !== sig){ dialog("Доступ запрещён","Ключ карты не совпадает. Только разработчик.",null); return; }
      var d = JSON.parse(json);
      commit();
      objects = d.objects || [];
      uid = objects.reduce(function(m2,o){ return Math.max(m2,(o.id||0)+1); },1);
      mode = d.mode || "hideAndSeek";
      if(d.gravity !== undefined){
        // гравитация из старой карты игнорируется: она всегда 9
      }
      document.querySelectorAll(".modeBtn").forEach(function(b){ b.classList.toggle("on", b.dataset.mode === mode); });
      syncTools(); sel = null; inspect();
    }catch(err){ dialog("Ошибка","Не удалось прочитать файл карты.",null); }
  };
  rd.readAsText(f); e.target.value = "";
});
window.getEditorMap = function(){ return { mode: mode, data: JSON.stringify({mode:mode,gravity:gravityScale,objects:clean(),liquid:liqSer()}) }; };

  a.download = "map_export.json"; a.click();
});

/* ===== мост наружу: игровые страницы управляют движком через window.GAME ===== */
window.GAME = {
  figure: figure,
  mySkin: null,
  allowedIn: allowedIn,
  dialog: dialog,
  OBJ_LIMIT: OBJ_LIMIT,
  COIN_LIMIT: COIN_LIMIT,
  MODE_OF: MODE_OF,
  play: play, stop: stop, respawn: respawn,
  step: step,                     // один шаг физики — нужен автотестам
  restartRun: restartRun,         // новый забег без перезагрузки
  spawnTooClose: spawnTooClose,   // старт рядом с финишем
  // литьё воды и волны — мост для автотестов и внешних страниц
  startPour: function(x, y, fill, deadly){
    if(fill) brush.fill = fill;
    brush.deadly = !!deadly;
    if(!playing) startPour(x, y);
  },
  stopPour: stopPour,
  stepAlways: stepAlways,
  disturb: disturb,
  waterTopAt: waterTop,
  mergeWater: mergeWater,
  flowStep: flowStep,               // тик течения — мост для автотестов
  waterSupport: waterSupport,       // карта опоры под лужей — для отладки и тестов
  zoomAt: zoomAt,                   // камера — тесты предела отдаления
  liqStep: liqStep,                 // тик жидких частиц — мост для автотестов
  liqPlow: liqPlow,
  get liq(){ return liq; },         // частицы жидкости — тесты растекания
  undo: undo, redo: redo,           // откат литья — тест Ctrl+Z
  commit: commit,                   // снимок перед действием — так же зовёт инструмент
  get pour(){ return pour; },
  get pourParts(){ return pourParts; },
  myColor: null, onDraw: null,
  get keys(){ return keys; },          // состояние управления
  get playing(){ return playing; },
  get pl(){ return pl; },
  get view(){ return view; },
  get objects(){ return objects; },
  get mode(){ return mode; },
  get done(){ return done; },
  get coins(){ return coins; },
  get coinsTotal(){ return coinsTotal; },
  loadMap: function(json){
    var d = (typeof json === "string") ? JSON.parse(json) : json;
    if(playing) stop();
    objects = (d.objects || []).map(function(o){ return Object.assign({}, o); });
    liqDe(d.liquid || null);                  // налитая жидкость едит с картой
    if(d.mode) mode = d.mode;
    // режимы sandbox и twoPlayer убраны — старые карты открываем как прятки
    if(mode === "sandbox" || mode === "twoPlayer") mode = "hideAndSeek";
    // объекты чужого режима в карту не пускаем
    objects = objects.filter(function(o){ return allowedIn(o.type, mode); });
    // в старых картах галочки не было — восстанавливаем прежнее поведение
    objects.forEach(function(o){
      if(o.deadly === undefined && DEADLY_BY_DEFAULT.indexOf(o.type) !== -1) o.deadly = true;
      // «Ищущий» убран из палитры: в старых картах превращаем его в старт
      if(o.type === "seeker") o.type = "spawn";
      // размер игрока больше не настраивается — приводим старые точки старта
      if(o.type === "spawn"){ o.w = SIZES.spawn[0]; o.h = SIZES.spawn[1]; }
      // Платформа, ротатор, батут, яд и шипы стали свойствами обычных
      // объектов — переносим их поведение, чтобы старые карты играли так же
      if(o.type === "platform"){ o.type = "rect"; o.moves = true;
        if(!o.moveX && !o.moveY){ o.moveX = 130; o.moveY = 0; }
        if(!o.speed) o.speed = 1.1; }
      if(o.type === "rotator"){ o.type = "rect"; o.spins = true;
        if(!o.spin) o.spin = 2; o.deadly = true; }
      // Батут заменён полноценным рикошетом
      if(o.type === "bounce"){ o.type = "rect"; o.ricochet = true; }
      // старый батут: сила 17 при обычном прыжке 12.3 — это примерно 1.4
      if(o.bouncy){
        o.ricochet = true;
        o.power = Math.max(0.2, Math.min(3, (o.power || 17) / 12.3));
        delete o.bouncy;
      }
      if(o.type === "poison" || o.type === "spike"){ o.type = "rect"; o.deadly = true; }
      // Ворота, дверь и укрытие убраны — в старых картах становятся блоком,
      // чтобы геометрия уровня не разъехалась
      if(o.type === "door" || o.type === "gate" || o.type === "cover"){ o.type = "rect"; }
      // Вода вернулась в движок: старые «жидкости» из удалённых версий
      // снова становятся водой — с плаванием, всплесками и волнами
      if(o.type === "liquid"){ o.type = "water"; delete o.liq; }
    });
    if(objects.length > OBJ_LIMIT) objects.length = OBJ_LIMIT;
    objects.forEach(function(o){ if(o.id >= uid) uid = o.id + 1; });
    indexMovers(); markDirty();
    sel = null;
    resetView();
    return objects.length;
  },
  startPlay: function(){ if(!playing) play(); return playing; },
  setGrid: function(v){ grid = !!v; document.getElementById("bGrid").classList.toggle("on", grid); },
  clear: function(){ if(playing) stop(); objects = []; liq.length = 0; sel = null; resetView(); }
};

resize();
resetView();
view.x = 40; view.y = -60;
render();
requestAnimationFrame(loop);

<script>
/* Публикация карты в Maps Browser */
(function(){
  // свой диалог вместо системного: на телефоне пользователь может нажать
  // «Блокировать диалоговые окна», и тогда alert/prompt перестают работать совсем
  function say(title, text, onOk){
    var G = window.GAME;
    if (G && G.dialog) G.dialog(title, text, onOk || null);
    else if (onOk) { if (confirm(title + '\n\n' + text)) onOk(); }
    else alert(title + '\n\n' + text);
  }
  function ask(title, text, def, onOk){
    var G = window.GAME;
    if (G && G.dialog) G.dialog(title, text, function(v){ onOk(String(v == null ? '' : v)); }, def || '');
    else { var v = prompt(text, def || ''); if (v !== null) onOk(v); }
  }

  /* Кнопка публикации стоит в общей панели рядом с сохранением и
     открытием — раньше это был отдельный синий прямоугольник поверх карты. */
  /* Своя кнопка вместо серого прямоугольника: значок облака со стрелкой
     вверх и подпись. Стоит отдельно в правом верхнем углу, а не втиснута
     в общую панель — так её видно и она не сжимает остальные кнопки. */
  var pubCss = document.createElement('style');
  pubCss.textContent =
      '#bfPublish{position:fixed;top:14px;right:14px;z-index:19;display:flex;align-items:center;'
    + 'gap:8px;padding:10px 16px;border:none;border-radius:12px;cursor:pointer;'
    + 'background:linear-gradient(180deg,#2f8bff,#1667e0);color:#fff;'
    + 'font:700 13px system-ui,sans-serif;letter-spacing:.2px;'
    + 'box-shadow:0 6px 16px rgba(22,103,224,.32);transition:transform .12s,box-shadow .12s}'
    + '#bfPublish:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(22,103,224,.4)}'
    + '#bfPublish:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(22,103,224,.3)}'
    + '#bfPublish svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;'
    + 'stroke-linecap:round;stroke-linejoin:round}'
    + '#bfPublish[disabled]{opacity:.55;cursor:default;transform:none;box-shadow:none}'
    + '@media (max-width:640px){#bfPublish{padding:9px 12px;font-size:12px}'
    + '#bfPublish span{display:none}}';
  document.head.appendChild(pubCss);

  var btn = document.createElement('button');
  btn.id = 'bfPublish';
  btn.type = 'button';
  btn.title = 'Опубликовать в Maps Browser';
  btn.innerHTML =
      '<svg viewBox="0 0 24 24"><path d="M12 16V5"/><path d="M8 9l4-4 4 4"/>'
    + '<path d="M4 15a4 4 0 0 1 1.4-7.7A6 6 0 0 1 17 8.3 3.6 3.6 0 0 1 20 15"/></svg>'
    + '<span>Опубликовать</span>';
  document.body.appendChild(btn);

  function send(name, overwrite){
    var data;
    try {
      var m = window.getEditorMap();
      data = m.data; window.__mode = m.mode;
      var parsed = JSON.parse(data);
      var objs = parsed.objects || [];
      var G = window.GAME || {};
      var LIM = G.OBJ_LIMIT || 2000, CL = G.COIN_LIMIT || 3;
      var ok = G.allowedIn || function(){ return true; };

      if (objs.length > LIM) {
        say('Слишком много объектов', 'В карте ' + objs.length + '. Разрешено не больше ' + LIM + '.');
        return;
      }
      var coins = objs.filter(function(o){ return o.type === 'coin'; }).length;
      if (coins > CL) {
        say('Слишком много монет', 'В карте ' + coins + '. Разрешено не больше ' + CL + ' — уберите лишние.');
        return;
      }
      var bad = objs.filter(function(o){ return !ok(o.type, m.mode); })
                    .map(function(o){ return o.type; });
      if (bad.length) {
        say('Объекты не для этого режима', 'В режиме «' + m.mode + '» не работают: ' +
            bad.filter(function(v,i,a){ return a.indexOf(v) === i; }).join(', '));
        return;
      }
      // старт вплотную к финишу — то же правило, что и при запуске
      var nearFin = (window.GAME && GAME.spawnTooClose) ? GAME.spawnTooClose() : null;
      if (nearFin !== null) {
        say('Старт слишком близко к финишу',
            'Между ними ' + nearFin + ' точек. Отодвинь старт или финиш и попробуй снова.');
        return;
      }
    } catch(e){
      console.error('Публикация карты:', e);
      say('Не удалось собрать карту', String(e && e.message ? e.message : e));
      return;
    }

    var body = 'mapName=' + encodeURIComponent(name)
             + '&mapType=' + encodeURIComponent(window.__mode || 'hideAndSeek')
             + '&mapData=' + encodeURIComponent(data)
             + '&mapOverwrite=' + (overwrite ? 'true' : 'false');

    fetch('/uploadMap', {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body})
      .then(function(r){ return r.json(); })
      .then(function(r){
        if (r.status === 'success') {
          say('Карта опубликована', r.message + ' Открыть Maps Browser?',
              function(){ location.href = '/mapsBrowser.html'; });
        } else if (r.status === 'exists') {
          say('Карта уже есть', r.message, function(){ send(name, true); });
        } else {
          say('Не получилось', r.message || 'Ошибка');
        }
      })
      .catch(function(){ say('Сервер недоступен', 'Не удалось связаться с сервером.'); });
  }

  btn.onclick = function(){
    ask('Публикация карты', 'Название карты (2–30 символов):', '', function(name){
      name = String(name || '').trim();
      if (name.length < 2) { say('Слишком короткое название', 'Нужно хотя бы 2 символа.'); return; }
      send(name, false);
    });
  };
})();
</script>
