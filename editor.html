<!DOCTYPE html>
<html data-page="editor" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>AIBrofist — Editor</title>
<style>
:root{
  --accent:#3b82f6; --accent-dark:#2563eb; --ink:#1e2530; --muted:#8b93a1;
  --line:#dfe3ea; --panel:#ffffff; --shadow:0 6px 24px rgba(23,32,50,.10), 0 1px 3px rgba(23,32,50,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;height:100%;width:100%;touch-action:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f4f6fa;color:var(--ink);-webkit-font-smoothing:antialiased}
canvas{display:block;position:absolute;inset:0;touch-action:none}

/* ===== мобильная раскладка редактора ===== */
@media (max-width: 820px), (pointer: coarse) and (max-width: 1100px){
  #modes{top:8px;left:8px;right:8px;overflow-x:auto;max-width:calc(100vw - 16px);
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  #modes::-webkit-scrollbar{display:none}
  .modeBtn{padding:9px 11px;font-size:12px;white-space:nowrap}

  #scene{top:auto;bottom:70px;left:50%;transform:translateX(-50%);
    max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
  #scene::-webkit-scrollbar{display:none}

  #tools{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:none;
    flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 8px;
    border-radius:0;gap:4px;scrollbar-width:none}
  #tools::-webkit-scrollbar{display:none}
  #tools > *{flex:0 0 auto}

  /* панель свойств раньше растягивалась почти на весь экран и закрывала
     карту белым — теперь это невысокий лист над панелью инструментов */
  #insp{right:8px;left:8px;top:auto;bottom:64px;transform:none;width:auto;
    max-height:34vh;border-radius:12px;z-index:20}
  #props,#widgets{max-height:26vh}
  #widgets{font-size:13.5px;padding:12px 14px}

  #zIn,#zOut,#zLabel{padding:10px 12px}
}
/* пальцем удобнее целиться по крупным кнопкам */
@media (pointer: coarse){
  .sBtn,.tBtn,#tools > div{min-width:44px;min-height:44px}
}


.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);user-select:none}

/* modes */
#modes{position:fixed;top:14px;left:14px;display:flex;padding:4px;gap:2px;z-index:10}
.modeBtn{padding:8px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;
  color:var(--muted);transition:.14s;white-space:nowrap}
.modeBtn:hover{background:#eef2f8;color:var(--ink)}
.modeBtn.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.35)}

/* top bar */
#scene{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;padding:4px;gap:2px;z-index:10}
.sBtn{width:42px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;transition:.14s;position:relative}
.sBtn:hover{background:#eef2f8}
.sBtn:active{transform:scale(.93)}
.sBtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.sBtn.play svg{fill:#16a34a;stroke:#16a34a}
.sBtn.on{background:var(--accent)}
.sBtn.on svg{stroke:#fff;fill:none}
.sep{width:1px;background:var(--line);margin:6px 3px}
.sBtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:42px;left:50%;transform:translateX(-50%);
  background:#1e2530;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}

/* tools */
#tools{position:fixed;left:14px;top:50%;transform:translateY(-50%);width:46px;padding:5px;
  display:flex;flex-direction:column;gap:2px;z-index:10;max-height:82vh;overflow-y:auto;scrollbar-width:thin}
#tools::-webkit-scrollbar{width:0}
.tool{width:36px;height:36px;display:none;align-items:center;justify-content:center;border-radius:8px;
  cursor:pointer;transition:.12s;flex-shrink:0;position:relative}
.tool:hover{background:#eef2f8}
.tool.on{background:var(--accent);box-shadow:0 2px 8px rgba(59,130,246,.35)}
.tool canvas{position:static;width:24px;height:24px;pointer-events:none}
.tool.on canvas{filter:brightness(0) invert(1)}
.tool[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:44px;top:50%;transform:translateY(-50%);
  background:#1e2530;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:30;pointer-events:none}

/* inspector */
#insp{position:fixed;right:14px;top:50%;transform:translateY(-50%);width:248px;z-index:10;display:none;
  max-height:78vh;overflow:hidden;display:none;flex-direction:column}
#inspHead{display:flex;padding:4px;gap:2px;border-bottom:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{background:#eef2f8;color:var(--ink)}
#props,#widgets{padding:10px 12px;overflow-y:auto;font-size:12.5px}
#objTitle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.4px;
  text-transform:uppercase;color:var(--accent);margin-bottom:9px}
#objTitle span{margin-left:auto;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.pRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
.pRow label{color:#5b6472;font-size:12px}
.pRow input[type=number],.pRow input[type=text]{width:94px;padding:5px 8px;border:1px solid var(--line);
  border-radius:7px;font-size:12px;font-family:inherit;color:var(--ink);background:#fafbfd;outline:none}
.pRow input:focus{border-color:var(--accent);background:#fff}
.pRow input[type=color]{width:44px;height:26px;padding:1px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
.pRow input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.pRow input[type=range]{width:100px;accent-color:var(--accent)}
/* объяснение связей механизмов — свёрнуто, разворачивается по клику */
.pHelp{margin:6px 0 2px}
.pHelpHead{font-size:11.5px;color:var(--accent);cursor:pointer;padding:6px 0;user-select:none}
.pHelpBody{display:none;font-size:11.5px;line-height:1.7;color:#5b6673;
  background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:4px}
.pHelpBody code{background:#e6ebf2;border-radius:4px;padding:1px 5px;font-size:11px}
.grp{margin:13px 0 5px;padding-top:9px;border-top:1px solid var(--line);font-size:10.5px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.zBtns{display:flex;gap:5px;margin-top:5px}
.zBtns div{flex:1;text-align:center;padding:6px 0;border:1px solid var(--line);border-radius:7px;
  font-size:11px;cursor:pointer;background:#fafbfd}
.zBtns div:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
#widgets{color:#5b6472;line-height:1.65}
#widgets code{background:#eef2f8;padding:1px 5px;border-radius:4px;font-size:11px;color:var(--accent-dark)}
#widgets b{color:var(--ink)}

/* bottom-left cluster */

/* zoom */
#zoomBox{position:fixed;right:14px;bottom:14px;display:flex;padding:3px;z-index:11}

/* публикация — в общей панели, чёрная кнопка курсивом */
#bfPublish{margin-left:6px;padding:0 14px;height:36px;border:none;border-radius:9px;
  background:#111827;color:#fff;font-style:italic;font-weight:700;font-size:13.5px;
  letter-spacing:.2px;cursor:pointer;white-space:nowrap;align-self:center;font-family:inherit}
#bfPublish:hover{background:#2b3648}
#bfPublish:active{transform:translateY(1px)}
@media (max-width:900px){ #bfPublish{padding:0 10px;height:34px;font-size:12.5px} }
.zBtn{min-width:32px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:7px;
  cursor:pointer;font-size:15px;color:#5b6472;transition:.12s}
.zBtn:hover{background:#eef2f8;color:var(--ink)}
#zLabel{font-size:12px;font-weight:600;min-width:48px}

/* play */
body.play #tools,body.play #insp,body.play #modes,body.play #zoomBox,body.play #hint{display:none!important}
#hud{display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:12;
  padding:8px 10px;align-items:center;gap:6px}
body.play #hud{display:flex}
.stat{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;background:#f4f6fa;font-size:12.5px;font-weight:600}
.stat i{font-style:normal;font-size:13px}
#exitBtn{padding:6px 13px;border-radius:8px;background:#fee2e2;color:#dc2626;font-size:12px;
  font-weight:600;cursor:pointer;transition:.14s}
#exitBtn:hover{background:#dc2626;color:#fff}
#msg{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:13;text-align:center;
  display:none;pointer-events:none;opacity:0;transition:.32s cubic-bezier(.2,1.2,.3,1)}
#msg.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}
#msg h1{margin:0;font-size:52px;font-weight:800;letter-spacing:-1.5px;
  background:linear-gradient(180deg,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 10px rgba(245,158,11,.35))}
#msg p{margin:8px 0 0;font-size:13.5px;color:#5b6472;font-weight:500}

#pad{display:none;position:fixed;bottom:0;left:0;right:0;z-index:13;
  padding:0 18px calc(20px + env(safe-area-inset-bottom));justify-content:space-between;pointer-events:none}
body.play.mob #pad{display:flex}
.padG{display:flex;gap:13px;pointer-events:auto}
.pBtn{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:23px;color:#5b6472;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.pBtn:active{background:var(--accent);color:#fff;transform:scale(.93)}
#pJump{width:78px;height:78px;font-size:13px;font-weight:800;letter-spacing:.5px}

/* dialog */
#dlg{position:fixed;inset:0;z-index:200;display:none}
#dlg .bd{position:absolute;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px)}
#dlg .card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);min-width:300px;max-width:430px;
  background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:20px 22px}
#dlg h3{margin:0 0 7px;font-size:15px}
#dlg p{margin:0 0 16px;font-size:13px;color:#5b6472;line-height:1.6}
#dlg .acts{display:flex;gap:8px;justify-content:flex-end}
#dIn{width:100%;box-sizing:border-box;padding:11px 12px;margin:0 0 14px;border:1px solid var(--line);
  border-radius:9px;font-size:16px;font-family:inherit;color:var(--ink);background:#fafbfd;outline:none}
#dIn:focus{border-color:var(--accent);background:#fff}
#dlg button{padding:8px 15px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12.5px;
  font-family:inherit;font-weight:600;cursor:pointer}
#dlg .ok{background:var(--accent);color:#fff;border-color:var(--accent)}
#file{display:none}

/* mobile */
body.mob #modes{top:8px;bottom:auto;left:8px;right:8px;padding:3px}
body.mob .modeBtn{padding:8px 9px;font-size:11px}
body.mob #scene{top:8px;bottom:auto;padding:3px}
body.mob .sBtn{width:38px;height:34px}
body.mob #tools{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-height:none;flex-direction:row;
  border-radius:16px 16px 0 0;max-height:none;height:58px;overflow-x:auto;overflow-y:hidden;padding:6px 8px;gap:4px}
body.mob .tool{width:42px;height:42px}
body.mob .tool canvas{width:26px;height:26px}
body.mob .tool[data-tip]:hover::after{display:none}
body.mob #insp{left:8px;right:8px;width:auto;top:auto;bottom:64px;transform:none;max-height:34vh}
body.mob #props,body.mob #widgets{max-height:26vh}
#inspClose{flex:0 0 34px;color:#dc2626;font-size:14px}
#inspClose:hover{background:#fee2e2}
body.mob #hint{display:none}
body.mob #zoomBox{bottom:68px;right:8px}
body.mob #msg h1{font-size:38px}
</style>

	<script src="lzma.js"></script>

	<script src="skinCanvas.js"></script>
	<script src="coin.js"></script>

	<script src="theme.js"></script>

	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<body>

<div id="modes" class="panel"></div>
<div id="scene" class="panel"></div>
<div id="tools" class="panel"></div>

<div id="insp" class="panel">
  <div id="inspHead">
    <div class="tab on" data-tab="props">Свойства</div>
    <div class="tab" id="inspClose" title="Закрыть">Закрыть</div>
  </div>
  <div id="props"></div>
  <div id="widgets" style="display:none"></div>
</div>

<div id="zoomBox" class="panel">
  <div class="zBtn" id="zOut">−</div>
  <div class="zBtn" id="zLabel">100%</div>
  <div class="zBtn" id="zIn">+</div>
</div>

<div id="hud" class="panel">
  <div id="exitBtn">Выйти</div>
  <div class="stat"><i>⏱</i><span id="sTime">0.0</span></div>
  <div class="stat" title="монет в карте (максимум 3)"><i>Монеты</i><span id="sCoin">0</span></div>
      <div class="stat" title="объектов в карте (максимум 2000)"><i>▦</i><span id="sObj">0</span></div>
  <div class="stat" title="смертей"><i>Смерти</i><span id="sDeath">0</span></div>
</div>
<div id="msg"><h1 id="msgT"></h1><p id="msgS"></p></div>

<div id="pad">
  <div class="padG"><div class="pBtn" id="pLeft">◀</div><div class="pBtn" id="pRight">▶</div></div>
  <div class="padG"><div class="pBtn" id="pDive">▼</div><div class="pBtn" id="pJump">JUMP</div></div>
</div>

<div id="dlg">
  <div class="bd"></div>
  <div class="card"><h3 id="dT"></h3><p id="dM"></p>
    <input id="dIn" type="text" style="display:none">
    <div class="acts"><button id="dNo">Отмена</button><button class="ok" id="dOk">OK</button></div></div>
</div>

<input type="file" id="file" accept=".txt,.json">
<canvas id="c"></canvas>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════
   ENVIRONMENT
   ══════════════════════════════════════════════════ */
var isMob = function(){
  return matchMedia("(pointer:coarse)").matches || innerWidth <= 860 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
};
function syncMob(){ document.body.classList.toggle("mob", isMob()); }
syncMob(); addEventListener("resize", syncMob); addEventListener("orientationchange", syncMob);

var cv = document.getElementById("c"), ctx = cv.getContext("2d");
var DPR = Math.min(2, devicePixelRatio || 1);
function resize(){
  cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
}
addEventListener("resize", resize);
var VW = function(){ return cv.width / DPR; }, VH = function(){ return cv.height / DPR; };

/* ══════════════════════════════════════════════════
   MODEL DEFINITIONS  — every shape drawn by hand
   ══════════════════════════════════════════════════ */
var C = {
  stone1:"#4b5563", stone2:"#374151", stone3:"#1f2937",
  wood1:"#b45309", wood2:"#92400e",
  poison1:"#4ade80", poison2:"#16a34a", poison3:"#15803d",
  metal1:"#cbd5e1", metal2:"#94a3b8", metal3:"#64748b",
  spring1:"#c084fc", spring2:"#9333ea",
  gate1:"#60a5fa", gate2:"#2563eb",
  gold1:"#fde047", gold2:"#f59e0b",
  red1:"#f87171", red2:"#dc2626",
  ink:"#111827"
};
/* Плоская заливка вместо градиента. Объекты выглядели «масляными»
   из-за переливов и бликов — теперь это просто цвет. */
function grad(x0,y0,x1,y1,a,b){ return a; }
function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else{
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  }
}
var COIN_IMG = new Image();
COIN_IMG.src = "coin.png";

/* the player figure — clean silhouette from the reference art */
var FIG_GAP = 0.049;
var SKIN_IMGS = {};
function skinImage(src){
  if(!src) return null;
  var im = SKIN_IMGS[src];
  if(!im){ im = SKIN_IMGS[src] = new Image(); im.crossOrigin = "anonymous"; im.src = src; }
  return (im.complete && im.naturalWidth) ? im : null;
}

function figure(w,h,col,accent,skin){
  var d = w, top = d + h*FIG_GAP, bodyH = Math.max(0, h - top);
  // скин-картинка от владельца заменяет фигуру целиком
  if(skin && skin.img){
    var pic = skinImage(skin.img);
    if(pic){
      var k = Math.min(w/pic.naturalWidth, h/pic.naturalHeight);
      var pw = pic.naturalWidth*k, ph = pic.naturalHeight*k;
      ctx.drawImage(pic, (w-pw)/2, h-ph, pw, ph);
      return;
    }
    // пока картинка грузится — рисуем обычный силуэт
  }
  // «за спиной» уходит под силуэт
  if(skin && window.BFSkinCanvas) BFSkinCanvas.behind(ctx, w, h, skin);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(w/2, d/2, d/2, 0, 6.2832); ctx.fill();
  if(bodyH > 0){ rr(0, top, w, bodyH, Math.min(w*0.22, bodyH/2)); ctx.fill(); }
  // одежда, лицо и головной убор — поверх
  if(skin && window.BFSkinCanvas) BFSkinCanvas.front(ctx, w, h, skin);
}

/* Each painter draws the object in its own local space (0,0 → w,h). */
var PAINT = {
  /* Три базовые фигуры рисуются одной плоской заливкой: без скруглений,
     градиентов и бликов. Что нарисовано — то и считает хитбокс. */
  rect: function(o){
    ctx.fillStyle = o.fill || C.ink;
    ctx.fillRect(0,0,o.w,o.h);
  },
  circle: function(o){
    ctx.fillStyle = o.fill || C.ink;
    ctx.beginPath(); ctx.ellipse(o.w/2,o.h/2,o.w/2,o.h/2,0,0,6.2832); ctx.fill();
  },
  triangle: function(o){
    ctx.fillStyle = o.fill || C.ink;
    ctx.beginPath(); ctx.moveTo(o.w/2,0); ctx.lineTo(o.w,o.h); ctx.lineTo(0,o.h); ctx.closePath(); ctx.fill();
  },
  water: function(o){
    var c = o.fill || WATER_DEF;
    var g = ctx.createLinearGradient(0,0,0,o.h);
    g.addColorStop(0, shade(c,26)); g.addColorStop(1, shade(c,-30));
    ctx.globalAlpha = 0.75; ctx.fillStyle = g; ctx.fillRect(0,0,o.w,o.h);
    ctx.globalAlpha = 1; ctx.strokeStyle = shade(c,60); ctx.lineWidth = 1.6;
    ctx.beginPath();
    for(var x=0;x<=o.w;x+=4) ctx.lineTo(x, 3 + Math.sin(x*0.4)*2);
    ctx.stroke();
  },
  text: function(o){
    ctx.fillStyle = o.fill || C.ink;
    ctx.font = "800 " + Math.max(9,o.h) + "px -apple-system,Segoe UI,Roboto,sans-serif";
    ctx.textBaseline = "top";
    ctx.fillText(o.text || "Text", 0, 0);
  },
  spawn: function(o){ figure(o.w,o.h, o.fill || C.ink, true, (window.GAME && window.GAME.mySkin) || null); },
  seeker: function(o){
    figure(o.w,o.h, o.fill || "#b91c1c", true);
    ctx.fillStyle = "#fff";                      // seeker gets eyes so he reads as the hunter
    ctx.beginPath(); ctx.arc(o.w*0.34,o.w*0.46,o.w*0.1,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(o.w*0.66,o.w*0.46,o.w*0.1,0,6.2832); ctx.fill();
  },
  poison: function(o){
    var t = anim*0.055;
    ctx.fillStyle = grad(0,o.h*0.2,0,o.h,C.poison1,C.poison3);
    ctx.beginPath(); ctx.moveTo(0,o.h*0.34);
    var steps = Math.max(3, Math.round(o.w/22));
    for(var i=0;i<steps;i++){
      var x0 = o.w*i/steps, x1 = o.w*(i+1)/steps;
      ctx.quadraticCurveTo((x0+x1)/2, o.h*0.34 + Math.sin(t+i*1.3)*o.h*0.26 - o.h*0.16, x1, o.h*0.34);
    }
    ctx.lineTo(o.w,o.h); ctx.lineTo(0,o.h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.34)";     // bubbles
    for(var b=0;b<Math.max(2,o.w/40);b++){
      var bx = ((b*37)%Math.max(1,o.w-8))+4;
      var by = o.h*0.9 - ((anim*0.6 + b*30) % (o.h*0.6));
      ctx.beginPath(); ctx.arc(bx,by,1.6+ (b%2),0,6.2832); ctx.fill();
    }
  },
  spike: function(o){
    var n = Math.max(2, Math.round(o.w/15));
    ctx.fillStyle = grad(0,0,0,o.h,C.metal1,C.metal3);
    for(var s=0;s<n;s++){
      ctx.beginPath();
      ctx.moveTo(o.w*s/n, o.h); ctx.lineTo(o.w*(s+0.5)/n, 0); ctx.lineTo(o.w*(s+1)/n, o.h);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,.5)";
    for(var s2=0;s2<n;s2++){
      ctx.beginPath(); ctx.moveTo(o.w*(s2+0.5)/n, 0);
      ctx.lineTo(o.w*(s2+0.36)/n, o.h); ctx.lineTo(o.w*(s2+0.46)/n, o.h); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = C.stone3; ctx.fillRect(0, o.h-Math.max(2,o.h*0.13), o.w, Math.max(2,o.h*0.13));
  },
  bounce: function(o){
    var sq = o._squash || 0;                     // squashes when the player lands
    var h = o.h * (1 - sq*0.45), y = o.h - h;
    ctx.fillStyle = C.stone3;
    rr(o.w*0.06, o.h-Math.max(3,o.h*0.22), o.w*0.88, Math.max(3,o.h*0.22), 2); ctx.fill();
    ctx.strokeStyle = C.metal2; ctx.lineWidth = Math.max(1.6, o.h*0.11);  // coil
    ctx.beginPath();
    for(var i=0;i<=10;i++){
      var yy = y + h*0.42 + (h*0.42)*i/10, xx = o.w*(i%2?0.32:0.68);
      i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    ctx.fillStyle = grad(0,y,0,y+h*0.5,C.spring1,C.spring2);
    rr(0, y, o.w, Math.max(4,h*0.44), Math.min(o.w/2,h*0.22)); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = Math.max(1.4,o.h*0.1);
    ctx.lineCap = "round"; ctx.beginPath();
    ctx.moveTo(o.w*0.33, y+h*0.3); ctx.lineTo(o.w*0.5, y+h*0.1); ctx.lineTo(o.w*0.67, y+h*0.3);
    ctx.stroke(); ctx.lineCap = "butt";
  },
  platform: function(o){
    ctx.fillStyle = grad(0,0,0,o.h,C.metal2,C.metal3);
    rr(0,0,o.w,o.h,Math.min(4,o.h/3)); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.fillRect(0,0,o.w,Math.max(1.5,o.h*0.16));
    ctx.fillStyle = "rgba(0,0,0,.22)";           // tread marks
    for(var i=6;i<o.w-4;i+=13) ctx.fillRect(i, o.h*0.42, 5, Math.max(2,o.h*0.3));
  },
  door: function(o){
    ctx.fillStyle = grad(0,0,o.w,0,C.wood1,C.wood2);
    rr(0,0,o.w,o.h,Math.min(o.w*0.14,6)); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1.4;
    rr(o.w*0.16,o.h*0.09,o.w*0.68,o.h*0.36,3); ctx.stroke();
    rr(o.w*0.16,o.h*0.54,o.w*0.68,o.h*0.36,3); ctx.stroke();
    ctx.fillStyle = C.gold1;
    ctx.beginPath(); ctx.arc(o.w*0.8,o.h*0.52,Math.max(2,o.w*0.07),0,6.2832); ctx.fill();
  },
  button: function(o){
    var pressed = o._active;
    ctx.fillStyle = C.stone3;
    rr(0, o.h*0.62, o.w, o.h*0.38, 2); ctx.fill();
    var by = pressed ? o.h*0.42 : o.h*0.06, bh = pressed ? o.h*0.22 : o.h*0.58;
    ctx.fillStyle = grad(0,by,0,by+bh, pressed?"#4ade80":C.red1, pressed?"#15803d":C.red2);
    rr(o.w*0.16, by, o.w*0.68, bh, Math.min(4,bh/2)); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    rr(o.w*0.22, by+1.5, o.w*0.56, Math.max(1.5,bh*0.24), 2); ctx.fill();
  },
  lever: function(o){
    ctx.fillStyle = C.stone3;
    rr(0, o.h*0.82, o.w, o.h*0.18, 2); ctx.fill();
    ctx.save(); ctx.translate(o.w/2, o.h*0.86);
    ctx.rotate(o._active ? 0.62 : -0.62);
    ctx.fillStyle = C.metal3;
    rr(-Math.max(1.4,o.w*0.09), -o.h*0.78, Math.max(2.8,o.w*0.18), o.h*0.78, 1.5); ctx.fill();
    var kg = ctx.createRadialGradient(-1,-o.h*0.8,0,0,-o.h*0.78,Math.max(3.4,o.w*0.28));
    kg.addColorStop(0, o._active?"#86efac":"#fca5a5"); kg.addColorStop(1, o._active?"#15803d":"#b91c1c");
    ctx.fillStyle = kg;
    ctx.beginPath(); ctx.arc(0,-o.h*0.78,Math.max(3.4,o.w*0.28),0,6.2832); ctx.fill();
    ctx.restore();
  },
  rotator: function(o){
    ctx.fillStyle = grad(0,0,0,o.h,"#a78bfa","#6d28d9");
    rr(0,0,o.w,o.h,o.h/2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.3)";
    rr(o.w*0.06,o.h*0.18,o.w*0.88,Math.max(1.4,o.h*0.22),o.h*0.11); ctx.fill();
    ctx.fillStyle = "#4c1d95";
    ctx.beginPath(); ctx.arc(o.w/2,o.h/2,Math.max(3,o.h*0.72),0,6.2832); ctx.fill();
    ctx.fillStyle = "#c4b5fd";
    ctx.beginPath(); ctx.arc(o.w/2,o.h/2,Math.max(1.5,o.h*0.3),0,6.2832); ctx.fill();
  },
  checkpoint: function(o){
    var pole = Math.max(2.5, o.w*0.15);
    ctx.fillStyle = C.stone2; rr(0,0,pole,o.h,1); ctx.fill();
    var wave = o._reached ? Math.sin(anim*0.13)*o.h*0.035 : 0;
    ctx.fillStyle = o._reached ? grad(0,0,0,o.h*0.4,"#4ade80","#16a34a") : grad(0,0,0,o.h*0.4,C.red1,C.red2);
    ctx.beginPath(); ctx.moveTo(pole, o.h*0.04);
    ctx.quadraticCurveTo(o.w*0.6, o.h*0.1+wave, o.w, o.h*0.2);
    ctx.quadraticCurveTo(o.w*0.6, o.h*0.3-wave, pole, o.h*0.4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.stone3; rr(-o.w*0.1, o.h-Math.max(3,o.h*0.06), o.w*0.5, Math.max(3,o.h*0.06), 2); ctx.fill();
  },
  finishline: function(o){
    var cs = Math.max(5, Math.min(o.w, o.h)/5);
    for(var y=0;y<o.h;y+=cs) for(var x=0;x<o.w;x+=cs){
      ctx.fillStyle = (((x/cs|0)+(y/cs|0))%2===0) ? "#1f2937" : "#f9fafb";
      ctx.fillRect(x,y,Math.min(cs,o.w-x),Math.min(cs,o.h-y));
    }
    ctx.strokeStyle = C.stone3; ctx.lineWidth = 1.6; ctx.strokeRect(.8,.8,o.w-1.6,o.h-1.6);
  },
  coin: function(o){
    // та же монета, что в профиле игрока (coin.png), с вращением
    var sq = Math.abs(Math.cos(anim*0.045));
    var w = Math.max(2, o.w*sq);
    ctx.save(); ctx.translate(o.w/2, 0);
    if(COIN_IMG.complete && COIN_IMG.naturalWidth){
      ctx.drawImage(COIN_IMG, -w/2, 0, w, o.h);
    } else {
      ctx.fillStyle = grad(-w/2,0,w/2,o.h,C.gold1,C.gold2);
      ctx.beginPath(); ctx.ellipse(0,o.h/2,w/2,o.h/2,0,0,6.2832); ctx.fill();
    }
    ctx.restore();
  }
};
function shade(hex, amt){
  if(!hex || hex[0] !== "#" || hex.length !== 7) return "#374151";
  var n = parseInt(hex.slice(1),16);
  var r = Math.max(0,Math.min(255,(n>>16)+amt)), g = Math.max(0,Math.min(255,((n>>8)&255)+amt)), b = Math.max(0,Math.min(255,(n&255)+amt));
  return "#" + (1<<24 | r<<16 | g<<8 | b).toString(16).slice(1);
}

/* ══════════════════════════════════════════════════
   ИНДЕКС ОБЪЕКТОВ
   На больших картах перебирать все 2000 объектов каждый кадр дорого.
   Раскладываем их по сетке ячеек и берём только те, что рядом.
   ══════════════════════════════════════════════════ */
var CELL = 260, grid = null, gridDirty = true;
function markDirty(){ gridDirty = true; }
function buildGrid(){
  grid = {};
  for(var i=0;i<objects.length;i++){
    var o = objects[i], bb = bbox(o);
    var cx0 = Math.floor(bb[0]/CELL), cx1 = Math.floor(bb[2]/CELL);
    var cy0 = Math.floor(bb[1]/CELL), cy1 = Math.floor(bb[3]/CELL);
    for(var cx=cx0; cx<=cx1; cx++)
      for(var cy=cy0; cy<=cy1; cy++){
        var k = cx + ":" + cy;
        (grid[k] || (grid[k] = [])).push(o);
      }
  }
  gridDirty = false;
}
function nearby(x, y, w, h){
  var i, o;
  if(gridDirty || !grid) buildGrid();
  var seen = {}, out = [];
  var cx0 = Math.floor(x/CELL), cx1 = Math.floor((x+w)/CELL);
  var cy0 = Math.floor(y/CELL), cy1 = Math.floor((y+h)/CELL);
  for(var cx=cx0; cx<=cx1; cx++)
    for(var cy=cy0; cy<=cy1; cy++){
      var list = grid[cx + ":" + cy];
      if(!list) continue;
      for(i=0;i<list.length;i++){
        o = list[i];
        if(seen[o.id]) continue;
        seen[o.id] = 1; out.push(o);
      }
    }
  // платформы и ротаторы меняют клетку каждый кадр, поэтому в сетке им
  // верить нельзя — берём их напрямую, но только те, что реально рядом
  for(i=0;i<movers.length;i++){
    o = movers[i];
    if(seen[o.id]) continue;
    var mb = bbox(o);
    if(mb[2] < x || mb[0] > x+w || mb[3] < y || mb[1] > y+h) continue;
    seen[o.id] = 1; out.push(o);
  }
  return out;
}
var movers = [];
function indexMovers(){
  movers = objects.filter(function(o){ return o.moves || o.spins; });
}
function overLimit(extra){
  if(objects.length + (extra||1) <= OBJ_LIMIT) return false;
  showMsg("Предел " + OBJ_LIMIT + " объектов",
          "В карте уже " + objects.length + ". Удалите лишнее, чтобы добавить новое.");
  setTimeout(hideMsg, 2200);

}

var undoStack = [], redoStack = [];
function snap(){ return JSON.stringify(objects.map(function(o){
  var c = {}; for(var k in o) if(k[0] !== "_") c[k] = o[k]; return c;
})); }
function commit(){
  undoStack.push(snap()); if(undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
}
function restore(json){
  objects = JSON.parse(json);
  uid = objects.reduce(function(m,o){ return Math.max(m,(o.id||0)+1); },1);
  sel = null; inspect();
}
function undo(){ if(!undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); }
function redo(){ if(!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); }

function toWorld(sx,sy){ return {x:(sx-view.x)/view.s, y:(sy-view.y)/view.s}; }
function zoomAt(sx,sy,f){
  var b = toWorld(sx,sy);
  view.s = Math.min(8, Math.max(.15, view.s*f));
  view.x = sx - b.x*view.s; view.y = sy - b.y*view.s;
  document.getElementById("zLabel").textContent = Math.round(view.s*100)+"%";
}
function resetView(){ view.s = 1; view.x = 0; view.y = 0; document.getElementById("zLabel").textContent = "100%"; }

   PARTICLES
   ══════════════════════════════════════════════════ */
var parts = [];
function burst(x,y,n,col,spd,life){
  for(var i=0;i<n;i++){
    var a = Math.random()*6.2832, v = spd*(0.35+Math.random());
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:life,max:life,c:col,r:1.4+Math.random()*2.4});
  }
}
function puff(x,y,n){
  for(var i=0;i<n;i++)
    parts.push({x:x+(Math.random()-.5)*14,y:y,vx:(Math.random()-.5)*1.8,vy:-Math.random()*1.1,
                life:22,max:22,c:"#cbd5e1",r:2+Math.random()*2.6});
}
function stepParts(){
  for(var i=parts.length-1;i>=0;i--){
    var p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.24; p.vx *= 0.98; p.life--;
    if(p.life <= 0) parts.splice(i,1);
  }
}
function drawParts(){
  parts.forEach(function(p){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/* FRIC = 0 — на земле игрок останавливается сразу, без скольжения.
   В воздухе инерция остаётся, иначе управление в прыжке ломается. */

   Вода — это объекты типа "water", а не картинка: и физика, и вид
   считаются скриптом. Клетка 20x20, ряды склеиваются при рисовании. */
var WCELL   = 20;
var AIR_MAX = 10 * 60;      // 10 секунд под водой, в кадрах
var HP_MAX  = 100;
var DROWN_DPS = 70;         // урон в секунду, когда воздух кончился
var ACID_DPS  = 45;         // урон в секунду в опасной воде
var HEAL_PS   = 30;         // восстановление на суше
var W_SPEED = 0.72,  // предел скорости под водой от скорости бега
    W_ACCEL = 0.55,  // разгон
    W_DRAG  = 0.90,  // сопротивление воды
    W_GRAV  = 0.30,  // ослабленная тяжесть
    W_BUOY  = 0.30,  // выталкивание (равновесие держит голову над водой)
    W_SWIM  = 0.62,  // гребок вверх
    W_DIVE  = 0.42,  // гребок вниз
    W_MAXV  = 4.6;
var WATER_DEF = "#3b82f6";
var ACID_DEF  = "#38d430";   // яд всегда узнаётся по этому зелёному
/* Вода в игре — рой мелких частиц с обычной физикой. Слипаются они не
   физически, а на рисовании: мягкие пятна складываются и обрезаются по
   плотности, поэтому рой читается как единая жидкость, а не как мячики. */
var P_R    = 7;              // радиус частицы
var P_STEP = 13;             // шаг раскладки при заполнении объёма
var P_MAX  = 700;            // потолок: больше браузер не тянет на телефоне
var SINK_DEF = 1.8;          // с какой скоростью затягивает вниз

var JUMP_H = 122, MOVE_A = 0.9, MAX_VX = 5.2, FRIC = 0, AIR = 0.94,
    COYOTE = 6, BUFFER = 7, WALL_SLIDE = 2.6, WALL_VX = 6.2, STEP_UP = 16;
function G(){ return gravityScale * 0.062; }          // 9 → 0.558 px/кадр²
function jumpV(){ return -Math.sqrt(2 * Math.max(0.02, G()) * JUMP_H); }  // constant hop height
/* Heavier gravity shortens airtime, so speed scales with it — otherwise a map
   built at gravity 10 becomes physically unjumpable at 30. Reach stays constant. */
function gk(){ return Math.max(0.45, Math.sqrt(Math.max(0.02, G()) / 0.62)); }
function maxVX(){ return MAX_VX * gk(); }
function moveA(){ return MOVE_A * gk(); }
function wallVX(){ return WALL_VX * gk(); }
function maxFall(){ return 12 + gravityScale * 0.8; }

var pl = {x:0,y:0,w:20,h:60,vx:0,vy:0,ground:false,wall:0,dead:false,face:1,selfJump:false,hidden:false,
    inWater:false,headUnder:false,inAcid:false,sinking:false,
    air:AIR_MAX,hp:HP_MAX};
var keys = {l:false,r:false,u:false,d:false};
var coy = 0, buf = 0, spawnPt = {x:0,y:0}, done = false;
var deaths = 0, coins = 0, coinsTotal = 0, timeMs = 0, shake = 0, acc = 0, last = 0;

/* Где игрок относительно воды: верхняя кромка, под водой ли голова
   и не кислота ли это. Считается по тем же объектам, что и коллизии. */
function waterState(near){
  var top = Infinity, inW = false, acid = false, sink = false, sv = SINK_DEF;
  for(var i=0;i<near.length;i++){
    var o = near[i];
    if(o.type !== "water") continue;
    if(pl.x + pl.w <= o.x || pl.x >= o.x + o.w) continue;
    if(pl.y + pl.h <= o.y || pl.y >= o.y + o.h) continue;
    inW = true;
    if(o.y < top) top = o.y;
    if(o.acid) acid = true;
    if(o.sink){ sink = true; sv = o.sinkSpeed || SINK_DEF; }
  }
  pl.inWater = inW;
  pl.inAcid = acid;
  pl.sinking = inW && sink;
  // голова считается под водой, когда кромка выше макушки
  pl.headUnder = inW && (pl.y + 8 >= top);
  return { top: inW ? top : 0, sink: sink, sinkSpeed: sv };
}

/* Воздух и урон. Под водой запас тратится, на воздухе восстанавливается;
   кислота жжёт сразу при касании. */
function breathe(){
  if(pl.headUnder){
    if(pl.air > 0) pl.air--;
  } else {
    pl.air = Math.min(AIR_MAX, pl.air + 4);
  }
  var dmg = 0;
  if(pl.air <= 0) dmg += DROWN_DPS / 60;
  if(pl.inAcid)   dmg += ACID_DPS / 60;
  if(dmg > 0){
    pl.hp -= dmg;
    if(anim % 8 === 0) burst(pl.x+pl.w/2, pl.y+pl.h*0.4, 3, pl.inAcid ? "#84cc16" : "#60a5fa", 1.6, 16);
  } else if(!pl.inWater && pl.hp < HP_MAX){
    pl.hp = Math.min(HP_MAX, pl.hp + HEAL_PS / 60);
  }
  if(pl.hp <= 0){ pl.hp = 0; die(); }
}

function findSpawn(){ for(var i=0;i<objects.length;i++) if(objects[i].type === "spawn") return objects[i]; return null; }
function play(){
  var sp = findSpawn();
  if(!sp){ dialog("Нет точки старта","Поставь инструмент «Точка старта», потом жми ▶.",null); return; }
  playing = true; done = false; deaths = 0; coins = 0; timeMs = 0; parts.length = 0;
  indexMovers(); markDirty();
  // размер игрока задан движком и не редактируется
  pl.w = SIZES.spawn[0]; pl.h = SIZES.spawn[1];
  spawnPt = {x:sp.x, y:sp.y};
  coinsTotal = objects.filter(function(o){ return o.type === "coin"; }).length;
  objects.forEach(function(o){
    o._hx = o.x; o._hy = o.y; o._t = 0; o._act = !!o.startsOpen;
    o._got = false; o._reached = false; o._spin = 0; o._squash = 0;
  });
  buildWater();
  respawn();
  document.body.classList.add("play");
  sel = null; inspect(); hideMsg(); last = 0; acc = 0; stat();
}
function stop(){
  playing = false; document.body.classList.remove("play"); hideMsg(); parts.length = 0;
  objects.forEach(function(o){ if(o._hx !== undefined){ o.x = o._hx; o.y = o._hy; }
    o._act = false; o._reached = false; o._spin = 0; o._got = false; });
  wp.length = 0; wcell = null;
  resetView();
}
function respawn(){
  pl.x = spawnPt.x; pl.y = spawnPt.y; pl.vx = 0; pl.vy = 0; pl.dead = false; coy = 0; buf = 0;
  pl.air = AIR_MAX; pl.hp = HP_MAX; pl.inWater = false; pl.headUnder = false; pl.inAcid = false;
}
function die(){
  if(pl.dead || done) return;
  pl.dead = true; deaths++; shake = 13; stat();
  burst(pl.x+pl.w/2, pl.y+pl.h/2, 22, "#ef4444", 4.4, 34);
  setTimeout(function(){ if(playing) respawn(); }, 300);
}
function stat(){
  document.getElementById("sDeath").textContent = deaths;
  document.getElementById("sCoin").textContent = coins + "/" + coinsTotal;
  var so = document.getElementById("sObj");
  if(so) so.textContent = objects.length + "/" + OBJ_LIMIT;
}
function showMsg(t,s){
  document.getElementById("msgT").textContent = t;
  document.getElementById("msgS").textContent = s;
  var m = document.getElementById("msg"); m.style.display = "block";
  requestAnimationFrame(function(){ m.classList.add("show"); });
}
function hideMsg(){ var m = document.getElementById("msg"); m.classList.remove("show"); m.style.display = "none"; }

/* «Открыт» — объект, который включила кнопка или рычаг: он становится
   полупрозрачным и проходимым. Сами кнопка и рычаг так не исчезают. */
var opened = function(o){ return o.type !== "button" && o.type !== "lever" && !!o._act; };

/* Все ли игроки уже в двери. В одиночном прогоне редактора игрок один,
   поэтому условие выполняется сразу. В сетевой игре список приходит
   из game.js через GAME.others. */
function allAtDoor(o){
  var others = (window.GAME && window.GAME.others) ? window.GAME.others() : null;
  if(!others || !others.length) return true;
  for(var i = 0; i < others.length; i++){
    var p = others[i];
    if(!p || p.gone) continue;
    if(!overlaps(o, p.x, p.y, p.w || 22, p.h || 74)) return false;
  }
  return true;
}
/* Укрытие для пряток игрок проходит насквозь — иначе за него не спрятаться. */
var solid  = function(o){ return SOLID.indexOf(o.type) !== -1 && !opened(o)
                              && o.ghost !== true && o.hideSpot !== true; };
var hazard = function(o){ return o.deadly === true && !opened(o); };
function hit(ax,ay,aw,ah,bx,by,bw,bh){ return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by; }

/* ══════════════════════════════════════════════════
   ХИТБОКСЫ
   Раньше столкновения считались по прямоугольнику вокруг объекта,
   поэтому круг ловил игрока за углы, треугольник был стеной, а ротатор
   вращался только на картинке. Теперь у каждого объекта настоящий
   многоугольник, который поворачивается вместе с ним.
   ══════════════════════════════════════════════════ */
var CIRCLE_SIDES = 32;   // чем больше сторон, тем точнее хитбокс круга
/* Рикошет — полное отражение импульса от той грани, в которую попал игрок.
   Коэффициент чуть меньше единицы, иначе отскок копится до бесконечности. */
var RICO_K = 0.96, RICO_MIN = 2.2;

function rawPoly(o){
  var pts, i, a;
  if(o.type === "triangle"){
    pts = [[o.w/2,0],[o.w,o.h],[0,o.h]];
  } else if(o.type === "circle"){
    pts = [];
    for(i=0;i<CIRCLE_SIDES;i++){
      a = i/CIRCLE_SIDES*6.2831853;
      pts.push([o.w/2 + Math.cos(a)*o.w/2, o.h/2 + Math.sin(a)*o.h/2]);
    }
  } else {
    pts = [[0,0],[o.w,0],[o.w,o.h],[0,o.h]];
  }
  return pts;
}

// многоугольник в мировых координатах; пересчитывается только при изменениях
function polyOf(o){
  var ang = (o.spins && playing) ? (o._spin || 0) : (o.rot||0)*Math.PI/180;
  var key = o.x + "," + o.y + "," + o.w + "," + o.h + "," + ang.toFixed(4) + "," + o.type;
  if(o._pk === key) return o._poly;

  var base = rawPoly(o), cx = o.w/2, cy = o.h/2, out = [], i, p, dx, dy;
  var s = Math.sin(ang), c = Math.cos(ang);
  for(i=0;i<base.length;i++){
    p = base[i];
    if(ang){
      dx = p[0]-cx; dy = p[1]-cy;
      out.push([o.x + cx + dx*c - dy*s, o.y + cy + dx*s + dy*c]);
    } else {
      out.push([o.x + p[0], o.y + p[1]]);
    }
  }
  o._pk = key; o._poly = out;
  // габариты для быстрой отбраковки
  var x0=1/0,y0=1/0,x1=-1/0,y1=-1/0;
  for(i=0;i<out.length;i++){
    if(out[i][0]<x0)x0=out[i][0]; if(out[i][0]>x1)x1=out[i][0];
    if(out[i][1]<y0)y0=out[i][1]; if(out[i][1]>y1)y1=out[i][1];
  }
  o._bb = [x0,y0,x1,y1];
  return out;
}
function bbox(o){ polyOf(o); return o._bb; }

// ширина фигуры в горизонтальной полосе [y0,y1] — нужна для движения по X
function spanX(pts, y0, y1){
  var lo=1/0, hi=-1/0, n=pts.length, i, a, b, t, x;
  for(i=0;i<n;i++){
    a = pts[i]; b = pts[(i+1)%n];
    if(a[1] >= y0 && a[1] <= y1){ if(a[0]<lo)lo=a[0]; if(a[0]>hi)hi=a[0]; }
    if((a[1]-y0)*(b[1]-y0) < 0){ t=(y0-a[1])/(b[1]-a[1]); x=a[0]+(b[0]-a[0])*t; if(x<lo)lo=x; if(x>hi)hi=x; }
    if((a[1]-y1)*(b[1]-y1) < 0){ t=(y1-a[1])/(b[1]-a[1]); x=a[0]+(b[0]-a[0])*t; if(x<lo)lo=x; if(x>hi)hi=x; }
  }
  return lo<=hi ? [lo,hi] : null;
}

// высота фигуры в вертикальной полосе [x0,x1] — нужна для движения по Y
function spanY(pts, x0, x1){
  var lo=1/0, hi=-1/0, n=pts.length, i, a, b, t, y;
  for(i=0;i<n;i++){
    a = pts[i]; b = pts[(i+1)%n];
    if(a[0] >= x0 && a[0] <= x1){ if(a[1]<lo)lo=a[1]; if(a[1]>hi)hi=a[1]; }
    if((a[0]-x0)*(b[0]-x0) < 0){ t=(x0-a[0])/(b[0]-a[0]); y=a[1]+(b[1]-a[1])*t; if(y<lo)lo=y; if(y>hi)hi=y; }
    if((a[0]-x1)*(b[0]-x1) < 0){ t=(x1-a[0])/(b[0]-a[0]); y=a[1]+(b[1]-a[1])*t; if(y<lo)lo=y; if(y>hi)hi=y; }
  }
  return lo<=hi ? [lo,hi] : null;
}

// настоящее пересечение игрока с фигурой (для шипов, монет, кнопок)
function overlaps(o, x, y, w, h){
  var bb = bbox(o);
  if(x >= bb[2] || x+w <= bb[0] || y >= bb[3] || y+h <= bb[1]) return false;
  var sp = spanX(polyOf(o), y + 2, y + h - 2);
  return !!sp && x < sp[1] && x+w > sp[0];
}

// точка внутри фигуры — для выделения в редакторе
function inside(o, x, y){
  var pts = polyOf(o), n = pts.length, i, j, r = false;
  for(i=0, j=n-1; i<n; j=i++){
    if(((pts[i][1] > y) !== (pts[j][1] > y)) &&
       (x < (pts[j][0]-pts[i][0])*(y-pts[i][1])/(pts[j][1]-pts[i][1]) + pts[i][0])) r = !r;
  }
  return r;
}

function step(){
  anim++;
  objects.forEach(function(o){
    // Движение и вращение — свойства объекта, а не отдельные типы.
    // Так двигаться и крутиться может любой блок, круг или треугольник.
    if(o.moves){
      o._t += 0.012*(o.speed||1);
      var k = (Math.sin(o._t)+1)/2;
      var nx = o._hx + (o.moveX||0)*k, ny = o._hy + (o.moveY||0)*k;
      o._dx = nx-o.x; o._dy = ny-o.y; o.x = nx; o.y = ny;
    }
    if(o.spins) o._spin += (o.spin||2)*0.02;
    if(o._squash) o._squash *= 0.82;
  });
  if(shake > 0) shake *= 0.86;
  stepWater();
  stepParts();
  if(done || pl.dead) return;

  timeMs += 16.67;
  document.getElementById("sTime").textContent = (timeMs/1000).toFixed(1);

  // рядом с игроком объектов мало — дальние даже не проверяем
  var near = nearby(pl.x - 260, pl.y - 260, pl.w + 520, pl.h + 520);
  var sol = [], i;
  for(i=0;i<near.length;i++) if(solid(near[i])) sol.push(near[i]);

  var wat = waterState(near);

  var dir = (keys.r?1:0)-(keys.l?1:0);
  if(pl.inWater){
    /* В воде разгон и предел скорости ниже, чем на суше, а торможение
       сильнее: плыть заметно медленнее, чем бежать. */
    var wlim = maxVX() * W_SPEED;
    if(dir){ pl.vx += dir*moveA()*W_ACCEL; pl.face = dir; }
    else pl.vx *= W_DRAG;
    pl.vx = Math.max(-wlim, Math.min(wlim, pl.vx));
    if(Math.abs(pl.vx) < .05) pl.vx = 0;
  } else if(dir){
    pl.vx += dir*moveA(); pl.vx = Math.max(-maxVX(), Math.min(maxVX(), pl.vx)); pl.face = dir;
  } else {
    pl.vx *= pl.ground ? FRIC : AIR; if(Math.abs(pl.vx) < .05) pl.vx = 0;
  }

  if(coy > 0) coy--;
  if(buf > 0) buf--;

  if(pl.inWater){
    /* Плавание. Выталкивание пропорционально погружению, поэтому без
       нажатий игрок сам всплывает и держится на поверхности головой
       наружу; кнопка вверх — гребок вверх, вниз — погружение. */
    var depth = Math.max(0, Math.min(1, ((pl.y + pl.h) - wat.top) / pl.h));
    pl.vy += G() * W_GRAV;
    if(wat.sink){
      /* Затягивающая вода: выталкивания нет, вместо него тяга вниз до
         заданной скорости. Барахтаться можно, но выплыть — нет: гребок
         втрое слабее тяги, поэтому из яда уже не выбраться. */
      if(pl.vy < wat.sinkSpeed) pl.vy += (wat.sinkSpeed - pl.vy) * 0.22;
      if(pl.vy < 0) pl.vy = 0;          // вверх не сдвинуться вообще
    } else {
      pl.vy -= G() * W_BUOY * depth * 1.6;
      if(keys.u) pl.vy -= W_SWIM;
    }
    if(keys.d) pl.vy += W_DIVE;
    pl.vy *= W_DRAG;
    pl.vy = Math.max(-W_MAXV, Math.min(W_MAXV, pl.vy));
    buf = 0; coy = 0; pl.selfJump = false;
  } else {
    /* Кнопку прыжка можно держать: как только игрок коснулся земли,
       он прыгает снова, без повторного нажатия. */
    if(keys.u && !pl.selfJump && (pl.ground || coy > 0)) buf = BUFFER;
    if(buf > 0){
      /* Карабканья по стенам нет: от стены не оттолкнуться и по ней
         не забраться. Остаётся только скольжение — см. WALL_SLIDE ниже. */
      if(coy > 0 || pl.ground){
        pl.vy = jumpV(); buf = 0; coy = 0; pl.ground = false; pl.selfJump = true;
        puff(pl.x+pl.w/2, pl.y+pl.h, 5);
      }
    }
    if(!keys.u && pl.vy < 0 && pl.selfJump) pl.vy += G()*0.68;  // short hop on early release

    pl.vy += G();
    // трение о стену: не остановка, а замедленное сползание вниз
    if(pl.wall !== 0 && pl.vy > WALL_SLIDE) pl.vy -= (pl.vy - WALL_SLIDE) * 0.55;
    if(pl.vy > maxFall()) pl.vy = maxFall();
  }

  breathe();

  pl.x += pl.vx; pl.wall = 0;
  sol.forEach(function(o){
    var bb = bbox(o);
    if(pl.x >= bb[2] || pl.x+pl.w <= bb[0] || pl.y >= bb[3] || pl.y+pl.h <= bb[1]) return;
    var P = polyOf(o);
    // полосу чуть поджимаем: иначе стоя точно на блоке игрок цепляет
    // его боком и его выталкивает вбок
    var sp = spanX(P, pl.y + 2, pl.y + pl.h - 2);
    if(!sp || pl.x >= sp[1] || pl.x + pl.w <= sp[0]) return;

    // пологий подъём: на склон и невысокий уступ игрок заходит, а не упирается
    if(pl.ground){
      var top = spanY(P, pl.x + 2, pl.x + pl.w - 2);
      if(top && pl.y + pl.h - top[0] <= STEP_UP && top[0] < pl.y + pl.h){
        pl.y = top[0] - pl.h;
        return;
      }
    }
    if(pl.vx > 0){ pl.x = sp[0] - pl.w; pl.wall = 1; }
    else if(pl.vx < 0){ pl.x = sp[1]; pl.wall = -1; }
    else { pl.x = (pl.x + pl.w/2 < (sp[0]+sp[1])/2) ? sp[0] - pl.w : sp[1]; }
    /* Рикошет: удар в боковую грань отражает движение по X, а не гасит его.
       Медленное касание не отражаем — иначе игрок дрожит, прижавшись к блоку. */
    if(o.ricochet && Math.abs(pl.vx) > RICO_MIN){
      pl.vx = -pl.vx * RICO_K; pl.wall = 0; o._squash = 1;
      puff(pl.x + (pl.vx > 0 ? 0 : pl.w), pl.y + pl.h*0.5, 6);
    } else pl.vx = 0;
  });

  var wasAir = !pl.ground;
  pl.y += pl.vy; pl.ground = false;
  sol.forEach(function(o){
    var bb = bbox(o);
    if(pl.x >= bb[2] || pl.x+pl.w <= bb[0] || pl.y >= bb[3] || pl.y+pl.h <= bb[1]) return;
    var P = polyOf(o);
    var sp = spanY(P, pl.x + 2, pl.x + pl.w - 2);
    if(!sp || pl.y >= sp[1] || pl.y + pl.h <= sp[0]) return;

    if(pl.vy >= 0 && pl.y + pl.h - sp[0] <= Math.max(2, pl.vy + 2)){
      pl.y = sp[0] - pl.h; pl.ground = true; coy = COYOTE;
      // приземление сверху: рикошет швыряет игрока обратно вверх
      if(o.ricochet && pl.vy > RICO_MIN){
        pl.vy = -pl.vy * RICO_K; pl.ground = false; pl.selfJump = false;
        o._squash = 1; puff(pl.x+pl.w/2, pl.y+pl.h, 9);
      } else {
        if(wasAir && pl.vy > 6) puff(pl.x+pl.w/2, pl.y+pl.h, 5);
        pl.vy = 0; pl.selfJump = false;
      }
      if(o.moves){ pl.x += o._dx||0; pl.y += o._dy||0; }
    } else if(pl.vy < 0){
      // удар головой снизу — отражение вниз
      if(o.ricochet && Math.abs(pl.vy) > RICO_MIN){
        pl.y = sp[1]; pl.vy = -pl.vy * RICO_K; o._squash = 1;
        puff(pl.x+pl.w/2, pl.y, 6);
      } else { pl.y = sp[1]; pl.vy = 0; }
    } else {
      pl.y = sp[0] - pl.h; pl.ground = true; coy = COYOTE; pl.vy = 0; pl.selfJump = false;
    }
  });
  if(pl.ground) pl.wall = 0;

  pl.hidden = false;
  near.forEach(function(o){
    var over = overlaps(o, pl.x, pl.y, pl.w, pl.h);
    // зашёл в укрытие — искатель не видит ни фигуру, ни ник
    if(over && o.hideSpot === true) pl.hidden = true;
    if(!over){
      if(o.type === "button" && o._act){ o._act = false; drive(o); }
      if(o.type === "lever") o._latch = false;
      return;
    }
    if(hazard(o)){ die(); return; }
    if(o.type === "coin" && !o._got){
      o._got = true; coins++; stat();
      burst(o.x+o.w/2, o.y+o.h/2, 12, "#fbbf24", 3, 26);
    }
    if(o.type === "checkpoint" && !o._reached){
      o._reached = true; spawnPt = {x:o.x, y:o.y+o.h-pl.h};
      burst(o.x+o.w/2, o.y+o.h*0.25, 14, "#4ade80", 2.6, 30);
    }
    // Дверь — это выход. В игре на двоих уровень засчитывается, когда
    // в неё вошли ВСЕ игроки; одному достаточно дойти самому.
    if(o.type === "finishline" && !done){
      done = true; shake = 6;
      burst(o.x+o.w/2, o.y+o.h/2, 40, "#fbbf24", 5, 60);
      showMsg("ФИНИШ!",
              "Время " + (timeMs/1000).toFixed(1) + "с · монет " + coins + "/" + coinsTotal +
              " · смертей " + deaths + "   —   R заново, Esc выход");
    }
    if(o.type === "button" && !o._act){ o._act = true; drive(o); }
    if(o.type === "lever" && !o._latch){ o._act = !o._act; o._latch = true; drive(o); }
  });

  if(pl.y > 5000) die();
}
function drive(src){
  if(!src.targetIds) return;
  var ids = src.targetIds.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  objects.forEach(function(o){ if(o.customId && ids.indexOf(o.customId) !== -1) o._act = src._act; });
}
function follow(){
  var tx = VW()/2 - (pl.x+pl.w/2)*view.s, ty = VH()*0.6 - (pl.y+pl.h/2)*view.s;
  view.x += (tx-view.x)*0.12; view.y += (ty-view.y)*0.12;
}

/* ══════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════ */
function drawGrid(){
  if(!grid || playing) return;
  var step = GRID * view.s;
  while(step < 9) step *= 2;
  var ox = view.x % step, oy = view.y % step;
  ctx.strokeStyle = "#e6eaf1"; ctx.lineWidth = 1;
  ctx.beginPath();
  for(var x = ox; x < VW(); x += step){ ctx.moveTo(x,0); ctx.lineTo(x,VH()); }
  for(var y = oy; y < VH(); y += step){ ctx.moveTo(0,y); ctx.lineTo(VW(),y); }
  ctx.stroke();
  ctx.strokeStyle = "#cfd6e2"; ctx.lineWidth = 1.4; ctx.beginPath();
  ctx.moveTo(view.x,0); ctx.lineTo(view.x,VH()); ctx.moveTo(0,view.y); ctx.lineTo(VW(),view.y);
  ctx.stroke();
}
function paint(o, isSel){
  if(o.type === "coin" && o._got) return;
  var open = opened(o);
  ctx.save();
  ctx.translate(o.x+o.w/2, o.y+o.h/2);
  ctx.rotate(o.spins && playing ? (o._spin||0) : (o.rot||0)*Math.PI/180);
  ctx.translate(-o.w/2, -o.h/2);
  if(open) ctx.globalAlpha = .2;
  if(o.ghost) ctx.globalAlpha *= .45;      // проходимые видно, но они не мешают
  (PAINT[o.type] || PAINT.rect)(o);
  if(!playing && o.deadly && DEADLY_BY_DEFAULT.indexOf(o.type) === -1){
    ctx.globalAlpha = 1; ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2;
    ctx.setLineDash([5,4]); ctx.strokeRect(-1,-1,o.w+2,o.h+2); ctx.setLineDash([]);
  }
  // укрытие для пряток видно только в редакторе — зелёной рамкой
  if(!playing && o.hideSpot){
    ctx.globalAlpha = 1; ctx.strokeStyle = "#16a34a"; ctx.lineWidth = 2;
    ctx.setLineDash([3,3]); ctx.strokeRect(-2,-2,o.w+4,o.h+4); ctx.setLineDash([]);
  }
  ctx.restore();
  if(isSel && o.type !== "spawn"){
    var k = 1/view.s;
    ctx.save();
    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 1.6*k; ctx.setLineDash([5*k,4*k]);
    ctx.strokeRect(o.x-3*k, o.y-3*k, o.w+6*k, o.h+6*k); ctx.setLineDash([]);
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 1.6*k;
    grips(o).forEach(function(h){
      ctx.beginPath(); ctx.arc(h.x,h.y,4.5*k,0,6.2832); ctx.fill(); ctx.stroke();
    });
    ctx.restore();
  }
}
/* ══════════════════════════════════════════════════
   ВОДА НА ЧАСТИЦАХ
   В редакторе вода — залитые клетки: так автор видит объём. В игре из
   этих клеток рождается рой частиц с обычной физикой — тяжесть,
   отталкивание соседей, столкновения. Частицы не выливаются за
   пределы налитого объёма: он работает как ёмкость, иначе бассейн,
   нарисованный в воздухе, утёк бы и карта сломалась.
   ══════════════════════════════════════════════════ */
var wp = [];            // частицы
var wcell = null;       // клетки, где вода разрешена (ключ "cx,cy")
var wcolor = WATER_DEF, wacid = false;

function wkey(x, y){ return Math.floor(x/WCELL) + "," + Math.floor(y/WCELL); }
function cellOK(x, y){ return wcell ? wcell[wkey(x, y)] === 1 : false; }

/* Раскладываем частицы по объёму. Если воды налито много, шаг
   увеличивается, чтобы не выйти за потолок в P_MAX частиц. */
function buildWater(){
  wp.length = 0; wcell = {};
  var vols = [], i, o, area = 0;
  for(i=0;i<objects.length;i++){
    o = objects[i];
    if(o.type !== "water") continue;
    vols.push(o); area += o.w * o.h;
    if(o.fill) wcolor = o.fill;
    wacid = !!o.acid;
  }
  if(!vols.length){ wcell = null; return; }

  // клетки объёма минус те, что заняты твёрдым: иначе частицы застрянут в стене
  var solids = [];
  for(i=0;i<objects.length;i++) if(solid(objects[i])) solids.push(bbox(objects[i]));
  for(i=0;i<vols.length;i++){
    o = vols[i];
    for(var cy = o.y; cy < o.y + o.h; cy += WCELL)
      for(var cx = o.x; cx < o.x + o.w; cx += WCELL){
        var mx = cx + WCELL/2, my = cy + WCELL/2, hit = false;
        for(var s=0;s<solids.length;s++){
          var b = solids[s];
          if(mx > b[0] && mx < b[2] && my > b[1] && my < b[3]){ hit = true; break; }
        }
        if(!hit) wcell[wkey(cx, cy)] = 1;
      }
  }

  var step = P_STEP;
  while(area / (step*step) > P_MAX) step += 2;
  for(i=0;i<vols.length && wp.length < P_MAX;i++){
    o = vols[i];
    for(var y = o.y + step/2; y < o.y + o.h && wp.length < P_MAX; y += step)
      for(var x = o.x + step/2; x < o.x + o.w && wp.length < P_MAX; x += step){
        if(!cellOK(x, y)) continue;
        wp.push({ x: x + (Math.random()-0.5)*2, y: y + (Math.random()-0.5)*2, vx: 0, vy: 0 });
      }
  }
}

/* Шаг физики роя. Соседей ищем по хеш-сетке, иначе на 700 частицах
   получается четверть миллиона пар за кадр. */
function stepWater(){
  var n = wp.length;
  if(!n || !wcell) return;
  var i, j, p, q, g = G() * 0.5, D = P_R * 2, cell = D;
  var grid = {}, key, cx, cy, k;

  for(i=0;i<n;i++){
    p = wp[i];
    p.vy += g;
    key = Math.floor(p.x/cell) + "," + Math.floor(p.y/cell);
    (grid[key] = grid[key] || []).push(i);
  }

  for(i=0;i<n;i++){
    p = wp[i];
    cx = Math.floor(p.x/cell); cy = Math.floor(p.y/cell);
    for(var ox=-1; ox<=1; ox++) for(var oy=-1; oy<=1; oy++){
      var b = grid[(cx+ox) + "," + (cy+oy)];
      if(!b) continue;
      for(k=0;k<b.length;k++){
        j = b[k];
        if(j <= i) continue;
        q = wp[j];
        var dx = q.x - p.x, dy = q.y - p.y;
        var d2 = dx*dx + dy*dy;
        if(d2 > D*D || d2 < 0.0001) continue;
        var d = Math.sqrt(d2), f = (D - d) / D * 0.42;
        dx /= d; dy /= d;
        p.vx -= dx*f; p.vy -= dy*f;
        q.vx += dx*f; q.vy += dy*f;
      }
    }
  }

  // игрок расталкивает воду вокруг себя
  if(playing && !pl.dead && pl.inWater){
    var px = pl.x + pl.w/2, py = pl.y + pl.h/2, rr = Math.max(pl.w, pl.h)*0.6;
    for(i=0;i<n;i++){
      p = wp[i];
      var ddx = p.x - px, ddy = p.y - py, dd = Math.sqrt(ddx*ddx + ddy*ddy);
      if(dd > rr || dd < 0.001) continue;
      p.vx += ddx/dd * 0.5; p.vy += ddy/dd * 0.5;
    }
  }

  for(i=0;i<n;i++){
    p = wp[i];
    p.vx *= 0.93; p.vy *= 0.985;
    if(p.vx >  6) p.vx =  6; if(p.vx < -6) p.vx = -6;
    if(p.vy >  8) p.vy =  8; if(p.vy < -8) p.vy = -8;
    // по осям отдельно: так частица скользит вдоль стенки, а не залипает
    var nx = p.x + p.vx;
    if(cellOK(nx, p.y)) p.x = nx; else p.vx *= -0.3;
    var ny = p.y + p.vy;
    if(cellOK(p.x, ny)) p.y = ny; else p.vy *= -0.3;
  }
}

/* Метабол-рендер. Каждая частица — мягкое пятно; пятна складываются,
   потом плотность прогоняется через порог, и края слипаются в общий
   контур. Никаких спрайтов, всё считается на холсте. */
/* Заготовка пятна: перерисовывается только когда заметно поменялся
   масштаб, а не каждый кадр. */
var bcv = null, bcx = null, bR = -1;
function blobSprite(r){
  var size = Math.max(4, Math.min(160, Math.round(r*2)));
  if(bcv && Math.abs(bR - size) < 2) return bcv;
  if(!bcv){
    bcv = document.createElement("canvas");
    bcx = bcv.getContext ? bcv.getContext("2d") : null;
  }
  if(!bcx) return null;
  bcv.width = size; bcv.height = size; bR = size;
  bcx.clearRect(0,0,size,size);
  var h = size/2;
  var g = bcx.createRadialGradient(h, h, 0, h, h, h);
  g.addColorStop(0,   "rgba(255,255,255,0.62)");
  g.addColorStop(0.5, "rgba(255,255,255,0.28)");
  g.addColorStop(1,   "rgba(255,255,255,0)");
  bcx.fillStyle = g;
  bcx.fillRect(0,0,size,size);
  return bcv;
}

var wcv = null, wcx = null;
function drawParticles(){
  var n = wp.length;
  if(!n) return;
  if(!wcv){
    wcv = document.createElement("canvas");
    wcx = wcv.getContext ? wcv.getContext("2d") : null;
  }
  if(!wcx) return;
  var W = Math.max(1, Math.round(VW())), H = Math.max(1, Math.round(VH()));
  if(wcv.width !== W || wcv.height !== H){ wcv.width = W; wcv.height = H; }
  wcx.setTransform(1,0,0,1,0,0);
  wcx.clearRect(0,0,W,H);

  var s = view.s, ox = view.x, oy = view.y;
  var r = P_R * s * 2.1;
  if(r < 1) return;

  // 1. плотность: одно мягкое пятно рисуется заранее и потом штампуется.
  //    Считать градиент на каждую частицу каждый кадр слишком дорого.
  var blob = blobSprite(r);
  if(!blob) return;
  wcx.globalCompositeOperation = "lighter";
  for(var i=0;i<n;i++){
    var p = wp[i];
    var sx = p.x*s + ox, sy = p.y*s + oy;
    if(sx < -r || sy < -r || sx > W+r || sy > H+r) continue;
    wcx.drawImage(blob, sx-r, sy-r, r*2, r*2);
  }
  // 2. порог: складывая картинку саму с собой, поднимаем плотные места
  //    почти до единицы, а редкие брызги оставляем прозрачными
  wcx.drawImage(wcv, 0, 0);
  wcx.drawImage(wcv, 0, 0);

  // 3. красим получившийся объём
  wcx.globalCompositeOperation = "source-in";
  var body = wcx.createLinearGradient(0, 0, 0, H);
  body.addColorStop(0, shade(wcolor, 30));
  body.addColorStop(1, shade(wcolor, -28));
  wcx.fillStyle = body;
  wcx.fillRect(0, 0, W, H);
  wcx.globalCompositeOperation = "source-over";

  ctx.save();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha = 0.88;
  ctx.drawImage(wcv, 0, 0, W, H);
  ctx.restore();
}

/* ── ВОДА В РЕДАКТОРЕ: рисуется скриптом, никаких картинок ──
   Тело — вертикальный градиент выбранного цвета, поверхность — живая
   синусоида, и только там, где сверху нет другой воды. */
var _wsig = "";
/* Рой пересобирается, когда объём воды в карте изменился. Подпись
   считаем по клеткам: этого достаточно и это дёшево. */
function syncWater(){
  var sig = "", n = 0;
  for(var i=0;i<objects.length;i++){
    var o = objects[i];
    if(o.type !== "water") continue;
    sig += o.x + "," + o.y + "," + o.w + "," + o.h + ";"; n++;
  }
  if(sig === _wsig) return;
  _wsig = sig;
  buildWater();
}
function drawWater(vx0, vy0, vx1, vy1){
  // и в редакторе, и в игре вода это рой частиц, а не заливка
  syncWater();
  if(!playing) stepWater();
  drawParticles();
  return;
  var ws = [];
  for(var i=0;i<objects.length;i++){
    var o = objects[i];
    if(o.type !== "water") continue;
    if(o.x+o.w < vx0 || o.x > vx1 || o.y+o.h < vy0 || o.y > vy1) continue;
    ws.push(o);
  }
  if(!ws.length) return;

  ctx.save();
  for(i=0;i<ws.length;i++){
    var w = ws[i], c = w.fill || WATER_DEF;
    ctx.globalAlpha = 0.58;
    var g = ctx.createLinearGradient(0, w.y, 0, w.y + w.h);
    g.addColorStop(0, shade(c, 26));
    g.addColorStop(1, shade(c, -30));
    ctx.fillStyle = g;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    // кислота: поверх цвета ложится ядовитый отсвет, чтобы её было видно
    if(w.acid){
      ctx.globalAlpha = 0.34 + Math.sin(anim*0.06 + w.x*0.01)*0.06;
      ctx.fillStyle = "#84cc16";
      ctx.fillRect(w.x, w.y, w.w, w.h);
    }
  }

  // пузырьки — тоже скрипт, положение считается от координат и времени
  ctx.globalAlpha = 0.30; ctx.fillStyle = "#ffffff";
  for(i=0;i<ws.length;i++){
    var b = ws[i];
    if(b.w < 40) continue;
    var n = Math.min(5, Math.floor(b.w/70));
    for(var k=0;k<n;k++){
      var seed = (b.x*13 + b.y*7 + k*97);
      var bx = b.x + ((seed*37) % Math.max(1, b.w|0));
      var by = b.y + b.h - ((anim*0.9 + seed*11) % Math.max(1, b.h|0));
      var br = 1.4 + ((seed % 5) * 0.4);
      ctx.beginPath(); ctx.arc(bx, by, br, 0, 6.2832); ctx.fill();
    }
  }

  // поверхность: у каждого куска вычитаем то, что накрыто водой сверху
  for(i=0;i<ws.length;i++){
    var s = ws[i];
    var free = [[s.x, s.x + s.w]];
    for(var j=0;j<ws.length;j++){
      var a = ws[j];
      if(a === s) continue;
      if(Math.abs((a.y + a.h) - s.y) > 2) continue;    // не стоит вплотную сверху
      free = cutSpan(free, a.x, a.x + a.w);
    }
    for(j=0;j<free.length;j++) waveAt(free[j][0], free[j][1], s.y, s.fill || WATER_DEF);
  }
  ctx.restore();
}

// вырезаем из набора отрезков кусок [a,b]
function cutSpan(list, a, b){
  var out = [];
  for(var i=0;i<list.length;i++){
    var s = list[i][0], e = list[i][1];
    if(b <= s || a >= e){ out.push([s,e]); continue; }
    if(a > s) out.push([s, a]);
    if(b < e) out.push([b, e]);
  }
  return out;
}

function waveAt(a, b, y, color){
  if(b - a < 3) return;
  var amp = 2.6, step = 5;
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.moveTo(a, y + 9);
  ctx.lineTo(a, y);
  for(var x = a; x <= b; x += step)
    ctx.lineTo(x, y + Math.sin(x*0.055 + anim*0.05) * amp);
  ctx.lineTo(b, y);
  ctx.lineTo(b, y + 9);
  ctx.closePath();
  ctx.fillStyle = shade(color, 46);
  ctx.fill();

  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = shade(color, 66); ctx.lineWidth = 1.6;
  ctx.beginPath();
  for(x = a; x <= b; x += step){
    var yy = y + Math.sin(x*0.055 + anim*0.05) * amp;
    x === a ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
  }
  ctx.stroke();
}

/* Полоски воздуха и здоровья. Рисуем на холсте, а не в разметке:
   так они одинаковы и в редакторе, и в игре. */
function drawBreathHud(){
  if(!playing || pl.dead) return;
  var showAir = pl.air < AIR_MAX;
  var showHp  = pl.hp  < HP_MAX;
  if(!showAir && !showHp) return;

  var W = 190, H = 9, x = VW()/2 - W/2, y = VH() - 74;
  ctx.save();
  ctx.font = "600 11px system-ui, sans-serif";
  ctx.textBaseline = "middle";

  function bar(label, frac, color, yy){
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = "#0f172a";
    ctx.fillText(label, x - 34, yy + H/2);
    ctx.fillStyle = "rgba(15,23,42,.16)";
    ctx.fillRect(x, yy, W, H);
    ctx.fillStyle = color;
    ctx.fillRect(x, yy, W * Math.max(0, Math.min(1, frac)), H);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "rgba(15,23,42,.35)"; ctx.lineWidth = 1;
    ctx.strokeRect(x + .5, yy + .5, W - 1, H - 1);
  }
  if(showAir) bar("Воздух", pl.air / AIR_MAX,
                  pl.air < AIR_MAX * 0.3 ? "#ef4444" : "#38bdf8", y);
  if(showHp)  bar("Здоровье", pl.hp / HP_MAX,
                  pl.hp < 35 ? "#ef4444" : "#22c55e", y + (showAir ? H + 6 : 0));
  ctx.restore();
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* Холст всегда светлый, независимо от темы сайта: карта — это
     содержимое игры, и она должна выглядеть у всех одинаково. */
  var bg = ctx.createLinearGradient(0,0,0,VH());
  bg.addColorStop(0,"#fbfcfe"); bg.addColorStop(1,"#eef2f8");
  ctx.fillStyle = bg; ctx.fillRect(0,0,VW(),VH());
  drawGrid();

  var sx = shake > .4 ? (Math.random()-.5)*shake : 0, sy = shake > .4 ? (Math.random()-.5)*shake : 0;
  ctx.setTransform(view.s*DPR,0,0,view.s*DPR, (view.x+sx)*DPR, (view.y+sy)*DPR);

  // рисуем только то, что попадает на экран
  var vx0 = -view.x/view.s - 80, vy0 = -view.y/view.s - 80;
  var vx1 = vx0 + VW()/view.s + 160, vy1 = vy0 + VH()/view.s + 160;
  var drawn = 0;
  for(var ri=0; ri<objects.length; ri++){
    var ro = objects[ri], rb = bbox(ro);
    if(rb[2] < vx0 || rb[0] > vx1 || rb[3] < vy0 || rb[1] > vy1) continue;
    if(ro.type === "water") continue;      // вода рисуется отдельным слоем поверх
    paint(ro, !playing && ro === sel); drawn++;
  }
  drawWater(vx0, vy0, vx1, vy1);
  if(playing && !pl.dead){
    ctx.save(); ctx.translate(pl.x, pl.y);
    // себя в укрытии видно бледным — чужие не видят вообще
    if(pl.hidden) ctx.globalAlpha = 0.35;
    figure(pl.w, pl.h, (window.GAME && window.GAME.myColor) || "#111827", true,
           (window.GAME && window.GAME.mySkin) || null);
    ctx.restore();
  }

function waterStyle(){
  for(var i=0;i<objects.length;i++){
    var o = objects[i];

    return { fill: o.fill || WATER_DEF, acid: !!o.acid,

  }

  var rows = {}, rest = [];
  objects.forEach(function(o){
    if(o.type === "water" && o.h === WCELL){
      var k = o.y + "|" + (o.fill || WATER_DEF) + "|" + (o.acid ? 1 : 0)
            + "|" + (o.sink ? 1 : 0) + "|" + (o.sinkSpeed || SINK_DEF);
      (rows[k] = rows[k] || []).push(o);

  });

  Object.keys(rows).forEach(function(k){
    var list = rows[k].sort(function(a,b){ return a.x - b.x; });
    var cur = null;
    list.forEach(function(o){
      if(cur && o.x <= cur.x + cur.w + 0.001){

      } else { cur = o; out.push(o); }

    e.preventDefault(); return;
  }
  var p = toWorld(c.x,c.y);
  move(p.x,p.y); e.preventDefault();
}, {passive:false});
cv.addEventListener("touchend", function(e){
  if(playing) return;
  if(e.touches.length === 0){
    pinch = null;
    if(pan){ pan = null; cv.style.cursor = tool === "hand" ? "grab" : "default"; }
    else up();
  }
  e.preventDefault();
}, {passive:false});

/* Пока пишешь в чат, ходить всё равно можно: стрелки остаются за игроком,
   а буквы уходят в текст. Раньше любое поле ввода блокировало управление
   целиком, и во время набора игрок стоял столбом. */
function typingInChat(){
  var el = document.activeElement;
  return !!(el && el.id === "gMsg");
}
function inSomeField(){
  var el = document.activeElement;
  if(!el) return false;
  if(el.id === "gMsg") return false;                 // чат — особый случай
  return el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable;
}
function movementKey(code){
  return code === "ArrowLeft" || code === "ArrowRight"
      || code === "ArrowUp"   || code === "ArrowDown";
}

document.addEventListener("keydown", function(e){
  if(inSomeField()) return;
  if(playing){
    // в чате слушаем только стрелки, иначе буквы не набрать
    if(typingInChat() && !movementKey(e.code)) return;
    if(typingInChat()) e.preventDefault();           // курсор в поле не двигаем

    if(e.code === "ArrowLeft" || e.code === "KeyA") keys.l = true;
    if(e.code === "ArrowRight"|| e.code === "KeyD") keys.r = true;
    if(e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space"){ keys.u = true; buf = BUFFER; e.preventDefault(); }
    // вниз нужен только в воде — погружение
    if(e.code === "ArrowDown" || e.code === "KeyS"){ keys.d = true; e.preventDefault(); }
    if(e.code === "KeyR"){ done = false; hideMsg(); coins = 0;
      objects.forEach(function(o){ o._got = false; }); timeMs = 0; stat(); respawn(); }
    if(e.code === "Escape") stop();
    return;
  }
  var mod = e.ctrlKey || e.metaKey;
  if(mod && e.code === "KeyZ"){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if(mod && e.code === "KeyY"){ e.preventDefault(); redo(); return; }
  if(mod && e.code === "KeyD"){ e.preventDefault(); duplicate(); return; }
  /* Ctrl+C кладёт объект в буфер, Ctrl+V ставит копию по центру под
     курсором — там, где мышь была в последний раз над холстом. */
  if(mod && e.code === "KeyC"){ e.preventDefault(); copySel(); return; }
  if(mod && e.code === "KeyV"){ e.preventDefault(); pasteAt(mouseW.x, mouseW.y); return; }
  if(e.code === "Space"){ spaceDown = true; e.preventDefault(); }
  if(e.code === "KeyG"){ grid = !grid; document.getElementById("bGrid").classList.toggle("on", grid); }
  if((e.key === "Delete" || e.key === "Backspace") && sel){ removeSel(); }
  if(e.key === "+" || e.key === "=") zoomAt(VW()/2, VH()/2, 1.15);
  if(e.key === "-" || e.key === "_") zoomAt(VW()/2, VH()/2, 1/1.15);
  if(e.key === "0") resetView();
});
document.addEventListener("keyup", function(e){
  if(inSomeField()) return;
  if(e.code === "Space") spaceDown = false;
  if(playing){
    if(e.code === "ArrowLeft" || e.code === "KeyA") keys.l = false;
    if(e.code === "ArrowRight"|| e.code === "KeyD") keys.r = false;
    if(e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") keys.u = false;
    if(e.code === "ArrowDown" || e.code === "KeyS") keys.d = false;
  }
});
function pad(id, fn){
  var e = document.getElementById(id);
  ["touchstart","mousedown"].forEach(function(t){ e.addEventListener(t,function(ev){ fn(true); ev.preventDefault(); },{passive:false}); });
  ["touchend","touchcancel","mouseup","mouseleave"].forEach(function(t){ e.addEventListener(t,function(ev){ fn(false); ev.preventDefault(); },{passive:false}); });
}

pad("pRight", function(v){ keys.r = v; });
pad("pJump",  function(v){ keys.u = v; if(v) buf = BUFFER; });

function duplicate(){
  if(!sel) return;
  if(sel.type === "coin" && countCoins() >= COIN_LIMIT){ coinWarn(); return; }
  if(overLimit(1)) return;
  commit();

  if(c.customId) c.customId = "w"+c.id;

function inspect(){
  var box = document.getElementById("insp");
  if(!sel || playing){ box.style.display = "none"; return; }
  box.style.display = "flex";
  props.innerHTML = "";
  var T = TOOLS.filter(function(x){ return x.t === sel.type; })[0];
  var head = document.createElement("div"); head.id = "objTitle";
  head.innerHTML = (T ? T.n : sel.type) + "<span>#" + sel.id + "</span>";
  props.appendChild(head);

  num("X", sel.x, function(v){ sel.x = v; });
  num("Y", sel.y, function(v){ sel.y = v; });
  /* Размер игрока задан движком (20x60) и не редактируется, иначе одна
     и та же карта проходится по-разному у разных авторов. */
  if(sel.type !== "spawn"){
    num("Ширина", sel.w, function(v){ sel.w = Math.max(1,v); });
    num("Высота", sel.h, function(v){ sel.h = Math.max(1,v); });
    num("Поворот", sel.rot||0, function(v){ sel.rot = v; });
  } else {
    var sr = pr();
    sr.innerHTML = "<label>Размер</label><b style='font-size:12px'>20 x 60</b>";
  }

  var r = pr();
  var isWater = sel.type === "water";
  r.innerHTML = "<label>" + (isWater ? "Цвет всей воды" : "Цвет") + "</label>";
  var ci = document.createElement("input"); ci.type = "color";
  ci.value = (sel.fill && sel.fill[0] === "#" && sel.fill.length === 7) ? sel.fill : "#4b5563";
  ci.addEventListener("focus", commit);
  ci.addEventListener("input", function(){
    // вода на уровне всегда одного цвета — красим сразу весь объём
    if(isWater) objects.forEach(function(o){ if(o.type === "water") o.fill = ci.value; });
    else sel.fill = ci.value;
  });
  r.appendChild(ci);
  if(sel.type === "text") txt("Текст", sel.text, function(v){ sel.text = v; });

  grp("Игровые свойства");
  if(sel.type === "water"){
    /* Яд: включаешь — весь объём разом перекрашивается в ядовитый зелёный
       и начинает затягивать вниз, выключаешь — возвращается обычная синяя
       вода. Цвет всё равно можно потом поменять вручную. */
    chk("Яд (опасная вода)", !!sel.acid, function(v){
      objects.forEach(function(o){
        if(o.type !== "water") return;
        o.acid = v;
        o.fill = v ? ACID_DEF : WATER_DEF;
        o.sink = v;
        if(v && !o.sinkSpeed) o.sinkSpeed = SINK_DEF;
      });
      inspect();
    });
    /* Затягивание работает и на обычной воде — получается трясина. */
    chk("Затягивает вниз", !!sel.sink, function(v){
      objects.forEach(function(o){
        if(o.type !== "water") return;
        o.sink = v;
        if(v && !o.sinkSpeed) o.sinkSpeed = SINK_DEF;
      });
      inspect();
    });
    if(sel.sink)
      num("Скорость затягивания", sel.sinkSpeed || SINK_DEF, function(v){
        var sp = Math.max(0.2, Math.min(8, v));
        objects.forEach(function(o){ if(o.type === "water") o.sinkSpeed = sp; });
      });
    var wn = objects.filter(function(o){ return o.type === "water"; }).length;
    var wr = pr();
    wr.innerHTML = "<label>Объёмов воды</label><b style='font-size:12px'>" + wn + "</b>";
  }
  if(["spawn","checkpoint","finishline","coin","water"].indexOf(sel.type) === -1)
    chk("Яд (убивает)", sel.deadly, function(v){ sel.deadly = v; });
  if(SOLID.indexOf(sel.type) !== -1)
    chk("Проходимый (декорация)", !!sel.ghost, function(v){ sel.ghost = v; });
  /* Прятки: за таким объектом игрок исчезает для искателя вместе с ником.
     Коллизии у него нет — иначе внутрь не зайти. */
  if(SOLID.indexOf(sel.type) !== -1 && mode === "hideAndSeek")
    chk("Укрытие для пряток", !!sel.hideSpot, function(v){ sel.hideSpot = v; });
  /* Рикошет, движение и вращение — свойства, а не отдельные объекты.
     Любой блок можно сделать отражающим, подвижным или крутящимся. */
  if(SOLID.indexOf(sel.type) !== -1){
    /* Рикошет вместо батута: удар отражается от той грани, в которую
       попал игрок, а не подбрасывает его всегда вверх. */
    chk("Рикошет", !!sel.ricochet, function(v){ sel.ricochet = v; });

    chk("Двигается", !!sel.moves, function(v){
      sel.moves = v;
      if(v && !sel.moveX && !sel.moveY){ sel.moveX = 130; sel.moveY = 0; sel.speed = 1.1; }
      inspect();
    });
    if(sel.moves){
      num("Ход по X", sel.moveX||0, function(v){ sel.moveX = v; });
      num("Ход по Y", sel.moveY||0, function(v){ sel.moveY = v; });
      num("Скорость", sel.speed||1, function(v){ sel.speed = v; });
    }

    chk("Вращается", !!sel.spins, function(v){
      sel.spins = v;
      if(v && !sel.spin) sel.spin = 2;
      inspect();
    });
    if(sel.spins) num("Скорость вращения", sel.spin||2, function(v){ sel.spin = v; });
  }
  if(LINKED.indexOf(sel.type) !== -1){
    grp("Связи");
    txt("ID", sel.customId, function(v){ sel.customId = v; });
    if(sel.type === "button" || sel.type === "lever") txt("Цели", sel.targetIds, function(v){ sel.targetIds = v; });
    if(SOLID.indexOf(sel.type) !== -1)
      chk("Открыт сначала (проходим)", sel.startsOpen, function(v){ sel.startsOpen = v; });
    linkHelp();
  }

  grp("Порядок");
  var z = document.createElement("div"); z.className = "zBtns";
  z.innerHTML = "<div data-z='b'>На зад</div><div data-z='f'>Вперёд</div>";
  z.addEventListener("click", function(e){
    var b = e.target.closest("[data-z]"); if(!b) return;
    commit();
    objects = objects.filter(function(o){ return o !== sel; });
    b.dataset.z === "f" ? objects.push(sel) : objects.unshift(sel);
  });
  props.appendChild(z);
}

/* ══════════════════════════════════════════════════
   SAVE / LOAD  (.txt of decimal numbers, signed)
   ══════════════════════════════════════════════════ */
var DEV_KEY = "ARTEM_DEV_ONLY";
function fnv(s){
  var h = 0x811c9dc5;
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0; }
  return h.toString(16).padStart(8,"0");
}
function nativeZip(){ return typeof CompressionStream !== "undefined" && typeof DecompressionStream !== "undefined"; }
async function drain(rs){
  var rd = rs.getReader(), ch = [], n = 0, r;
  while(true){ r = await rd.read(); if(r.done) break; ch.push(r.value); n += r.value.length; }
  var out = new Uint8Array(n), off = 0;
  ch.forEach(function(c){ out.set(c,off); off += c.length; });
  return out;
}
async function zip(str){
  var raw = new TextEncoder().encode(str);
  if(nativeZip()){
    try{ var cs = new CompressionStream("deflate-raw"), w = cs.writable.getWriter();
      w.write(raw); w.close(); return {b: await drain(cs.readable), m:1};
    }catch(e){}
  }
  return {b:raw, m:0};
}
async function unzip(bytes, m){
  if(m === 1 && nativeZip()){
    var ds = new DecompressionStream("deflate-raw"), w = ds.writable.getWriter();
    w.write(bytes); w.close();
    return new TextDecoder().decode(await drain(ds.readable));
  }
  return new TextDecoder().decode(bytes);
}
function clean(){
  return objects.map(function(o){ var c = {}; for(var k in o) if(k[0] !== "_") c[k] = o[k]; return c; });
}
document.getElementById("bSave").addEventListener("click", async function(){
  var json = JSON.stringify({mode:mode, gravity:gravityScale, objects:clean(), version:4});
  var sig = fnv(DEV_KEY + json), r = await zip(json);
  var nums = new Array(r.b.length+1); nums[0] = r.m;
  for(var i=0;i<r.b.length;i++) nums[i+1] = r.b[i];
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([sig+"|"+nums.join(",")], {type:"text/plain"}));
  a.download = "map_"+mode+".txt"; a.click();
});

/* ── Импорт карт из оригинального brofist.io ───────────────────────
   Файл оттуда — список байтов со знаком, внутри LZMA, внутри JSON сцены.
   Распаковка и перевод в наши объекты: lzma.js + bfImport.js.        */
function importOriginal(raw){
  if(!window.BFImport){ dialog("Импорт недоступен","Не загружен bfImport.js.",null); return false; }
  var scene, want;
  try{
    scene = BFImport.parseScene(raw);
    want = BFImport.suggestMode(scene);
  }catch(err0){
    dialog("Не получилось прочитать карту", String(err0.message || err0), null);
    return false;
  }

  var switched = "";
  if(want && want !== mode && allowedIn("rect", want)){
    switched = mode + " → " + want;
    mode = want;
    document.querySelectorAll(".modeBtn").forEach(function(b){ b.classList.toggle("on", b.dataset.mode === mode); });
    syncTools();
    if(!toolOK(tool)) setTool("select");
  }

  var r;
  try{
    r = BFImport.convert(scene, {
      mode: mode,
      objLimit: OBJ_LIMIT,
      coinLimit: COIN_LIMIT,
      allowed: allowedIn
    });
  }catch(err){
    dialog("Не получилось прочитать карту", String(err.message || err), null);
    return false;
  }
  if(!r.objects.length){
    dialog("Пусто","В файле не нашлось ни одного объекта.",null);
    return false;
  }

  commit();
  objects = r.objects;
  uid = objects.reduce(function(m2,o){ return Math.max(m2,(o.id||0)+1); },1);
  sel = null; markDirty(); indexMovers(); inspect(); resetView();

  var st = r.stats, notes = [];
  notes.push("Перенесено объектов: " + objects.length + " из " + st.total + " фигур.");
  if(switched) notes.push("Режим переключён: " + switched + " — в карте есть его объекты.");
  if(st.ghosts)    notes.push("Без столкновений (декорации): " + st.ghosts + ".");
  if(st.wrongMode) notes.push("Не подходят режиму «" + mode + "»: " + st.wrongMode + ".");
  if(st.coinsCut)  notes.push("Монет убрано сверх лимита " + COIN_LIMIT + ": " + st.coinsCut + ".");
  if(st.overLimit) notes.push("Не влезло в лимит " + OBJ_LIMIT + ": " + st.overLimit + ".");
  if(!st.spawn)    notes.push("Точки старта в файле не было — поставил сам, проверьте её.");
  notes.push("Размер приведён к нашему игроку (масштаб 0.73).");
  dialog("Карта из brofist.io загружена", notes.join(" "), null);
  return true;
}

// файл из оригинала: только цифры и запятые, без нашей подписи
function looksOriginal(raw){
  var s = String(raw).trim();
  if(s.indexOf("|") !== -1) return false;
  return s[0] === "[" || /^-?\d+\s*,\s*-?\d+/.test(s);
}

document.getElementById("file").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = async function(){
    try{
      var raw = String(rd.result).trim(), p = raw.indexOf("|");
      // карта из оригинального brofist.io — уводим в импорт
      if(looksOriginal(raw)){ importOriginal(raw); return; }
      if(p === -1){ dialog("Доступ запрещён","Файл не подписан этим редактором.",null); return; }
      var sig = raw.slice(0,p), nums = raw.slice(p+1).split(",").map(function(s){ return parseInt(s,10); });
      var json = await unzip(new Uint8Array(nums.slice(1)), nums[0]);
      if(fnv(DEV_KEY+json) !== sig){ dialog("Доступ запрещён","Ключ карты не совпадает. Только разработчик.",null); return; }
      var d = JSON.parse(json);
      commit();
      objects = d.objects || [];
      uid = objects.reduce(function(m2,o){ return Math.max(m2,(o.id||0)+1); },1);
      mode = d.mode || "hideAndSeek";
      if(d.gravity !== undefined){
        // гравитация из старой карты игнорируется: она всегда 9
      }
      document.querySelectorAll(".modeBtn").forEach(function(b){ b.classList.toggle("on", b.dataset.mode === mode); });
      syncTools(); sel = null; inspect();
    }catch(err){ dialog("Ошибка","Не удалось прочитать файл карты.",null); }
  };
  rd.readAsText(f); e.target.value = "";
});
window.getEditorMap = function(){ return { mode: mode, data: JSON.stringify({mode:mode,gravity:gravityScale,objects:clean()}) }; };
