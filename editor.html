<!DOCTYPE html>
<html data-page="editor" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>AIBrofist — Editor</title>
<style>
:root{
  --accent:#3b82f6; --accent-dark:#2563eb; --ink:#1e2530; --muted:#8b93a1;
  --line:#dfe3ea; --panel:#ffffff; --shadow:0 6px 24px rgba(23,32,50,.10), 0 1px 3px rgba(23,32,50,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;height:100%;width:100%;touch-action:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f4f6fa;color:var(--ink);-webkit-font-smoothing:antialiased}
canvas{display:block;position:absolute;inset:0;touch-action:none}

/* ===== мобильная раскладка редактора ===== */
@media (max-width: 820px), (pointer: coarse) and (max-width: 1100px){
  #modes{top:8px;left:8px;right:8px;overflow-x:auto;max-width:calc(100vw - 16px);
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  #modes::-webkit-scrollbar{display:none}
  .modeBtn{padding:9px 11px;font-size:12px;white-space:nowrap}

  #scene{top:auto;bottom:70px;left:50%;transform:translateX(-50%);
    max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
  #scene::-webkit-scrollbar{display:none}

  #tools{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:none;
    flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 8px;
    border-radius:0;gap:4px;scrollbar-width:none}
  #tools::-webkit-scrollbar{display:none}
  #tools > *{flex:0 0 auto}

  /* панель свойств раньше растягивалась почти на весь экран и закрывала
     карту белым — теперь это невысокий лист над панелью инструментов */
  #insp{right:8px;left:8px;top:auto;bottom:64px;transform:none;width:auto;
    max-height:34vh;border-radius:12px;z-index:20}
  #props,#widgets{max-height:26vh}
  #widgets{font-size:13.5px;padding:12px 14px}

  #zIn,#zOut,#zLabel{padding:10px 12px}
}
/* пальцем удобнее целиться по крупным кнопкам */
@media (pointer: coarse){
  .sBtn,.tBtn,#tools > div{min-width:44px;min-height:44px}
}


.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);user-select:none}

/* modes */
#modes{position:fixed;top:14px;left:14px;display:flex;padding:4px;gap:2px;z-index:10}
.modeBtn{padding:8px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;
  color:var(--muted);transition:.14s;white-space:nowrap}
.modeBtn:hover{background:#eef2f8;color:var(--ink)}
.modeBtn.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.35)}

/* top bar */
#scene{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;padding:4px;gap:2px;z-index:10}
.sBtn{width:42px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;transition:.14s;position:relative}
.sBtn:hover{background:#eef2f8}
.sBtn:active{transform:scale(.93)}
.sBtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.sBtn.play svg{fill:#16a34a;stroke:#16a34a}
.sBtn.on{background:var(--accent)}
.sBtn.on svg{stroke:#fff;fill:none}
.sep{width:1px;background:var(--line);margin:6px 3px}
.sBtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:42px;left:50%;transform:translateX(-50%);
  background:#1e2530;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}

/* tools */
#tools{position:fixed;left:14px;top:50%;transform:translateY(-50%);width:46px;padding:5px;
  display:flex;flex-direction:column;gap:2px;z-index:10;max-height:82vh;overflow-y:auto;scrollbar-width:thin}
#tools::-webkit-scrollbar{width:0}
.tool{width:36px;height:36px;display:none;align-items:center;justify-content:center;border-radius:8px;
  cursor:pointer;transition:.12s;flex-shrink:0;position:relative}
.tool:hover{background:#eef2f8}
.tool.on{background:var(--accent);box-shadow:0 2px 8px rgba(59,130,246,.35)}
.tool canvas{position:static;width:24px;height:24px;pointer-events:none}
.tool.on canvas{filter:brightness(0) invert(1)}
.tool[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:44px;top:50%;transform:translateY(-50%);
  background:#1e2530;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:30;pointer-events:none}

/* inspector */
#insp{position:fixed;right:14px;top:50%;transform:translateY(-50%);width:248px;z-index:10;display:none;
  max-height:78vh;overflow:hidden;display:none;flex-direction:column}
#inspHead{display:flex;padding:4px;gap:2px;border-bottom:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{background:#eef2f8;color:var(--ink)}
#props,#widgets{padding:10px 12px;overflow-y:auto;font-size:12.5px}
#objTitle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.4px;
  text-transform:uppercase;color:var(--accent);margin-bottom:9px}
#objTitle span{margin-left:auto;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.pRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
.pRow label{color:#5b6472;font-size:12px}
.pRow input[type=number],.pRow input[type=text]{width:94px;padding:5px 8px;border:1px solid var(--line);
  border-radius:7px;font-size:12px;font-family:inherit;color:var(--ink);background:#fafbfd;outline:none}
.pRow input:focus{border-color:var(--accent);background:#fff}
.pRow input[type=color]{width:44px;height:26px;padding:1px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
.pRow input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.pRow input[type=range]{width:100px;accent-color:var(--accent)}
/* объяснение связей механизмов — свёрнуто, разворачивается по клику */
.pHelp{margin:6px 0 2px}
.pHelpHead{font-size:11.5px;color:var(--accent);cursor:pointer;padding:6px 0;user-select:none}
.pHelpBody{display:none;font-size:11.5px;line-height:1.7;color:#5b6673;
  background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:4px}
.pHelpBody code{background:#e6ebf2;border-radius:4px;padding:1px 5px;font-size:11px}
.grp{margin:13px 0 5px;padding-top:9px;border-top:1px solid var(--line);font-size:10.5px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.zBtns{display:flex;gap:5px;margin-top:5px}
.zBtns div{flex:1;text-align:center;padding:6px 0;border:1px solid var(--line);border-radius:7px;
  font-size:11px;cursor:pointer;background:#fafbfd}
.zBtns div:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
#widgets{color:#5b6472;line-height:1.65}
#widgets code{background:#eef2f8;padding:1px 5px;border-radius:4px;font-size:11px;color:var(--accent-dark)}
#widgets b{color:var(--ink)}

/* bottom-left cluster */

/* zoom */
#zoomBox{position:fixed;right:14px;bottom:14px;display:flex;padding:3px;z-index:11}

/* публикация — в общей панели, чёрная кнопка курсивом */
#bfPublish{margin-left:6px;padding:0 14px;height:36px;border:none;border-radius:9px;
  background:#111827;color:#fff;font-style:italic;font-weight:700;font-size:13.5px;
  letter-spacing:.2px;cursor:pointer;white-space:nowrap;align-self:center;font-family:inherit}
#bfPublish:hover{background:#2b3648}
#bfPublish:active{transform:translateY(1px)}
@media (max-width:900px){ #bfPublish{padding:0 10px;height:34px;font-size:12.5px} }
.zBtn{min-width:32px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:7px;
  cursor:pointer;font-size:15px;color:#5b6472;transition:.12s}
.zBtn:hover{background:#eef2f8;color:var(--ink)}
#zLabel{font-size:12px;font-weight:600;min-width:48px}

/* play */
/* В игре экран чистый: панели инструментов, свойств, режимов, зума,
   подсказка и верхняя строка с сохранением и публикацией скрыты. */
body.play #tools,body.play #insp,body.play #modes,body.play #zoomBox,
body.play #hint,body.play #scene,body.play #bfPublish,
body.play #genBox,body.play #aaPanel{display:none!important}
/* HUD ушёл из-под верхней кромки в правый нижний угол: сверху он
   налезал на панель и заслонял карту. Стал компактнее — иконки вместо
   слов, подписи остались во всплывающих подсказках. */
#hud{display:none;position:fixed;right:14px;bottom:14px;left:auto;top:auto;transform:none;
  z-index:12;padding:6px 7px;align-items:center;gap:4px;border-radius:12px}
body.play #hud{display:flex}
.stat{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;
  background:#f4f6fa;font-size:12px;font-weight:600;white-space:nowrap}
.stat i{font-style:normal;font-size:13px}
#exitBtn{padding:6px 13px;border-radius:8px;background:#fee2e2;color:#dc2626;font-size:12px;
  font-weight:600;cursor:pointer;transition:.14s}
#exitBtn:hover{background:#dc2626;color:#fff}
#msg{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:13;text-align:center;
  display:none;pointer-events:none;opacity:0;transition:.32s cubic-bezier(.2,1.2,.3,1)}
#msg.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}
#msg h1{margin:0;font-size:52px;font-weight:800;letter-spacing:-1.5px;
  background:linear-gradient(180deg,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 10px rgba(245,158,11,.35))}
#msg p{margin:8px 0 0;font-size:13.5px;color:#5b6472;font-weight:500}

#pad{display:none;position:fixed;bottom:0;left:0;right:0;z-index:13;
  padding:0 18px calc(20px + env(safe-area-inset-bottom));justify-content:space-between;pointer-events:none}
body.play.mob #pad{display:flex}
.padG{display:flex;gap:13px;pointer-events:auto}
.pBtn{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:23px;color:#5b6472;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.pBtn:active{background:var(--accent);color:#fff;transform:scale(.93)}
#pJump{width:78px;height:78px;font-size:13px;font-weight:800;letter-spacing:.5px}

/* dialog */
#dlg{position:fixed;inset:0;z-index:200;display:none}
#dlg .bd{position:absolute;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px)}
#dlg .card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);min-width:300px;max-width:430px;
  background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:20px 22px}
#dlg h3{margin:0 0 7px;font-size:15px}
#dlg p{margin:0 0 16px;font-size:13px;color:#5b6472;line-height:1.6}
#dlg .acts{display:flex;gap:8px;justify-content:flex-end}
#dIn{width:100%;box-sizing:border-box;padding:11px 12px;margin:0 0 14px;border:1px solid var(--line);
  border-radius:9px;font-size:16px;font-family:inherit;color:var(--ink);background:#fafbfd;outline:none}
#dIn:focus{border-color:var(--accent);background:#fff}
#dlg button{padding:8px 15px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12.5px;
  font-family:inherit;font-weight:600;cursor:pointer}
#dlg .ok{background:var(--accent);color:#fff;border-color:var(--accent)}
#file{display:none}

/* mobile */
body.mob #modes{top:8px;bottom:auto;left:8px;right:8px;padding:3px}
body.mob .modeBtn{padding:8px 9px;font-size:11px}
body.mob #scene{top:8px;bottom:auto;padding:3px}
body.mob .sBtn{width:38px;height:34px}
body.mob #tools{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-height:none;flex-direction:row;
  border-radius:16px 16px 0 0;max-height:none;height:58px;overflow-x:auto;overflow-y:hidden;padding:6px 8px;gap:4px}
body.mob .tool{width:42px;height:42px}
body.mob .tool canvas{width:26px;height:26px}
body.mob .tool[data-tip]:hover::after{display:none}
body.mob #insp{left:8px;right:8px;width:auto;top:auto;bottom:64px;transform:none;max-height:34vh}
body.mob #props,body.mob #widgets{max-height:26vh}
#inspClose{flex:0 0 34px;color:#dc2626;font-size:14px}
#inspClose:hover{background:#fee2e2}
body.mob #hint{display:none}
body.mob #zoomBox{bottom:68px;right:8px}
body.mob #msg h1{font-size:38px}
</style>

        <script src="lzma.js"></script>
        <script src="bfImport.js"></script>
        <script src="skinRender.js"></script>
        <script src="skinCanvas.js"></script>
        <script src="coin.js"></script>
        <link rel="stylesheet" type="text/css" href="mobile.css">
        <script src="theme.js"></script>
        <link rel="icon" href="/favicon.ico" sizes="32x32">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">

<body>

<div id="modes" class="panel"></div>
<div id="scene" class="panel"></div>
<div id="tools" class="panel"></div>


</div>

<div id="insp" class="panel">
  <div id="inspHead">
    <div class="tab on" data-tab="props">Свойства</div>
    <div class="tab" id="inspClose" title="Закрыть">Закрыть</div>
  </div>
  <div id="props"></div>
  <div id="widgets" style="display:none"></div>
</div>

<div id="zoomBox" class="panel">
  <div class="zBtn" id="zOut">−</div>
  <div class="zBtn" id="zLabel">100%</div>
  <div class="zBtn" id="zIn">+</div>
</div>

<div id="hud" class="panel">
  <div class="stat" title="время забега"><i>⏱</i><span id="sTime">0.0</span></div>
  <div class="stat" title="собрано монет"><i>🪙</i><span id="sCoin">0</span></div>
  <div class="stat" title="объектов в карте (максимум 2000)"><i>▦</i><span id="sObj">0</span></div>
  <div class="stat" title="смертей"><i>✖</i><span id="sDeath">0</span></div>
  <div id="exitBtn" title="выйти из игры (Esc)">Выйти</div>
</div>
<div id="msg"><h1 id="msgT"></h1><p id="msgS"></p></div>

<div id="pad">
  <div class="padG"><div class="pBtn" id="pLeft">◀</div><div class="pBtn" id="pRight">▶</div></div>
  <div class="padG"><div class="pBtn" id="pJump">JUMP</div></div>
</div>

<div id="dlg">
  <div class="bd"></div>
  <div class="card"><h3 id="dT"></h3><p id="dM"></p>
    <input id="dIn" type="text" style="display:none">
    <div class="acts"><button id="dNo">Отмена</button><button class="ok" id="dOk">OK</button></div></div>
</div>

<input type="file" id="file" accept=".txt,.json">
<canvas id="c"></canvas>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════
   ENVIRONMENT
   ══════════════════════════════════════════════════ */
var isMob = function(){
  return matchMedia("(pointer:coarse)").matches || innerWidth <= 860 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
};
function syncMob(){ document.body.classList.toggle("mob", isMob()); }
syncMob(); addEventListener("resize", syncMob); addEventListener("orientationchange", syncMob);

var cv = document.getElementById("c"), ctx = cv.getContext("2d");
var DPR = Math.min(2, devicePixelRatio || 1);
function resize(){
  cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
}
addEventListener("resize", resize);
var VW = function(){ return cv.width / DPR; }, VH = function(){ return cv.height / DPR; };

/* ══════════════════════════════════════════════════
   MODEL DEFINITIONS  — every shape drawn by hand
   ══════════════════════════════════════════════════ */
var C = {
  stone1:"#4b5563", stone2:"#374151", stone3:"#1f2937",
  wood1:"#b45309", wood2:"#92400e",
  poison1:"#4ade80", poison2:"#16a34a", poison3:"#15803d",
  metal1:"#cbd5e1", metal2:"#94a3b8", metal3:"#64748b",
  spring1:"#c084fc", spring2:"#9333ea",
  gate1:"#60a5fa", gate2:"#2563eb",
  gold1:"#fde047", gold2:"#f59e0b",
  red1:"#f87171", red2:"#dc2626",
  water1:"#38bdf8", water2:"#0ea5e9", water3:"#075985", foam:"#e0f2fe",
  ink:"#111827"
};
/* Плоская заливка вместо градиента. Объекты выглядели «масляными»
   из-за переливов и бликов — теперь это просто цвет. */
function grad(x0,y0,x1,y1,a,b){ return a; }
function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else{
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  }
}
var COIN_IMG = new Image();
COIN_IMG.src = "coin.png";

/* the player figure — clean silhouette from the reference art */
var FIG_GAP = 0.049;
var SKIN_IMGS = {};
function skinImage(src){
  if(!src) return null;
  var im = SKIN_IMGS[src];
  if(!im){ im = SKIN_IMGS[src] = new Image(); im.crossOrigin = "anonymous"; im.src = src; }
  return (im.complete && im.naturalWidth) ? im : null;
}

function figure(w,h,col,accent,skin){
  var d = w, top = d + h*FIG_GAP, bodyH = Math.max(0, h - top);
  // скин-картинка от владельца заменяет фигуру целиком
  if(skin && skin.img){
    var pic = skinImage(skin.img);
    if(pic){
      var k = Math.min(w/pic.naturalWidth, h/pic.naturalHeight);
      var pw = pic.naturalWidth*k, ph = pic.naturalHeight*k;
      ctx.drawImage(pic, (w-pw)/2, h-ph, pw, ph);
      return;
    }
    // пока картинка грузится — рисуем обычный силуэт
  }
  // «за спиной» уходит под силуэт
  if(skin && window.BFSkinCanvas) BFSkinCanvas.behind(ctx, w, h, skin);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(w/2, d/2, d/2, 0, 6.2832); ctx.fill();
  if(bodyH > 0){ rr(0, top, w, bodyH, Math.min(w*0.22, bodyH/2)); ctx.fill(); }
  // одежда, лицо и головной убор — поверх
  if(skin && window.BFSkinCanvas) BFSkinCanvas.front(ctx, w, h, skin);
}

/* Each painter draws the object in its own local space (0,0 → w,h). */
var PAINT = {
  /* Три базовые фигуры рисуются одной плоской заливкой: без скруглений,
     градиентов и бликов. Что нарисовано — то и считает хитбокс. */
  rect: function(o){
    ctx.fillStyle = o.fill || C.ink;
    ctx.fillRect(0,0,o.w,o.h);
  },
  circle: function(o){
    ctx.fillStyle = o.fill || C.ink;
    ctx.beginPath(); ctx.ellipse(o.w/2,o.h/2,o.w/2,o.h/2,0,0,6.2832); ctx.fill();
  },
  triangle: function(o){
    ctx.fillStyle = o.fill || C.ink;
    ctx.beginPath(); ctx.moveTo(o.w/2,0); ctx.lineTo(o.w,o.h); ctx.lineTo(0,o.h); ctx.closePath(); ctx.fill();
  },
  text: function(o){
    ctx.fillStyle = o.fill || C.ink;
    ctx.font = "800 " + Math.max(9,o.h) + "px -apple-system,Segoe UI,Roboto,sans-serif";
    ctx.textBaseline = "top";
    ctx.fillText(o.text || "Text", 0, 0);
  },
  spawn: function(o){ figure(o.w,o.h, o.fill || C.ink, true, (window.GAME && window.GAME.mySkin) || null); },
  seeker: function(o){
    figure(o.w,o.h, o.fill || "#b91c1c", true);
    ctx.fillStyle = "#fff";                      // seeker gets eyes so he reads as the hunter

  poison: function(o){

  door: function(o){

  checkpoint: function(o){

  finishline: function(o){

  coin: function(o){

  },
  /* ВОДА — единственный объект с настоящей прозрачностью и глубиной.

     бассейн читается объёмом. Оттенок берётся из заливки: любой цвет,
     выбранный автором, превращается в кислоту, лаву или чернила. */
  water: function(o){
    var fill = (o.fill && o.fill[0] === "#" && o.fill.length === 7) ? o.fill : C.water1;
    var top  = mixHex(fill, "#e0f2fe", 0.42);   // светлая кромка
    var deep = mixHex(fill, "#082f49", 0.55);   // глубина

    body.addColorStop(0.5, hexA(fill, 0.44));
    body.addColorStop(1, hexA(deep, 0.6));

    ctx.moveTo(0, waterTop(o, 0));
    for(i=1;i<=steps;i++){ wx = o.w*i/steps; ctx.lineTo(wx, waterTop(o, wx)); }
    for(i=steps;i>=0;i--){ wx = o.w*i/steps; ctx.lineTo(wx, waterTop(o, wx) + 7); }

    ctx.fillStyle = hexA(top, 0.3); ctx.fill();

    ctx.strokeStyle = "rgba(241,249,255,.7)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, waterTop(o, 0));
    for(i=1;i<=steps;i++){ wx = o.w*i/steps; ctx.lineTo(wx, waterTop(o, wx)); }

    for(var b=0;b<nb;b++){

      var speed = 0.35 + (b%3)*0.16;
      var span = Math.max(6, o.h*0.72);

      var br = 1.1 + (b%3)*0.7;

      ctx.beginPath(); ctx.arc(bx, by, br, 0, 6.2832); ctx.fill();
    }
  }
};
/* — помощники цвета воды —
   hexA превращает «#rrggbb» в «rgba(…, альфа)»: вода полупрозрачна,
   сквозь неё видно фон карты и самого игрока.
   mix мешает два цвета: из любого оттенка, выбранного автором,
   получаются светлая кромка и глубина — палитра воды строится сама. */
function hexA(hex, a){
  if(!hex || hex[0] !== "#" || hex.length !== 7) hex = C.water1;
  var n = parseInt(hex.slice(1),16);
  return "rgba(" + (n>>16&255) + "," + (n>>8&255) + "," + (n&255) + "," + a + ")";
}
function mixHex(a, b, t){
  if(!a || a[0] !== "#" || a.length !== 7) a = C.water1;
  if(!b || b[0] !== "#" || b.length !== 7) b = C.water3;
  var na = parseInt(a.slice(1),16), nb = parseInt(b.slice(1),16);
  var ch = sh => Math.round((na>>sh&255)*(1-t) + (nb>>sh&255)*t);
  return "#" + (1<<24 | ch(16)<<16 | ch(8)<<8 | ch(0)).toString(16).slice(1);
}
/* Высота волны в локальной точке x (0…w) объекта-воды. Две синусоиды
   качают поверхность сами по себе, а пружинный слой добавляет живые
   волны: любое падение бьёт по колонкам поверхности, волна расходится
   в стороны и затухает. Функция одна и для тела воды, и для верхнего
   прохода — кромка и заливка всегда совпадают, швов нет. */
function waterTop(o, x){
  var w = Math.sin(x*0.05 + anim*0.052)*2.3 + Math.sin(x*0.017 - anim*0.03)*1.5;
  var sy = o._sy;                                   // пружинный слой
  if(sy && sy.length){
    var n = sy.length, f = x/o.w*(n-1);
    var i = Math.max(0, Math.min(n-1, Math.floor(f)));
    var t = Math.max(0, Math.min(1, f - i)), i2 = Math.min(n-1, i+1);
    w += sy[i]*(1-t) + sy[i2]*t;
  }
  return w;
}
/* ── ПРУЖИННАЯ ПОВЕРХНОСТЬ ──
   Верх воды — цепочка колонок на пружинах: колонка тянется к покою,
   соседям передаёт разницу высот, вязкость гасит колебания.
   Состояние живёт в полях с подчёркиванием (_sy/_sv), поэтому в
   сохранение карты и в undo оно не попадает — только физика. */
var WTR_COL = 9;          // ширина колонки поверхности, px
function wcols(o){ return Math.max(2, Math.min(220, Math.round(o.w/WTR_COL))); }
function wsurf(o){
  var n = wcols(o);
  if(!o._sy || o._sy.length !== n){
    o._sy = []; o._sv = [];
    for(var i=0;i<n;i++){ o._sy.push(0); o._sv.push(0); }
  }
  return o._sy;
}
/* Удар по воде: x — точка в координатах карты, v — сила, r — радиус
   в колонках. Игрок, капля и брызги будят одну и ту же воду. */
function disturb(o, x, v, r){
  if(!o || o.type !== "water") return;
  wsurf(o);
  var n = o._sy.length, cx = (x - o.x)/o.w*(n-1), rad = Math.max(1, r || 3);
  for(var i=0;i<n;i++){
    var d = Math.abs(i - cx);
    if(d < rad) o._sv[i] += v*(1 - d/rad);
  }
}
function stepSurf(o){
  var sy = wsurf(o), sv = o._sv, n = sy.length;
  var amp = Math.min(16, Math.max(3, o.h*0.5));   // у лужи волна меньше
  var K = 0.02, D = 0.972, S = 0.05;              // упругость, вязкость, растекание
  for(var i=0;i<n;i++){
    sv[i] += -K*sy[i]; sv[i] *= D;
    sy[i] += sv[i];
    if(sy[i] > amp) { sy[i] = amp;  sv[i] *= -0.3; }
    if(sy[i] < -amp){ sy[i] = -amp; sv[i] *= -0.3; }
  }
  for(var p=0;p<2;p++){
    for(i=0;i<n;i++){
      var l;
      if(i>0){ l = S*(sy[i]-sy[i-1]); sv[i-1] += l; sv[i] -= l; }
      if(i<n-1){ l = S*(sy[i]-sy[i+1]); sv[i+1] += l; sv[i] -= l; }
    }
  }
}
function stepAllSurfs(){
  for(var i=0;i<objects.length;i++)
    if(objects[i].type === "water") stepSurf(objects[i]);
}
/* ── ТЕЧЕНИЕ ОСЕВШЕЙ ВОДЫ ──
   Налитая вода больше не застывает кубом. Лужа-прямоугольник каждый
   тик (раз в два кадра) проверяет опору под дном и делает одно из:
   1) ПАДАЕТ — опоры нет вовсе; кусок, висящий над краем платформы,
      откалывается и падает сам, так вода стекает с уступов и через
      дыры в полу.
   2) РАСТЕКАЕТСЯ по твёрдому полу: лишняя высота уходит в ширину,
      пока лужа не станет тонкой плёнкой. Площадь сохраняется, поэтому
      «куб» на глазах превращается в широкую лужу, а не исчезает.
   3) ВЫРАВНИВАЕТСЯ с соседней лужей того же цвета и кислотности,
      если их днища на одном уровне и они соприкасаются, — сообщающиеся
      сосуды.
   Прямоугольник — родной язык этой воды: волнистая поверхность и пена
   рисуются у любого прямоугольника, так что течение не создаёт новых
   типов объектов и переживает сохранение, загрузку и отмену. */
var WFLOW_MIN = 8;        // толщина самой тонкой лужи, px
function waterSupport(o){
  /* Пробы каждые ~6px и по три точки в ряд (x-3, x, x+3): раньше сетка
     была редкой (шаг 12px), и вода проваливалась в щели — на полу,
     собранном из соседних блоков, проба попадала ровно в стык, опора
     «исчезала», и лужа резалась и утекала СКВОЗЬ цельный пол. */
  var by = o.y + o.h, n = Math.max(3, Math.min(40, Math.round(o.w/6)));
  var list = nearby(o.x - 6, by - 3, o.w + 12, 12), sup = [];
  var prevB = by - (o._wvy || 0);                 // дно в прошлом кадре
  for(var i=0;i<n;i++){
    var x = o.x + 2 + (o.w - 4)*(n > 1 ? i/(n-1) : 0), ok = false;
    for(var d=0; d<3 && !ok; d++){
      var x2 = x + (d-1)*3;
      for(var j=0;j<list.length;j++){
        var s = list[j];
        if(s === o || s._rm || opened(s)) continue;
        if(solid(s)){
          /* точка под дном — обычная опора; точка над дном ловит воду,
             временно вросшую в опору (плюхнула и утонула на полтолщины) */
          if(inside(s, x2, by + 3) || inside(s, x2, by - 3)){ ok = true; break; }
          continue;
        }
        if(s.type !== "water") continue;
        if(x2 < s.x - 1 || x2 > s.x + s.w + 1) continue;
        if((s._wvy || 0) > 2) continue;     // сама летит — держать не может
        var sBot = s.y + s.h;
        /* стоим НА ней: точка под нашим дном строго внутри её тела.
           Боковая соседка на том же уровне не опора — у неё дно выше
           нашей точки, и сцепка «бок о бок» не держит воду в воздухе. */
        if(s.y <= by + 2 && by + 2 <= sBot){ ok = true; break; }
        /* прыжок за тик: на этом же тике пересекли её верхнюю кромку.
           Ловим только покой: быстрые куски догоняли медленные в воздухе,
           сливались с ними и лепили фантомные столбы в пустоте. */
        if(o._wvy > 0 && prevB <= s.y + 2 && by + 2 >= s.y){ ok = true; break; }
      }
    }
    sup.push(ok);
  }
  return sup;
}
/* Точка под дном на опоре? Точная проверка одной колонки — для
   уточнения границы реза и обрывов. Пробы те же, что в coarse-карте
   (x-3, x, x+3): иначе рез «по сэмплам» и рез «уточнением» расходились
   на пару пикселей, и отрезанный кусок цеплялся или падал зря. */
function flowSupportAt(o, x, by){
  var list = nearby(x - 5, by - 2, 10, 10);
  for(var d=0; d<3; d++){
    var x2 = x + (d-1)*3;
    for(var j=0;j<list.length;j++){
      var s = list[j];

    if(!playing && o === sel) continue;           // объект тащат мышью
    ws.push(o);
  }

function shade(hex, amt){
  if(!hex || hex[0] !== "#" || hex.length !== 7) return "#374151";
  var n = parseInt(hex.slice(1),16);

  return "#" + (1<<24 | r<<16 | g<<8 | b).toString(16).slice(1);

  var cy0 = Math.floor(y/CELL), cy1 = Math.floor((y+h)/CELL);
  for(var cx=cx0; cx<=cx1; cx++)
    for(var cy=cy0; cy<=cy1; cy++){
      var list = grid[cx + ":" + cy];
      if(!list) continue;
      for(i=0;i<list.length;i++){
        o = list[i];
        if(seen[o.id]) continue;
        seen[o.id] = 1; out.push(o);
      }
    }
  // платформы и ротаторы меняют клетку каждый кадр, поэтому в сетке им
  // верить нельзя — берём их напрямую, но только те, что реально рядом
  for(i=0;i<movers.length;i++){
    o = movers[i];
    if(seen[o.id]) continue;
    var mb = bbox(o);
    if(mb[2] < x || mb[0] > x+w || mb[3] < y || mb[1] > y+h) continue;
    seen[o.id] = 1; out.push(o);
  }
  return out;
}

function toWorld(sx,sy){ return {x:(sx-view.x)/view.s, y:(sy-view.y)/view.s}; }
function zoomAt(sx,sy,f){
  var b = toWorld(sx,sy);
  /* Границы зума: вверх — до 4000% (предохранитель от бесконечности,
     на которой обрывается матрица холста), вниз — до 20%: дальше карта
     теряется из виду, и работать с ней всё равно невозможно. */
  view.s = Math.min(4000, Math.max(0.2, view.s*f));
  view.x = sx - b.x*view.s; view.y = sy - b.y*view.s;
  document.getElementById("zLabel").textContent = Math.round(view.s*100)+"%";
}

var parts = [];

function puff(x,y,n){

                life:22,max:22,c:"#cbd5e1",r:2+Math.random()*2.6});
}
/* Всплеск при входе в воду: веер брызг вверх от точки входа и рой
   пузырей под водой. Сила удара берётся из скорости падения —
   нырнуть с высоты можно красивее, чем упасть с двух шагов. */
function splash(x, y, v){
  var n = Math.min(16, 6 + Math.round(v*1.1));
  for(var i=0;i<n;i++){
    var a = -1.5708 + (Math.random()-.5)*2.4, s = 1.4 + Math.random()*2.6;
    parts.push({x:x+(Math.random()-.5)*18, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
                life:24,max:24,c:"#bae6fd",r:1.3+Math.random()*2.2});
  }
  for(var b=0;b<7;b++)
    parts.push({x:x+(Math.random()-.5)*22, y:y+5+Math.random()*12,
                vx:(Math.random()-.5)*.7, vy:-.3-Math.random()*.6, f:1,
                life:44,max:44,c:"#7dd3fc",r:1+Math.random()*1.8});
}
function stepParts(){
  for(var i=parts.length-1;i>=0;i--){
    var p = parts[i];
    p.x += p.vx; p.y += p.vy;
    if(p.f){ p.vy -= 0.014; p.vx *= 0.97; }   // пузыри не падают, а всплывают
    else { p.vy += 0.24; p.vx *= 0.98; }
    p.life--;
    if(p.life <= 0) parts.splice(i,1);
  }
}
function drawParts(){
  parts.forEach(function(p){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════
   ЛИТЬЁ ВОДЫ ИЗ КУРСОРА
   Инструмент «Вода» больше не рисует прямоугольник: зажми кнопку —
   и из курсора льётся струя. Капли падают по-настоящему: разгоняются,
   плюхаются о твёрдое, плещутся в уже налитой воде и оседают,
   поднимая её уровень. Осевшая вода собирается в лужи-прямоугольники —
   те самые объекты «Вода», что едут в сохранённой карте.
   Shift+перетаскивание оставлен для ровных бассейнов.
   ══════════════════════════════════════════════════ */
var pour = null;        // активная струя: {x, y, fill, deadly, t}
var pourParts = [];     // капли в полёте
var pourDirty = false;  // сетку объектов перестраиваем один раз за кадр струи

function startPour(x, y){

}
/* Мини-всплеск капли: пара брызг цвета воды. Потолок в 800 частиц —

/* ══════════════════════════════════════════════════
   ЖИДКОСТЬ: ЧАСТИЦЫ, А НЕ КУБЫ
   Раньше осевшие капли превращались в прямоугольные клетки, клетки
   срастались в лужи-прямоугольники, и течение двигало эти плиты —
   любая вода из прямоугольников на экране выглядит кубами.
   Теперь осевшая вода — ЧАСТИЦЫ настоящей жидкости:
   · гравитация и столкновения с любыми твёрдыми объектами карты;
   · давление между частицами (SPH-расслабление плотности): куча сама
     растекается в ровную лужу, уровни в сосуде выравниваются,
     объём не теряется — вода ведёт себя как вода;
   · рендер прежней воды: частицы сплавляются goo-фильтром в единое
     полупрозрачное тело и красятся старым градиентом воды — со
     волнистой поверхностью, пеной и пузырями, как у бассейнов.
   Прямоугольная вода остаётся для авторских бассейнов (Shift+протяжка)
   и старых карт: она живёт своей жизнью (flowStep), а налитая струя
   впитывается в неё и поднимает уровень.
   ══════════════════════════════════════════════════ */
var liq = [];               // частицы: {x,y,vx,vy,px,py,fill,deadly,dead}
var LIQ_MAX = 2400;         // предохранитель производительности
var LIQ_R = 2.6;            // радиус частицы
var LIQ_H = 10;             // радиус взаимодействия
var LIQ_RHO = 2.6;          // покойная плотность (вес соседей)
var LIQ_K = 0.055;          // жёсткость давления
var LIQ_KN = 0.16;          // жёсткость ближнего давления (не слипаться)
var LIQ_CELL = 12;          // клетка пространственного хэша
var liqHash = {}, liqHashFresh = false, liqCapped = false;
var liqTmp = [];            // общий буфер запросов — без GC-мусора
function liqSpawn(x, y, vx, vy, fill, deadly){
  if(liq.length >= LIQ_MAX){
    liq.shift();              // старейшая частица уходит: лужа не растёт дальше
    if(!liqCapped && typeof showMsg === "function"){
      liqCapped = true;
      showMsg("Очень много воды",
              "Жидкость достигла предела — новые капли вытесняют самые старые.");
      setTimeout(hideMsg, 2200);
    }
  }
  liq.push({x:x, y:y, vx:vx||0, vy:vy||0, px:x, py:y,
            fill:fill||"", deadly:!!deadly, dead:false});
}
function liqSer(){
  var out = [];
  for(var i=0;i<liq.length;i++){
    var p = liq[i];
    out.push([Math.round(p.x*10)/10, Math.round(p.y*10)/10, p.fill||"", p.deadly?1:0]);
  }
  return out;
}
function liqDe(arr){
  liq.length = 0; liqHashFresh = false;
  if(!arr || !arr.length) return;
  for(var i=0;i<arr.length && i<LIQ_MAX;i++){
    var a = arr[i];
    if(!a || a.length < 4) continue;
    liq.push({x:+a[0]||0, y:+a[1]||0, vx:0, vy:0, px:+a[0]||0, py:+a[1]||0,
              fill:a[2]||"", deadly:!!a[3], dead:false});
  }
}
/* Точка внутри твёрдого объекта? Лёгкий точечный запрос по клетке
   индекса: частиц тысячи, и общий nearby() с посадочными словарями на
   каждый вызов рождал бы горы мусора. */
function liqSolidAt(x, y){
  if(gridDirty) buildGrid();
  var list = grid[Math.floor(x/CELL) + ":" + Math.floor(y/CELL)];
  if(list) for(var j=0;j<list.length;j++){
    var o = list[j];
    if(solid(o) && inside(o, x, y)) return o;
  }
  for(var m=0;m<movers.length;m++){          // платформы врут в сетке
    var mo = movers[m];
    if(!solid(mo)) continue;
    var bb = bbox(mo);
    if(x < bb[0] || x > bb[2] || y < bb[1] || y > bb[3]) continue;
    if(inside(mo, x, y)) return mo;
  }
  return null;
}
/* Бассейн-прямоугольник под точкой (только осевший, не летящий). */
function liqPoolAt(x, y){
  if(gridDirty) buildGrid();
  var list = grid[Math.floor(x/CELL) + ":" + Math.floor(y/CELL)];
  if(list) for(var j=0;j<list.length;j++){
    var o = list[j];
    if(o.type !== "water" || opened(o) || o._wvy) continue;
    var bb = bbox(o);
    if(x < bb[0] || x > bb[2] || y > bb[3]) continue;
    if(y > o.y + waterTop(o, x - o.x)) return o;
  }
  return null;
}
function liqHashBuild(){
  liqHash = {};
  for(var i=0;i<liq.length;i++){
    var p = liq[i];
    var k = Math.floor(p.x/LIQ_CELL) + ":" + Math.floor(p.y/LIQ_CELL);
    (liqHash[k] || (liqHash[k] = [])).push(p);
  }
  liqHashFresh = true;
}
/* Соседи в прямоугольнике. Частица лежит ровно в одной клетке, поэтому
   дедупликация не нужна. */
function liqNear(x, y, w, h, out){
  out.length = 0;
  if(!liqHashFresh) liqHashBuild();
  var cx0 = Math.floor(x/LIQ_CELL), cx1 = Math.floor((x+w)/LIQ_CELL);
  var cy0 = Math.floor(y/LIQ_CELL), cy1 = Math.floor((y+h)/LIQ_CELL);
  for(var cx=cx0;cx<=cx1;cx++) for(var cy=cy0;cy<=cy1;cy++){
    var b = liqHash[cx + ":" + cy];
    if(b) for(var j=0;j<b.length;j++) out.push(b[j]);
  }
  return out;
}
/* Подшаговое перемещение частицы: капля не прошивает тонкие блоки. */
function liqMove(p){
  var sp = Math.max(Math.abs(p.vx), Math.abs(p.vy));
  var steps = Math.max(1, Math.ceil(sp/5));
  var sx = p.vx/steps, sy = p.vy/steps;
  for(var t=0;t<steps;t++){
    var ny = p.y + sy;
    if(sy > 0){
      var hit = liqSolidAt(p.x, ny);
      if(hit){
        var spY = spanY(polyOf(hit), p.x-1, p.x+1);
        p.y = (spY ? spY[0] : ny) - LIQ_R;
        p.vy = 0;
        sy = 0;
      } else p.y = ny;
    } else if(sy < 0){
      if(liqSolidAt(p.x, ny)){ p.vy = 0; sy = 0; }   // потолок — просто стоп
      else p.y = ny;
    }
    var nx = p.x + sx;
    if(sx && liqSolidAt(nx, p.y)){ p.vx = -p.vx*0.3; sx = 0; }
    else p.x = nx;
  }
}
/* Один тик жидкости: гравитация, давление соседей, выталкивание из
   блоков, впитывание авторскими бассейнами. Скорость выводится из
   фактического смещения за тик — растекание честно несёт импульс. */
function liqStep(){
  var n = liq.length;
  if(!n) return;
  var i, j, p, s;
  for(i=0;i<n;i++){
    p = liq[i];
    p.vy += 0.26;
    if(p.vy > 16) p.vy = 16;
    if(p.vx > 16) p.vx = 16; else if(p.vx < -16) p.vx = -16;
    p.px = p.x; p.py = p.y;
    liqMove(p);
  }
  liqHashBuild();
  var H2 = LIQ_H*LIQ_H;
  for(i=0;i<n;i++){
    p = liq[i];
    /* проход 1: плотность вокруг частицы */
    var rho = 0, rhoN = 0;
    liqNear(p.x - LIQ_H, p.y - LIQ_H, LIQ_H*2, LIQ_H*2, liqTmp);
    for(j=0;j<liqTmp.length;j++){
      s = liqTmp[j];
      if(s === p) continue;
      var dx = s.x - p.x, dy = s.y - p.y, d2 = dx*dx + dy*dy;
      if(d2 >= H2 || d2 < 0.0001) continue;
      var q1 = 1 - Math.sqrt(d2)/LIQ_H;
      rho += q1*q1; rhoN += q1*q1*q1;
    }
    var P = LIQ_K*(rho - LIQ_RHO), Pn = LIQ_KN*rhoN;
    if(P <= 0 && Pn <= 0) continue;          // разрежено — давление не толкает
    /* проход 2: расталкивание по давлению */
    liqNear(p.x - LIQ_H, p.y - LIQ_H, LIQ_H*2, LIQ_H*2, liqTmp);
    for(j=0;j<liqTmp.length;j++){
      s = liqTmp[j];
      if(s === p) continue;
      dx = s.x - p.x; dy = s.y - p.y;
      var d = Math.sqrt(dx*dx + dy*dy);
      if(d >= LIQ_H || d < 0.01) continue;
      var q2 = 1 - d/LIQ_H;
      var D = (P*q2 + Pn*q2*q2)*0.5;
      if(D < 0.005 && D > -0.005) continue;
      var ux = dx/d, uy = dy/d;
      if(D > 2.5) D = 2.5;
      s.x += ux*D; s.y += uy*D;
      p.x -= ux*D; p.y -= uy*D;
    }
  }
  var killed = false;
  for(i=0;i<n;i++){
    p = liq[i];
    /* давление могло вдавить частицу в блок — выталкиваем на поверхность */
    var stuck = liqSolidAt(p.x, p.y);
    if(stuck){
      var sp2 = spanY(polyOf(stuck), p.x-1, p.x+1);
      if(sp2 && p.y > sp2[0] - LIQ_R - 2 && p.y < sp2[0] + 14) p.y = sp2[0] - LIQ_R;
      else { p.x = p.px; p.y = p.py; }
    }
    p.vx = p.x - p.px; p.vy = p.y - p.py;
    /* стоит на твёрдом — трение и покой; в полёте — вязкий воздух */
    if(liqSolidAt(p.x, p.y + LIQ_R + 0.5)){
      p.vx *= 0.86;

  ctx.globalAlpha = alpha;
  for(var i=0;i<liqGroupsVis.length;i++)
    ctx.drawImage(liqGroupsVis[i]._cv, 0, 0);
  ctx.restore();
}
/* Та же волна поверхности, что у прямоугольной воды: оба вида воды
   качаются в такт, кромки выглядят одинаково. */
function liqWob(x){
  return Math.sin(x*0.05 + anim*0.052)*2.3 + Math.sin(x*0.017 - anim*0.03)*1.5;
}

/* Слияние соседних луж одного цвета: налитые рядом капли собираются
   в один объект, чтобы карта не забивалась мелкими клетками.
   Пары ищутся по бакетам 260px: лужи ближе 10px всегда попадают в
   общую клетку, а дальние даже не сравниваются — раньше каждый вызов
   крутил полный перебор всех пар, и на карте с сотнями луж он
   подвешивал игру на секунды. */
function mergeWater(){
  var guard = 0, changed = true, mergedAny = false;
  while(changed && guard++ < 60){
    changed = false;
    var ws = [];
    for(var i=0;i<objects.length;i++){
      var wo = objects[i];
      /* падающие куски не сливаем: объединение с лужей растянуло бы
         прямоугольник вниз за куском — водяные столбы из ничего */
      if(wo.type === "water" && !opened(wo) && !wo._wvy) ws.push(wo);
    }
    var dead = [];
    for(i=0;i<ws.length;i++) dead.push(false);
    /* bbox каждой лужи, растянутый на 11px (чуть дальше дистанции
       слияния), попадает в клетки — в одной клетке только соседи. */
    var buckets = {};
    var cx, cy;
    for(i=0;i<ws.length;i++){
      var wb = bbox(ws[i]);
      for(cx=Math.floor((wb[0]-11)/CELL); cx<=Math.floor((wb[2]+11)/CELL); cx++)
        for(cy=Math.floor((wb[1]-11)/CELL); cy<=Math.floor((wb[3]+11)/CELL); cy++){
          var key = cx + ":" + cy;
          (buckets[key] || (buckets[key] = [])).push(i);
        }
    }
    outer:
    for(i=0;i<ws.length;i++){
      if(dead[i]) continue;
      var a = ws[i], ab = bbox(a);
      for(cx=Math.floor((ab[0]-11)/CELL); cx<=Math.floor((ab[2]+11)/CELL); cx++)
        for(cy=Math.floor((ab[1]-11)/CELL); cy<=Math.floor((ab[3]+11)/CELL); cy++){
          var list = buckets[cx + ":" + cy];
          if(!list) continue;
          for(var j=0;j<list.length;j++){
            var ji = list[j];
            if(ji <= i || dead[ji]) continue;
            var b = ws[ji];
            if((a.fill||"") !== (b.fill||"") || !!a.deadly !== !!b.deadly) continue;
            var bb = bbox(b);
            var dx = Math.max(ab[0] - bb[2], 0, bb[0] - ab[2]);
            var dy = Math.max(ab[1] - bb[3], 0, bb[1] - ab[3]);
            if(Math.max(dx, dy) > 10) continue;
            var nx1 = Math.min(a.x, b.x), ny1 = Math.min(a.y, b.y);
            var nx2 = Math.max(a.x+a.w, b.x+b.w), ny2 = Math.max(a.y+a.h, b.y+b.h);
            var added = (nx2-nx1)*(ny2-ny1) - a.w*a.h - b.w*b.h;
            if(added > (a.w*a.h + b.w*b.h)*0.5 + 320) continue;   // не делаем «мыло»
            a.x = nx1; a.y = ny1; a.w = nx2-nx1; a.h = ny2-ny1;
            a._sy = null; a._sv = null;
            b._rm = true;                // съедена: течение её больше не тронет
            objects = objects.filter(function(q){ return q !== b; });
            if(sel === b) sel = a;
            dead[ji] = true;
            changed = true; mergedAny = true;
            break outer;
          }
        }
    }
  }
  if(mergedAny) markDirty();          // одна перестройка на всю сессию слияний
}
/* Один кадр струи: рождаем капли и считаем их физику. */
function stepPour(){
  if(pour){
    pour.t++;
    if(pourParts.length < 300){
      for(var e=0;e<2;e++)
        pourParts.push({
          x: pour.x + (Math.random()-.5)*7, y: pour.y + (Math.random()-.5)*3,
          vx: (Math.random()-.5)*1.1, vy: 2.1 + Math.random()*1.5,
          r: 1.7 + Math.random()*1.5, life: 500,
          fill: pour.fill, deadly: pour.deadly, above: true
        });
    }
    if(pour.t % 24 === 0) mergeWater();          // лужи срастаются на глазах
  }
  for(var i=pourParts.length-1;i>=0;i--){
    var p = pourParts[i];
    p.life--;
    var kill = p.life <= 0;
    // горизонталь: капля может стукнуться о стенку
    var nx = p.x + p.vx;
    if(dropHit(nx, p.y)){ p.vx = -p.vx*0.35; nx = p.x; }
    p.x = nx;
    // вертикаль: гравитация, сопротивление воздуха и предельная скорость —
    // без потолка капля, упавшая в колодец, разгоняется бесконечно
    p.vy += 0.26; p.vx *= 0.995;
    if(p.vy > 16) p.vy = 16;
    if(p.y > 5000){ pourParts.splice(i,1); continue; }   // за нижней границей карты — смерть, как у игрока
    var ny = p.y + p.vy;
    /* подшаги не длиннее 5px: быстрая капля не проскакивает ни тонкий
       блок, ни тонкую лужу. Раньше путь проверялся одной точкой на конце
       — капля на полной скорости прошивала плиты насквозь и вылетала
       СНИЗУ объектов, хотя они не декорация, а твёрдые. */
    var steps = Math.max(1, Math.ceil(Math.abs(ny - p.y)/5));
    var pool = null, hitO = null, cy = ny, inPile = false;
    for(var st=1; st<=steps; st++){
      cy = p.y + (ny - p.y)*st/steps;
      pool = poolAt(p.x, cy);
      if(pool) break;
      hitO = dropHit(p.x, cy);
      if(hitO) break;
      /* куча жидкости встречает каплю как вода: капля сливается с ней
         на лету, а не пробивает её до самого пола */
      if(liq.length && liqNear(p.x - 4, cy - 3, 8, 10, liqTmp).length >= 2){ inPile = true; break; }
    }
    if(pool){
      p.y = cy;
      if(p.above){                               // вошла сверху — плеск
        disturb(pool, p.x, Math.min(2.2, p.vy*0.5), 2.5);
        if(p.vy > 3) dropSplash(p.x, pool.y + waterTop(pool, p.x-pool.x), pool.fill, 1.2);
        /* капля принесла объём: лужа сразу чуть полнеет. Без этого
           быстрая капля прошивала тонкую лужу насквозь и гасла в ней
           без следа — налитое исчезало, а не росло. */
        if(pool.h < POUR_MAX_H && (!pour || pool.y >= pour.y - 2)){
          pool.y -= 0.3; pool.h += 0.3; pourDirty = true;
        }
        p.above = false;
      }
      p.vy *= 0.8; p.vx *= 0.92; p.vy += 0.03;   // вязкость + чуть плавучести
      if(p.vy < 1 && Math.abs(p.vx) < 0.8){
        /* капля растворилась: своя вода поднимается, пока струя льётся
           выше, а чужая (другой цвет или кислота) просто исчезает —
           смешивать кислоту с питьевой водой нельзя */
        var compat = (pool.fill||"") === (p.fill||"") && !!pool.deadly === !!p.deadly;
        if(compat && pool.h < POUR_MAX_H && (!pour || pool.y >= pour.y - 2)){
          pool.y -= 0.5; pool.h += 0.5; pourDirty = true;
        }
        disturb(pool, p.x, 0.5, 2);
        kill = true;
      }
      if(kill) pourParts.splice(i,1);
      continue;
    }
    if(hitO){
      var sp = spanY(polyOf(hitO), p.x-1, p.x+1);
      var topY = sp ? sp[0] : cy - p.vy;
      if(p.vy > 2.6){                            // сильный удар — отскок и брызги
        dropSplash(p.x, topY, p.fill, Math.min(2.4, p.vy*0.4));
        p.vy = -p.vy*0.26; p.vx = p.vx*0.8 + (Math.random()-.5)*0.6;
        p.y = topY - p.r;
        if(Math.abs(p.vy) < 1.1){
          /* капля стала частицей жидкости: дальше она живёт давлением
             соседей и растекается, как настоящая вода */
          liqSpawn(p.x, topY - LIQ_R, p.vx*0.4, 0, p.fill, p.deadly);
          kill = true;
        }
      } else {                                   // тихо легла — оседает
        liqSpawn(p.x, topY - LIQ_R, p.vx*0.4, 0, p.fill, p.deadly);
        kill = true;
      }
    } else if(inPile){
      liqSpawn(p.x, cy, p.vx*0.6, Math.min(p.vy, 3)*0.5, p.fill, p.deadly);
      dropSplash(p.x, cy, p.fill, 0.9);
      kill = true;
    } else {
      p.y = ny;
      p.above = true;
    }
    if(kill) pourParts.splice(i,1);
  }
  /* Один раз за кадр струи, а не на каждую каплю: раньше каждая осевшая
     капля помечала сетку «грязной», и кадр делал до восьми полных
     перестроек индекса — на большой карте это фриз. */
  if(pourDirty){ pourDirty = false; markDirty(); }
}
/* Рисуем струю: только «носик» на курсоре. Сами капли и струя
   рисуются в общем жидком теле (drawLiquid) вытянутыми эллипсами в
   общем контуре — вода течёт потоком, а не горошинами. */
function drawPour(){
  if(!pour) return;
  ctx.fillStyle = hexA(pour.fill, 0.8);
  ctx.beginPath();
  ctx.arc(pour.x, pour.y, 3 + Math.sin(anim*0.35)*0.6, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = hexA(pour.fill, 0.35);
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(pour.x, pour.y, 7.5, 0, 6.2832); ctx.stroke();
}

/* ══════════════════════════════════════════════════
   PHYSICS  — гравитация постоянная (9), как в оригинальном редакторе
   ══════════════════════════════════════════════════ */
/* FRIC = 0 — на земле игрок останавливается сразу, без скольжения.
   В воздухе инерция остаётся, иначе управление в прыжке ломается. */
var JUMP_H = 122, MOVE_A = 0.9, MAX_VX = 5.2, FRIC = 0, AIR = 0.94,
    COYOTE = 6, BUFFER = 7, WALL_SLIDE = 2.6, WALL_VX = 6.2, STEP_UP = 16;
/* ═══ ФИЗИКА ВОДЫ ═══
   Вода — среда, а не блок: в ней своя гравитация, вязкость и плавание.
   Все константы — доли от обычных величин, поэтому вода одинаково
   работает при любой гравитации карты. Плавание считает геометрия
   прямоугольника, а пружинная поверхность добавляет живые волны,
   которые расходятся от каждого прыжка и плескания. */
var WTR_GRAV  = 0.30;    // доля гравитации: медленное погружение
var WTR_VYDRAG = 0.955;  // сопротивление вертикальному движению
var WTR_VXDRAG = 0.93;   // вода тормозит по горизонтали
var WTR_ACC   = 0.6;     // доля разгона в воде
var WTR_MAXVX = 0.62;    // доля максимальной скорости
var WTR_FALL  = 0.3;     // доля предельной скорости падения
var WTR_SWIM  = 1.7;     // подъёмная тяга от удержания прыжка, долей гравитации
var WTR_UPMAX = 4.3;     // предел скорости всплытия
var WTR_OUT   = 26;      // с какой глубины от поверхности можно выпрыгнуть
var WTR_KICK  = 0.92;    // сила прыжка из воды, долей обычного прыжка
function G(){ return gravityScale * 0.062; }          // 9 → 0.558 px/кадр²
function jumpV(){ return -Math.sqrt(2 * Math.max(0.02, G()) * JUMP_H); }  // constant hop height
/* Heavier gravity shortens airtime, so speed scales with it — otherwise a map
   built at gravity 10 becomes physically unjumpable at 30. Reach stays constant. */
function gk(){ return Math.max(0.45, Math.sqrt(Math.max(0.02, G()) / 0.62)); }
function maxVX(){ return MAX_VX * gk(); }
function moveA(){ return MOVE_A * gk(); }
function wallVX(){ return WALL_VX * gk(); }
function maxFall(){ return 12 + gravityScale * 0.8; }

var pl = {x:0,y:0,w:20,h:60,vx:0,vy:0,ground:false,wall:0,dead:false,face:1,selfJump:false,hidden:false,
};
var keys = {l:false,r:false,u:false};
var coy = 0, buf = 0, spawnPt = {x:0,y:0}, done = false, finishTimer = 0;
var deaths = 0, coins = 0, coinsTotal = 0, timeMs = 0, shake = 0, acc = 0, last = 0;

/* Где игрок относительно воды: верхняя кромка, под водой ли голова
   и не кислота ли это. Считается по тем же объектам, что и коллизии. */
function findSpawn(){ for(var i=0;i<objects.length;i++) if(objects[i].type === "spawn") return objects[i]; return null; }
/* Старт вплотную к финишу — не карта, а кнопка: шаг вправо и уровень
   пройден. Держим их на расстоянии, иначе так накручивают прохождения. */
var SPAWN_GAP = 320;
function spawnTooClose(){
  var sp = findSpawn();
  if(!sp) return null;
  for(var i=0;i<objects.length;i++){
    var o = objects[i];
    if(o.type !== "finishline") continue;
    var dx = (o.x + o.w/2) - (sp.x + sp.w/2);
    var dy = (o.y + o.h/2) - (sp.y + sp.h/2);
    var d = Math.sqrt(dx*dx + dy*dy);
    if(d < SPAWN_GAP) return Math.round(d);
  }
  return null;
}

function play(){
  var sp = findSpawn();
  if(!sp){ dialog("Нет точки старта","Поставь инструмент «Точка старта», потом жми ▶.",null); return; }
  var near = spawnTooClose();
  if(near !== null){
    dialog("Старт слишком близко к финишу",
           "Между ними " + near + " точек, нужно хотя бы " + SPAWN_GAP +
           ". Отодвинь старт или финиш.", null);
    return;
  }
  playing = true; done = false; deaths = 0; coins = 0; timeMs = 0; parts.length = 0;
  pour = null; pourParts.length = 0;
  indexMovers(); markDirty();
  // размер игрока задан движком и не редактируется
  pl.w = SIZES.spawn[0]; pl.h = SIZES.spawn[1];
  spawnPt = {x:sp.x, y:sp.y};
  coinsTotal = objects.filter(function(o){ return o.type === "coin"; }).length;
  objects.forEach(function(o){
    o._hx = o.x; o._hy = o.y; o._t = 0; o._act = !!o.startsOpen;
    o._got = false; o._reached = false; o._spin = 0; o._squash = 0;
  });
  respawn();
  document.body.classList.add("play");
  sel = null; inspect(); hideMsg(); last = 0; acc = 0; stat();
}
function stop(){
  playing = false; document.body.classList.remove("play"); hideMsg(); parts.length = 0;
  pour = null; pourParts.length = 0;
  objects.forEach(function(o){ if(o._hx !== undefined){ o.x = o._hx; o.y = o._hy; }
    o._act = false; o._reached = false; o._spin = 0; o._got = false; });
  resetView();
}
/* Перезапуск забега без перезагрузки страницы: монеты, время, смерти
   и все собранные предметы возвращаются на место, карта не трогается.
   Раньше это было размазано по обработчику клавиши R, поэтому после
   финиша пройти карту заново можно было только с клавиатуры. */
function restartRun(){
  done = false; hideMsg();
  coins = 0; timeMs = 0; deaths = 0;
  objects.forEach(function(o){
    o._got = false; o._reached = false;
    o._act = !!o.startsOpen; o._latch = false;
  });
  var sp = findSpawn();
  if(sp) spawnPt = {x:sp.x, y:sp.y};
  stat(); respawn();
}

function respawn(){
  pl.x = spawnPt.x; pl.y = spawnPt.y; pl.vx = 0; pl.vy = 0; pl.dead = false; coy = 0; buf = 0;
  pl._wasWater = false; pl._kick = false; pl._under = false;
}
function die(){
  if(pl.dead || done) return;
  pl.dead = true; deaths++; shake = 13; stat();
  burst(pl.x+pl.w/2, pl.y+pl.h/2, 22, "#ef4444", 4.4, 34);
  setTimeout(function(){ if(playing) respawn(); }, 300);
}
function stat(){
  document.getElementById("sDeath").textContent = deaths;
  document.getElementById("sCoin").textContent = coins + "/" + coinsTotal;
  var so = document.getElementById("sObj");
  if(so) so.textContent = objects.length + "/" + OBJ_LIMIT;
}
function showMsg(t,s){
  document.getElementById("msgT").textContent = t;
  document.getElementById("msgS").textContent = s;
  var m = document.getElementById("msg"); m.style.display = "block";
  requestAnimationFrame(function(){ m.classList.add("show"); });
}
function hideMsg(){ var m = document.getElementById("msg"); m.classList.remove("show"); m.style.display = "none"; }

/* «Открыт» — объект, который включила кнопка или рычаг: он становится
   полупрозрачным и проходимым. Сами кнопка и рычаг так не исчезают. */
var opened = function(o){ return o.type !== "button" && o.type !== "lever" && !!o._act; };

/* Все ли игроки уже в двери. В одиночном прогоне редактора игрок один,
   поэтому условие выполняется сразу. В сетевой игре список приходит
   из game.js через GAME.others. */
function allAtDoor(o){
  var others = (window.GAME && window.GAME.others) ? window.GAME.others() : null;
  if(!others || !others.length) return true;
  for(var i = 0; i < others.length; i++){
    var p = others[i];
    if(!p || p.gone) continue;
    if(!overlaps(o, p.x, p.y, p.w || 22, p.h || 74)) return false;
  }
  return true;
}
/* Укрытие для пряток игрок проходит насквозь — иначе за него не спрятаться. */
var solid  = function(o){ return SOLID.indexOf(o.type) !== -1 && !opened(o)
                              && o.ghost !== true && o.hideSpot !== true; };
var hazard = function(o){ return o.deadly === true && !opened(o); };
function hit(ax,ay,aw,ah,bx,by,bw,bh){ return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by; }

/* ══════════════════════════════════════════════════
   ХИТБОКСЫ
   Раньше столкновения считались по прямоугольнику вокруг объекта,
   поэтому круг ловил игрока за углы, треугольник был стеной, а ротатор
   вращался только на картинке. Теперь у каждого объекта настоящий
   многоугольник, который поворачивается вместе с ним.
   ══════════════════════════════════════════════════ */
var CIRCLE_SIDES = 32;   // чем больше сторон, тем точнее хитбокс круга
/* Рикошет — полное отражение импульса от той грани, в которую попал игрок.
   Коэффициент чуть меньше единицы, иначе отскок копится до бесконечности. */
var RICO_K = 0.96, RICO_MIN = 2.2, RICO_CAP = 26;

/* Отскок считается от настоящей грани объекта, а не от осей экрана.
   Ищем ближайшее ребро многоугольника и берём его наружную нормаль —
   поэтому от лежащего батута отбрасывает вверх, от стоящего вбок,
   а от повёрнутого под тем углом, под каким он стоит. */
function faceNormal(o, px, py){
  var pts = polyOf(o), n = pts.length;
  var best = 1e9, nx = 0, ny = -1, i;
  for(i=0;i<n;i++){
    var a = pts[i], b = pts[(i+1)%n];
    var ex = b[0]-a[0], ey = b[1]-a[1];
    var len2 = ex*ex + ey*ey;
    if(len2 < 0.0001) continue;
    // ближайшая точка ребра к центру игрока
    var t = ((px-a[0])*ex + (py-a[1])*ey) / len2;
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    var qx = a[0] + ex*t, qy = a[1] + ey*t;
    var d = (px-qx)*(px-qx) + (py-qy)*(py-qy);
    if(d >= best) continue;
    best = d;
    // нормаль к ребру, развёрнутая наружу — в сторону игрока
    var len = Math.sqrt(len2);
    var cx = -ey/len, cy = ex/len;
    if((px-qx)*cx + (py-qy)*cy < 0){ cx = -cx; cy = -cy; }
    nx = cx; ny = cy;
  }
  return [nx, ny];
}

/* Отражение импульса от грани. Сила берётся из свойства объекта:
   1 — как пришёл, больше — подбрасывает сильнее. */
function ricochet(o){
  var px = pl.x + pl.w/2, py = pl.y + pl.h/2;
  var nv = faceNormal(o, px, py);
  var vx = pl.vx, vy = pl.vy;
  var dot = vx*nv[0] + vy*nv[1];
  if(dot > 0) dot = 0;                       // уже летим прочь — не разгоняем
  var k = RICO_K * (o.power === undefined ? 1 : o.power);
  var rx = (vx - 2*dot*nv[0]) * k;
  var ry = (vy - 2*dot*nv[1]) * k;
  var sp = Math.sqrt(rx*rx + ry*ry);
  if(sp > RICO_CAP){ rx = rx/sp*RICO_CAP; ry = ry/sp*RICO_CAP; }
  pl.vx = rx; pl.vy = ry;
  /* coy обнуляем: иначе сразу после отскока остаётся «монетка времени»
     от касания земли и игрок прыгает второй раз прямо в воздухе. */
  pl.ground = false; pl.wall = 0; pl.selfJump = false; coy = 0; buf = 0;
  o._squash = 1;
  puff(px - nv[0]*pl.w*0.5, py - nv[1]*pl.h*0.5, 8);
}

function rawPoly(o){
  var pts, i, a;
  if(o.type === "triangle"){
    pts = [[o.w/2,0],[o.w,o.h],[0,o.h]];
  } else if(o.type === "circle"){
    pts = [];
    for(i=0;i<CIRCLE_SIDES;i++){
      a = i/CIRCLE_SIDES*6.2831853;
      pts.push([o.w/2 + Math.cos(a)*o.w/2, o.h/2 + Math.sin(a)*o.h/2]);
    }
  } else {
    pts = [[0,0],[o.w,0],[o.w,o.h],[0,o.h]];
  }
  return pts;
}

// многоугольник в мировых координатах; пересчитывается только при изменениях
function polyOf(o){
  var ang = (o.spins && playing) ? (o._spin || 0) : (o.rot||0)*Math.PI/180;
  var key = o.x + "," + o.y + "," + o.w + "," + o.h + "," + ang.toFixed(4) + "," + o.type;
  if(o._pk === key) return o._poly;

  var base = rawPoly(o), cx = o.w/2, cy = o.h/2, out = [], i, p, dx, dy;
  var s = Math.sin(ang), c = Math.cos(ang);
  for(i=0;i<base.length;i++){
    p = base[i];
    if(ang){
      dx = p[0]-cx; dy = p[1]-cy;
      out.push([o.x + cx + dx*c - dy*s, o.y + cy + dx*s + dy*c]);
    } else {
      out.push([o.x + p[0], o.y + p[1]]);
    }
  }
  o._pk = key; o._poly = out;
  // габариты для быстрой отбраковки
  var x0=1/0,y0=1/0,x1=-1/0,y1=-1/0;
  for(i=0;i<out.length;i++){
    if(out[i][0]<x0)x0=out[i][0]; if(out[i][0]>x1)x1=out[i][0];
    if(out[i][1]<y0)y0=out[i][1]; if(out[i][1]>y1)y1=out[i][1];
  }
  o._bb = [x0,y0,x1,y1];
  return out;
}
function bbox(o){ polyOf(o); return o._bb; }

// ширина фигуры в горизонтальной полосе [y0,y1] — нужна для движения по X
function spanX(pts, y0, y1){
  var lo=1/0, hi=-1/0, n=pts.length, i, a, b, t, x;
  for(i=0;i<n;i++){
    a = pts[i]; b = pts[(i+1)%n];
    if(a[1] >= y0 && a[1] <= y1){ if(a[0]<lo)lo=a[0]; if(a[0]>hi)hi=a[0]; }
    if((a[1]-y0)*(b[1]-y0) < 0){ t=(y0-a[1])/(b[1]-a[1]); x=a[0]+(b[0]-a[0])*t; if(x<lo)lo=x; if(x>hi)hi=x; }
    if((a[1]-y1)*(b[1]-y1) < 0){ t=(y1-a[1])/(b[1]-a[1]); x=a[0]+(b[0]-a[0])*t; if(x<lo)lo=x; if(x>hi)hi=x; }
  }
  return lo<=hi ? [lo,hi] : null;
}

// высота фигуры в вертикальной полосе [x0,x1] — нужна для движения по Y
function spanY(pts, x0, x1){
  var lo=1/0, hi=-1/0, n=pts.length, i, a, b, t, y;
  for(i=0;i<n;i++){
    a = pts[i]; b = pts[(i+1)%n];
    if(a[0] >= x0 && a[0] <= x1){ if(a[1]<lo)lo=a[1]; if(a[1]>hi)hi=a[1]; }
    if((a[0]-x0)*(b[0]-x0) < 0){ t=(x0-a[0])/(b[0]-a[0]); y=a[1]+(b[1]-a[1])*t; if(y<lo)lo=y; if(y>hi)hi=y; }
    if((a[0]-x1)*(b[0]-x1) < 0){ t=(x1-a[0])/(b[0]-a[0]); y=a[1]+(b[1]-a[1])*t; if(y<lo)lo=y; if(y>hi)hi=y; }
  }
  return lo<=hi ? [lo,hi] : null;
}

// настоящее пересечение игрока с фигурой (для шипов, монет, кнопок)
function overlaps(o, x, y, w, h){
  var bb = bbox(o);
  if(x >= bb[2] || x+w <= bb[0] || y >= bb[3] || y+h <= bb[1]) return false;
  var sp = spanX(polyOf(o), y + 2, y + h - 2);
  return !!sp && x < sp[1] && x+w > sp[0];
}

// точка внутри фигуры — для выделения в редакторе
function inside(o, x, y){
  var pts = polyOf(o), n = pts.length, i, j, r = false;
  for(i=0, j=n-1; i<n; j=i++){
    if(((pts[i][1] > y) !== (pts[j][1] > y)) &&
       (x < (pts[j][0]-pts[i][0])*(y-pts[i][1])/(pts[j][1]-pts[i][1]) + pts[i][0])) r = !r;
  }
  return r;
}

function step(){
  anim++;
  objects.forEach(function(o){
    // Движение и вращение — свойства объекта, а не отдельные типы.
    // Так двигаться и крутиться может любой блок, круг или треугольник.
    if(o.moves){
      o._t += 0.012*(o.speed||1);
      var k = (Math.sin(o._t)+1)/2;
      var nx = o._hx + (o.moveX||0)*k, ny = o._hy + (o.moveY||0)*k;
      o._dx = nx-o.x; o._dy = ny-o.y; o.x = nx; o.y = ny;
    }
    if(o.spins) o._spin += (o.spin||2)*0.02;
    if(o._squash) o._squash *= 0.82;
  });
  if(shake > 0) shake *= 0.86;
  stepParts();
  if(done || pl.dead) return;

  timeMs += 16.67;
  document.getElementById("sTime").textContent = (timeMs/1000).toFixed(1);

  // рядом с игроком объектов мало — дальние даже не проверяем
  var near = nearby(pl.x - 260, pl.y - 260, pl.w + 520, pl.h + 520);
  var sol = [], i;
  for(i=0;i<near.length;i++) if(solid(near[i])) sol.push(near[i]);

  /* ── СОСТОЯНИЕ ВОДЫ ──
     Берём самую высокую воду, перекрывающую игрока по горизонтали.
     depth — насколько игрок ушёл под поверхность, under — глубоко ли
     он в воде (по нему пускаем пузыри и подмешиваем воду к силуэту). */
  var wtr = null;
  for(i=0;i<near.length;i++){
    var wo = near[i];
    if(wo.type !== "water" || opened(wo)) continue;
    var wb = bbox(wo);
    if(Math.min(pl.x + pl.w, wb[2]) - Math.max(pl.x, wb[0]) < 2) continue;
    if(!wtr || wb[1] < wtr.top) wtr = {top: wb[1], o: wo};
  }
  var depth = wtr ? pl.y + pl.h - wtr.top : -1;
  /* ── ЖИДКИЕ ЛУЖИ ── налитая вода — частицы: считаем покрытие тела
     игрока. Жидкая поверхность выигрывает у прямоугольной, если она
     выше: плыть можно и там, и там. */
  var liqHit = liqCoverPlayer(), liqAcid = false;
  if(liqHit){
    var ld = pl.y + pl.h - liqHit.top;
    if(ld > depth){
      depth = ld;
      if(wtr){ if(liqHit.top < wtr.top) wtr.top = liqHit.top; }
      else wtr = {top: liqHit.top, o: null};
      liqAcid = liqHit.acid;
    }
  }
  var inWater = depth > 6;                        // ноги в воде — включается физика воды
  pl._under = inWater && (pl.y + pl.h*0.4) > wtr.top;   // верх тела под поверхностью
  /* кислота из струи — те же частицы: как и авторский кислотный бассейн,
     убивает при настоящем контакте (частицы покрывают тело игрока) */
  if(liqAcid && depth > 8) die();
  /* вход в воду и выпрыгивание из неё — эффекты, привязанные к скорости:
     с высоты ныряешь с брызгами, а всплываешь с тихим плеском */
  if(inWater && !pl._wasWater && pl.vy > 3.2){
    splash(pl.x+pl.w/2, wtr.top, pl.vy);
    if(wtr.o) disturb(wtr.o, pl.x+pl.w/2, pl.vy*0.6, 4);      // волны от прыжка в воду
    else liqPlow(pl.x-8, pl.y-6, pl.w+16, pl.h+12, 0, 2.4);   // частицы расходятся от плюха
  }
  if(!inWater && pl._wasWater && pl.vy < -3.5){
    splash(pl.x+pl.w/2, pl.y+pl.h, -pl.vy*0.55);
    if(wtr && wtr.o) disturb(wtr.o, pl.x+pl.w/2, -pl.vy*0.35, 3);
  }
  pl._wasWater = inWater;
  // пловец под водой выдыхает — пузыри всплывают сами
  if(pl._under && anim % 36 === 0)
    parts.push({x: pl.x+pl.w/2 + (pl.face > 0 ? 4 : -4), y: pl.y+7,
                vx:(Math.random()-.5)*.3, vy:-.4, f:1, life:52, max:52,
                c:"#bfdbfe", r:1.2+Math.random()*1.5});
  // плывущий игрок гонит перед собой волну
  if(inWater && Math.abs(pl.vx) > 0.9 && anim % 5 === 0){
    if(wtr.o) disturb(wtr.o, pl.x + (pl.vx > 0 ? pl.w : 0), pl.vx*0.14, 2.5);
    else liqPlow(pl.x-12, pl.y-8, pl.w+24, pl.h+16, pl.vx*0.38, -0.5);
  }

  var dir = (keys.r?1:0)-(keys.l?1:0);
  if(dir){
    /* в воде разгон и предельная скорость ниже — среда вязкая */
    pl.vx += dir*moveA()*(inWater ? WTR_ACC : 1);
    var cap = maxVX()*(inWater ? WTR_MAXVX : 1);
    pl.vx = Math.max(-cap, Math.min(cap, pl.vx)); pl.face = dir;
  } else {
    pl.vx *= pl.ground ? FRIC : (inWater ? WTR_VXDRAG : AIR);
    if(Math.abs(pl.vx) < .05) pl.vx = 0;
  }

  if(coy > 0) coy--;
  if(buf > 0) buf--;

  {
    /* Кнопку прыжка можно держать: как только игрок коснулся земли,
       он прыгает снова, без повторного нажатия. */
    if(keys.u && !pl.selfJump && (pl.ground || coy > 0)) buf = BUFFER;
    if(buf > 0){
      /* Карабканья по стенам нет: от стены не оттолкнуться и по ней
         не забраться. Остаётся только скольжение — см. WALL_SLIDE ниже. */
      if(coy > 0 || pl.ground){
        pl.vy = jumpV(); buf = 0; coy = 0; pl.ground = false; pl.selfJump = true;
        puff(pl.x+pl.w/2, pl.y+pl.h, 5);
      }
    }
    if(!keys.u && pl.vy < 0 && pl.selfJump) pl.vy += G()*0.68;  // short hop on early release

    if(inWater){
      /* ── ПЛАВАНИЕ ──
         Вода гасит скорость, гравитация в ней слабая. Держишь прыжок —
         плаваешь вверх; у самой поверхности тот же прыжок выбрасывает
         на берег. Толчок один на каждое погружение: выпрыгивать
         бесконечно из одной лужи нельзя, но нырнул заново — можно. */
      pl.vx *= WTR_VXDRAG;
      pl.vy *= WTR_VYDRAG;
      if(keys.u){
        if(!pl.ground && depth < WTR_OUT && !pl._kick && pl.vy > -6){
          pl.vy = jumpV()*WTR_KICK; pl._kick = true; pl.selfJump = true;
          buf = 0; coy = 0;
          splash(pl.x+pl.w/2, wtr.top, 4);       // брызги от толчка о воду
          if(wtr.o) disturb(wtr.o, pl.x+pl.w/2, 2.2, 3);
          else liqPlow(pl.x-8, pl.y-6, pl.w+16, pl.h+12, 0, -2.2);
        } else if(!pl.ground){
          pl.vy -= G()*WTR_SWIM;                 // гребки, пока держится прыжок
        }
      } else pl._kick = false;
      if(pl.vy < -WTR_UPMAX) pl.vy = -WTR_UPMAX;
    } else pl._kick = false;

    pl.vy += G()*(inWater ? WTR_GRAV : 1);
    // трение о стену — только в воздухе: в воде пловец и так вязкий
    if(!inWater && pl.wall !== 0 && pl.vy > WALL_SLIDE) pl.vy -= (pl.vy - WALL_SLIDE) * 0.55;
    var fallCap = maxFall()*(inWater ? WTR_FALL : 1);
    if(pl.vy > fallCap) pl.vy = fallCap;
  }


  pl.x += pl.vx; pl.wall = 0;
  sol.forEach(function(o){
    var bb = bbox(o);
    if(pl.x >= bb[2] || pl.x+pl.w <= bb[0] || pl.y >= bb[3] || pl.y+pl.h <= bb[1]) return;
    var P = polyOf(o);
    // полосу чуть поджимаем: иначе стоя точно на блоке игрок цепляет
    // его боком и его выталкивает вбок
    var sp = spanX(P, pl.y + 2, pl.y + pl.h - 2);
    if(!sp || pl.x >= sp[1] || pl.x + pl.w <= sp[0]) return;

    // пологий подъём: на склон и невысокий уступ игрок заходит, а не упирается
    if(pl.ground){
      var top = spanY(P, pl.x + 2, pl.x + pl.w - 2);
      if(top && pl.y + pl.h - top[0] <= STEP_UP && top[0] < pl.y + pl.h){
        pl.y = top[0] - pl.h;
        return;
      }
    }
    if(pl.vx > 0){ pl.x = sp[0] - pl.w; pl.wall = 1; }
    else if(pl.vx < 0){ pl.x = sp[1]; pl.wall = -1; }
    else { pl.x = (pl.x + pl.w/2 < (sp[0]+sp[1])/2) ? sp[0] - pl.w : sp[1]; }
    /* Рикошет отражает движение, а не гасит его. Медленное касание не
       отражаем — иначе игрок дрожит, прижавшись к блоку. */
    if(o.ricochet && Math.abs(pl.vx) > RICO_MIN) ricochet(o);
    else pl.vx = 0;
  });

  var wasAir = !pl.ground;
  pl.y += pl.vy; pl.ground = false;
  sol.forEach(function(o){
    var bb = bbox(o);
    if(pl.x >= bb[2] || pl.x+pl.w <= bb[0] || pl.y >= bb[3] || pl.y+pl.h <= bb[1]) return;
    var P = polyOf(o);
    var sp = spanY(P, pl.x + 2, pl.x + pl.w - 2);
    if(!sp || pl.y >= sp[1] || pl.y + pl.h <= sp[0]) return;

    if(pl.vy >= 0 && pl.y + pl.h - sp[0] <= Math.max(2, pl.vy + 2)){
      pl.y = sp[0] - pl.h; pl.ground = true; coy = COYOTE;
      // приземление сверху: рикошет швыряет игрока обратно по нормали грани
      if(o.ricochet && pl.vy > RICO_MIN){
        ricochet(o);
      } else {
        if(wasAir && pl.vy > 6) puff(pl.x+pl.w/2, pl.y+pl.h, 5);
        pl.vy = 0; pl.selfJump = false;
      }
      if(o.moves){ pl.x += o._dx||0; pl.y += o._dy||0; }
    } else if(pl.vy < 0){
      // удар головой снизу
      if(o.ricochet && Math.abs(pl.vy) > RICO_MIN){ pl.y = sp[1]; ricochet(o); }
      else { pl.y = sp[1]; pl.vy = 0; }
    } else {
      pl.y = sp[0] - pl.h; pl.ground = true; coy = COYOTE; pl.vy = 0; pl.selfJump = false;
    }
  });
  if(pl.ground) pl.wall = 0;

  pl.hidden = false;
  near.forEach(function(o){
    var over = overlaps(o, pl.x, pl.y, pl.w, pl.h);
    // зашёл в укрытие — искатель не видит ни фигуру, ни ник
    if(over && o.hideSpot === true) pl.hidden = true;
    if(!over){
      if(o.type === "button" && o._act){ o._act = false; drive(o); }
      if(o.type === "lever") o._latch = false;
      return;
    }
    if(hazard(o)){ die(); return; }
    if(o.type === "coin" && !o._got){
      o._got = true; coins++; stat();
      burst(o.x+o.w/2, o.y+o.h/2, 12, "#fbbf24", 3, 26);
    }
    if(o.type === "checkpoint" && !o._reached){
      o._reached = true; spawnPt = {x:o.x, y:o.y+o.h-pl.h};
      burst(o.x+o.w/2, o.y+o.h*0.25, 14, "#4ade80", 2.6, 30);
    }
    // Дверь — это выход. В игре на двоих уровень засчитывается, когда
    // в неё вошли ВСЕ игроки; одному достаточно дойти самому.
    if(o.type === "finishline" && !done){
      done = true; shake = 6;
      burst(o.x+o.w/2, o.y+o.h/2, 40, "#fbbf24", 5, 60);
      showMsg("ФИНИШ!",
              "Время " + (timeMs/1000).toFixed(1) + "с · монет " + coins + "/" + coinsTotal +
              " · смертей " + deaths + "   —   новый забег через мгновение");
      /* Карта запускается заново сама: ни кнопок, ни перезагрузки. Пара
         секунд — чтобы успеть увидеть время и салют, дальше снова старт. */
      clearTimeout(finishTimer);
      finishTimer = setTimeout(function(){ if(playing && done) restartRun(); }, 2200);
    }
    if(o.type === "button" && !o._act){ o._act = true; drive(o); }
    if(o.type === "lever" && !o._latch){ o._act = !o._act; o._latch = true; drive(o); }
  });

  if(pl.y > 5000) die();
}
function drive(src){
  if(!src.targetIds) return;
  var ids = src.targetIds.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  objects.forEach(function(o){ if(o.customId && ids.indexOf(o.customId) !== -1) o._act = src._act; });
}
function follow(){
  var tx = VW()/2 - (pl.x+pl.w/2)*view.s, ty = VH()*0.6 - (pl.y+pl.h/2)*view.s;
  view.x += (tx-view.x)*0.12; view.y += (ty-view.y)*0.12;
}

/* ══════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════ */
function drawGrid(){
  if(!grid || playing) return;
  var step = GRID * view.s;
  while(step < 9) step *= 2;
  var ox = view.x % step, oy = view.y % step;
  ctx.strokeStyle = "#e6eaf1"; ctx.lineWidth = 1;
  ctx.beginPath();
  for(var x = ox; x < VW(); x += step){ ctx.moveTo(x,0); ctx.lineTo(x,VH()); }
  for(var y = oy; y < VH(); y += step){ ctx.moveTo(0,y); ctx.lineTo(VW(),y); }
  ctx.stroke();
  ctx.strokeStyle = "#cfd6e2"; ctx.lineWidth = 1.4; ctx.beginPath();
  ctx.moveTo(view.x,0); ctx.lineTo(view.x,VH()); ctx.moveTo(0,view.y); ctx.lineTo(VW(),view.y);
  ctx.stroke();
}
function paint(o, isSel){
  if(o.type === "coin" && o._got) return;
  var open = opened(o);
  ctx.save();
  ctx.translate(o.x+o.w/2, o.y+o.h/2);
  ctx.rotate(o.spins && playing ? (o._spin||0) : (o.rot||0)*Math.PI/180);
  ctx.translate(-o.w/2, -o.h/2);
  if(open) ctx.globalAlpha = .2;
  if(o.ghost) ctx.globalAlpha *= .45;      // проходимые видно, но они не мешают
  (PAINT[o.type] || PAINT.rect)(o);
  if(!playing && o.deadly && DEADLY_BY_DEFAULT.indexOf(o.type) === -1){
    ctx.globalAlpha = 1; ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2;
    ctx.setLineDash([5,4]); ctx.strokeRect(-1,-1,o.w+2,o.h+2); ctx.setLineDash([]);
  }
  // укрытие для пряток видно только в редакторе — зелёной рамкой
  if(!playing && o.hideSpot){
    ctx.globalAlpha = 1; ctx.strokeStyle = "#16a34a"; ctx.lineWidth = 2;
    ctx.setLineDash([3,3]); ctx.strokeRect(-2,-2,o.w+4,o.h+4); ctx.setLineDash([]);
  }
  ctx.restore();
  if(isSel && o.type !== "spawn"){
    var k = 1/view.s;
    ctx.save();
    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 1.6*k; ctx.setLineDash([5*k,4*k]);
    ctx.strokeRect(o.x-3*k, o.y-3*k, o.w+6*k, o.h+6*k); ctx.setLineDash([]);
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 1.6*k;
    grips(o).forEach(function(h){

/* ══════════════════════════════════════════════════
   ВОДА РИСУЕТСЯ В ТРИ ПРОХОДА
   Первый — все блоки и объекты карты, вода в нём не участвует.
   Второй — тела воды: волны, пузыри, глубина. Вода всегда ложится
   ПОВЕРХ блоков и не может спрятаться за платформой.
   Третий — плёнка и кромка поверх пловца: он читается «под водой»,

function waterOver(o){

  var steps = Math.max(6, Math.round(o.w/16));

  ctx.beginPath();
  ctx.moveTo(0, waterTop(o, 0));
  for(var i=1;i<=steps;i++){ var wx = o.w*i/steps; ctx.lineTo(wx, waterTop(o, wx)); }

  bg.addColorStop(0,"#fbfcfe"); bg.addColorStop(1,"#eef2f8");
  ctx.fillStyle = bg; ctx.fillRect(0,0,VW(),VH());
  drawGrid();

  var sx = shake > .4 ? (Math.random()-.5)*shake : 0, sy = shake > .4 ? (Math.random()-.5)*shake : 0;
  ctx.setTransform(view.s*DPR,0,0,view.s*DPR, (view.x+sx)*DPR, (view.y+sy)*DPR);

  // рисуем только то, что попадает на экран
  var vx0 = -view.x/view.s - 80, vy0 = -view.y/view.s - 80;
  var vx1 = vx0 + VW()/view.s + 160, vy1 = vy0 + VH()/view.s + 160;
  var drawn = 0;

     прятаться за чёрной платформой. Раньше порядок зависел от очереди
     создания — лужа, нарисованная раньше блока, исчезала за ним, и
     казалось, что вода упала «за объекты» и утекла насквозь. */

    /* Точка старта — это метка для автора карты, а не второй игрок.
       Во время игры её не рисуем: иначе на экране две фигуры, живая и
       та, что стоит на месте спавна. */
    if(playing && ro.type === "spawn") continue;
    paint(ro, !playing && ro === sel); drawn++;
  }
  for(var wb=0; wb<objects.length; wb++){
    var wo0 = objects[wb];
    if(wo0.type !== "water" || opened(wo0)) continue;
    var wb0 = bbox(wo0);
    if(wb0[2] < vx0 || wb0[0] > vx1 || wb0[3] < vy0 || wb0[1] > vy1) continue;
    paint(wo0, !playing && wo0 === sel); drawn++;
  }
  /* Жидкость-частицы — тем же проходом, что и прямоугольная вода:
    рисуется ПОВЕРХ блоков и не может спрятаться за платформой. */
  /* вода не должна уметь убивать кадр: одна плохая частица гасит
     исключение здесь, а не вместе с петлёй отрисовки */

    ctx.save(); ctx.translate(pl.x, pl.y);

  }

  for(var wi=0; wi<objects.length; wi++){
    var wo = objects[wi];
    if(wo.type !== "water" || opened(wo)) continue;
    var wb = bbox(wo);
    if(wb[2] < vx0 || wb[0] > vx1 || wb[3] < vy0 || wb[1] > vy1) continue;
    waterOver(wo);
  }
  /* и жидкая пелена поверх пловца: стоящий в луже читается «в воде» */
  try{ drawLiquid(0.26); }catch(e){}

}
function loop(ts){
  if(playing){
    if(!last) last = ts;
    var dt = Math.min(100, ts-last); last = ts; acc += dt;
    var g = 0;
    while(acc >= 16.667 && g < 5){ step(); acc -= 16.667; g++; }
    if(g >= 5) acc = 0;
    follow();

  stepAlways();
  requestAnimationFrame(loop);
}
/* Что живёт и вне забега: пружины волн качаются всегда — вода дышит,
   даже когда карту просто редактируешь. Струя из курсора работает
   только в редактировании: во время игры карту лить нельзя. */
function stepAlways(){
  /* Частицы стареют и вне забега: раньше stepParts звался только в игре,
     и брызги, налитые в редакторе, жили вечно — копились десятками тысяч
     и на каждом кадре рисовались заново, отчего игра «крашилась» после
     долгого литья. Теперь брызги гаснут всегда. */
  if(!playing) stepParts();
  stepAllSurfs();
  liqStep();                 // жидкие частицы текут всегда: и в редакторе, и в игре
  if(pour || pourParts.length) stepPour();   // капли доливаются и во время игры
  flowStep();          // осевшая вода живёт своей жизнью: стекает и растекается
}
